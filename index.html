<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>马工程《管理学》· 智能复习与模拟自测</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#f2f5f9;color:#1f2937;font-size:16.5px;line-height:1.7;-webkit-font-smoothing:antialiased}
#app{max-width:900px;margin:0 auto;padding-bottom:90px;min-height:100vh;background:#f2f5f9}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;height:56px;padding:0 12px;background:#fff;border-bottom:1px solid #e5e9f0}
.topbar .back{border:none;background:#eef2f8;color:#2563eb;font-size:15px;padding:7px 12px;border-radius:20px;cursor:pointer;white-space:nowrap;font-weight:600}
.topbar .back:active{background:#dde6f5}
.topbar .title{flex:1;text-align:center;font-size:16px;font-weight:700;color:#111827;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .extra{font-size:15px;font-weight:700;color:#dc2626;min-width:56px;text-align:right}
.topbar .icon-btn{border:none;background:#eef2f8;color:#5b6472;font-size:12.5px;padding:6px 10px;border-radius:14px;cursor:pointer;font-weight:700;white-space:nowrap}
.topbar .icon-btn:active{background:#dde6f5}
.home-hero{background:linear-gradient(135deg,#2563eb,#4f8cf7);color:#fff;padding:28px 22px 26px;border-radius:0 0 22px 22px;box-shadow:0 6px 18px rgba(37,99,235,.18)}
.home-hero h1{font-size:21px;margin:0 0 6px;font-weight:800;letter-spacing:.5px}
.home-hero p{margin:0;font-size:13px;opacity:.92;line-height:1.6}
.home-stat{display:flex;gap:10px;margin-top:16px}
.home-stat div{flex:1;background:rgba(255,255,255,.18);border-radius:12px;padding:10px 6px;text-align:center;backdrop-filter:blur(4px)}
.home-stat b{display:block;font-size:18px;font-weight:800}
.home-stat span{font-size:11.5px;opacity:.9}
.home-grid{padding:16px 14px;display:grid;gap:12px}
.card{background:#fff;border-radius:16px;padding:18px 16px;box-shadow:0 2px 10px rgba(17,24,39,.06);display:flex;align-items:center;gap:14px;cursor:pointer;transition:.12s;border:1px solid #eef1f6}
.card:active{transform:scale(.985)}
.card .icon{width:50px;height:50px;border-radius:14px;flex:0 0 50px;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800;color:#fff}
.ic1{background:#2563eb}.ic2{background:#0891b2}.ic3{background:#ea580c}.ic4{background:#dc2626}.ic5{background:#7c3aed}.ic6{background:#059669}.ic7{background:#b91c1c}
.card .txt{flex:1}
.card .txt h3{margin:0 0 3px;font-size:16.5px;font-weight:700;color:#111827}
.card .txt p{margin:0;font-size:12.5px;color:#6b7280}
.card .arrow{color:#c3cbd8;font-size:19px}
.progress-ring{width:70px;height:70px;position:relative;flex:0 0 70px}
.progress-ring svg{transform:rotate(-90deg);width:70px;height:70px}
.progress-ring circle{fill:none;stroke-width:6}
.progress-ring .bg{stroke:rgba(255,255,255,.3)}
.progress-ring .fg{stroke:#fff;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.progress-ring .pct{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:14px;font-weight:800;color:#fff}
.sec-list{padding:14px;display:grid;gap:10px}
.sec-item{background:#fff;border-radius:14px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 6px rgba(17,24,39,.05);cursor:pointer;border:1px solid #eef1f6}
.sec-item:active{background:#f7f9fc}
.sec-item .nm{font-size:15.5px;font-weight:600;color:#1f2937}
.sec-item .cnt{font-size:12.5px;color:#9aa4b2;margin-top:2px}
.sec-item .go{color:#c3cbd8;font-size:18px}
.qwrap{padding:14px}
.qhead{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:#6b7280;margin-bottom:10px;padding:0 2px}
.qhead .badge{background:#e8efff;color:#2563eb;font-weight:700;padding:3px 10px;border-radius:20px;font-size:11.5px}
.progress{height:6px;background:#e5e9f0;border-radius:6px;overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#4f8cf7);border-radius:6px;transition:width .25s}
.qcard{background:#fff;border-radius:16px;padding:18px 16px;box-shadow:0 2px 10px rgba(17,24,39,.06);border:1px solid #eef1f6}
.qtype{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:6px;margin-bottom:10px}
.t-single{background:#e8efff;color:#2563eb}
.t-multi{background:#e6f7f1;color:#0d9488}
.t-judge{background:#f3e8ff;color:#7c3aed}
.t-term{background:#fef3e2;color:#d97706}
.t-short{background:#fdeaea;color:#dc2626}
.t-case{background:#fce7f3;color:#db2777}.t-essay{background:#fee2e2;color:#b91c1c}
.qtext{font-size:17px;font-weight:600;color:#111827;line-height:1.75;margin-bottom:14px;word-break:break-word}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:11px;align-items:flex-start;background:#f8fafc;border:1.5px solid #e6ebf2;border-radius:12px;padding:12px 14px;cursor:pointer;transition:.14s;font-size:16px;line-height:1.6}
.opt:active{background:#eef3fa;transform:scale(.985)}
.opt .k{flex:0 0 26px;height:26px;border-radius:50%;background:#dfe6ef;color:#5b6472;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13.5px;margin-top:1px}
.opt.sel{border-color:#2563eb;background:#eef4ff}
.opt.sel .k{background:#2563eb;color:#fff}
.opt.ok{border-color:#16a34a;background:#eefaf1}
.opt.ok .k{background:#16a34a;color:#fff}
.opt.bad{border-color:#dc2626;background:#fdeeee}
.opt.bad .k{background:#dc2626;color:#fff}
.judge-opts{display:flex;gap:12px;margin-top:6px}
.judge-opt{flex:1;padding:20px 12px;border-radius:14px;border:2px solid #e6ebf2;background:#f8fafc;text-align:center;font-size:20px;font-weight:800;cursor:pointer;transition:.15s;color:#5b6472}
.judge-opt:active{transform:scale(.97)}
.judge-opt.sel-true{border-color:#16a34a;background:#eefaf1;color:#16a34a}
.judge-opt.sel-false{border-color:#dc2626;background:#fdeeee;color:#dc2626}
.judge-opt.ok{border-color:#16a34a;background:#eefaf1;color:#16a34a}
.judge-opt.bad{border-color:#dc2626;background:#fdeeee;color:#dc2626}
.explain{margin-top:16px;border-radius:14px;padding:14px 16px;background:#f7faf8;border-left:5px solid #16a34a;font-size:15px;line-height:1.8}
.explain.bad{background:#fdf7f7;border-left-color:#dc2626}
.explain .res{font-weight:800;margin-bottom:8px;font-size:15.5px}
.explain .res.ok{color:#16a34a}
.explain .res.bad{color:#dc2626}
.explain .ansline{color:#111827;font-weight:700;margin-bottom:6px;font-size:14.5px}
.explain .body{color:#374151;white-space:pre-wrap;word-break:break-word}
.subj{margin-top:14px;background:#fffaf0;border:1.5px dashed #f0c88a;border-radius:14px;padding:14px 15px}
.subj .ansbox{background:#fff;border-radius:10px;padding:13px 14px;margin-top:11px;font-size:15px;line-height:1.85;color:#374151;white-space:pre-wrap;word-break:break-word;border:1px solid #f2e3c8}
.btn{display:inline-block;border:none;border-radius:11px;padding:11px 20px;font-size:15.5px;font-weight:700;cursor:pointer;transition:.14s;font-family:inherit}
.btn:active{transform:scale(.97)}
.btn-p{background:#2563eb;color:#fff}
.btn-g{background:#16a34a;color:#fff}
.btn-r{background:#dc2626;color:#fff}
.btn-o{background:#fff;color:#2563eb;border:1.5px solid #2563eb}
.btn-gray{background:#eef2f8;color:#4b5563}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.footerbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-top:1px solid #e5e9f0;padding:10px 12px;display:flex;gap:8px;justify-content:center;max-width:900px;margin:0 auto}
.footerbar .btn{flex:1;max-width:200px;padding:13px 0;font-size:15.5px;white-space:nowrap}
@media (max-width:360px){.footerbar .btn{font-size:13px;padding:11px 0}}
.pad{height:76px}
.answer-card{position:fixed;left:0;right:0;bottom:0;z-index:80;background:#fff;border-top:1px solid #e5e9f0;padding:16px 14px 20px;max-height:60vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s ease;border-radius:18px 18px 0 0;box-shadow:0 -4px 20px rgba(17,24,39,.1)}
.answer-card.open{transform:translateY(0)}
.answer-card .ac-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.answer-card .ac-head h3{margin:0;font-size:16px;color:#111827}
.answer-card .ac-head .close{border:none;background:#eef2f8;color:#5b6472;padding:6px 12px;border-radius:14px;font-size:13px;font-weight:700;cursor:pointer}
.card-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:4px 0}
@media (max-width:380px){.card-grid{grid-template-columns:repeat(5,1fr);gap:6px}}
.card-num{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:700;cursor:pointer;border:1.5px solid #e6ebf2;background:#f8fafc;color:#5b6472;transition:.12s}
.card-num.done{background:#e8efff;border-color:#2563eb;color:#2563eb}
.card-num.marked{background:#fef3e2;border-color:#d97706;color:#d97706}
.card-num.current{background:#2563eb;color:#fff;border-color:#2563eb;transform:scale(1.05)}
.card-legend{display:flex;gap:14px;margin-top:12px;font-size:12px;color:#6b7280;flex-wrap:wrap}
.card-legend span{display:flex;align-items:center;gap:4px}
.card-legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.result-hero{margin:14px;border-radius:18px;padding:24px 18px;text-align:center;color:#fff;background:linear-gradient(135deg,#2563eb,#4f8cf7);box-shadow:0 6px 18px rgba(37,99,235,.2);position:relative}
.result-hero.pass{background:linear-gradient(135deg,#16a34a,#22c55e)}
.result-hero.fail{background:linear-gradient(135deg,#dc2626,#f97316)}
.result-ring{width:120px;height:120px;position:relative;margin:0 auto 10px}
.result-ring svg{transform:rotate(-90deg);width:120px;height:120px}
.result-ring circle{fill:none;stroke-width:9}
.result-ring .bg{stroke:rgba(255,255,255,.25)}
.result-ring .fg{stroke:#fff;stroke-linecap:round;transition:stroke-dashoffset 1s ease}
.result-ring .score{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:32px;font-weight:900;color:#fff;line-height:1}
.result-ring .score small{font-size:14px;font-weight:600;opacity:.85}
.result-hero .sub{margin-top:6px;font-size:14.5px;opacity:.95}
.rstats{display:flex;gap:10px;margin:0 14px 14px}
.rstats div{flex:1;background:#fff;border-radius:13px;padding:12px 6px;text-align:center;box-shadow:0 1px 6px rgba(17,24,39,.05)}
.rstats b{display:block;font-size:20px;font-weight:800}
.rstats span{font-size:12px;color:#6b7280}
.weak-chapters{background:#fff;border-radius:14px;padding:16px;margin:0 14px 14px;box-shadow:0 1px 6px rgba(17,24,39,.05)}
.weak-chapters h4{font-size:14px;color:#374151;margin:0 0 12px;font-weight:700}
.weak-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.weak-bar .name{font-size:12.5px;color:#374151;width:110px;flex-shrink:0;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.weak-bar .bar-bg{flex:1;height:8px;background:#e5e9f0;border-radius:4px;overflow:hidden}
.weak-bar .bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#dc2626,#f97316);transition:width .6s ease}
.weak-bar .pct{font-size:11.5px;color:#dc2626;font-weight:700;width:38px}
.empty{text-align:center;padding:70px 20px;color:#9aa4b2;font-size:15px}
.empty .big{font-size:46px;margin-bottom:12px;opacity:.5}
.wrongitem{background:#fff;border-radius:14px;padding:15px 16px;margin-bottom:11px;box-shadow:0 1px 6px rgba(17,24,39,.05);border:1px solid #eef1f6}
.wrongitem .qt{font-size:15.5px;font-weight:600;color:#111827;line-height:1.7;margin-bottom:9px}
.wrongitem .meta{font-size:12.5px;color:#9aa4b2;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
.tag{font-size:11.5px;padding:2px 8px;border-radius:6px;background:#eef2f8;color:#5b6472;font-weight:700}
.tag.ok{background:#eefaf1;color:#16a34a}
.tag.bad{background:#fdeeee;color:#dc2626}
.tag.mark{background:#fef3e2;color:#d97706}
.mt14{margin-top:14px}
.mb14{margin-bottom:14px}
.note{font-size:13px;color:#6b7280;padding:0 16px 10px;line-height:1.7}
body.immersive .topbar .title{display:none}
body.immersive .topbar .extra{display:none}
body.immersive #app{padding-top:8px}
.mark-btn{border:none;background:#eef2f8;color:#5b6472;font-size:12.5px;padding:6px 10px;border-radius:14px;cursor:pointer;font-weight:700;white-space:nowrap}
.mark-btn.active{background:#fef3e2;color:#d97706}
.type-stats{background:#fff;border-radius:16px;padding:14px 12px;box-shadow:0 2px 10px rgba(17,24,39,.06);border:1px solid #eef1f6;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.type-stats .st{text-align:center;padding:10px 4px;border-radius:10px;background:#f8fafc}
.type-stats .st b{display:block;font-size:18px;font-weight:800;color:#2563eb;line-height:1.3}
.type-stats .st span{font-size:11.5px;color:#6b7280}
.type-grid{display:grid;gap:12px}
.exam-modes{display:grid;gap:12px;margin:6px 0 18px;text-align:left}
.exam-mode{border:2px solid #e6ebf2;border-radius:14px;padding:14px;background:#f8fafc;cursor:pointer;transition:.15s;display:flex;gap:12px;align-items:flex-start}
.exam-mode:active{transform:scale(.985)}
.exam-mode.sel{border-color:#2563eb;background:#eef4ff}
.exam-mode .radio{width:20px;height:20px;border-radius:50%;border:2px solid #c3cbd8;background:#fff;flex:0 0 20px;margin-top:2px;display:flex;align-items:center;justify-content:center}
.exam-mode.sel .radio{border-color:#2563eb}
.exam-mode.sel .radio::after{content:'';width:10px;height:10px;border-radius:50%;background:#2563eb}
.exam-mode .em-name{font-size:15.5px;font-weight:700;color:#111827}
.exam-mode .em-name em{font-style:normal;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:6px;vertical-align:1px}
.exam-mode .em-desc{font-size:12.5px;color:#6b7280;line-height:1.7;margin-top:3px}
.em-tag-a{background:#e8efff;color:#2563eb}
.em-tag-b{background:#e6f7f1;color:#0d9488}
.em-tag-c{background:#fdeaea;color:#dc2626}
.exam-score-row{display:flex;gap:10px;margin:0 14px 14px}
.exam-score-row div{flex:1;background:#fff;border-radius:13px;padding:12px 6px;text-align:center;box-shadow:0 1px 6px rgba(17,24,39,.05)}
.exam-score-row b{display:block;font-size:20px;font-weight:800}
.exam-score-row span{font-size:12px;color:#6b7280}
.subj-block{margin:0 14px 14px;background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 6px rgba(17,24,39,.05)}
.subj-block h4{font-size:15px;color:#111827;margin:0 0 12px;font-weight:700}
.subj-item{border:1.5px solid #eef1f6;border-radius:12px;padding:14px;margin-bottom:12px;background:#fbfcfe}
.subj-item .qt{font-size:15px;font-weight:600;color:#111827;line-height:1.7;margin-bottom:8px;white-space:pre-wrap;word-break:break-word}
.subj-item .ansbox{background:#fffaf0;border:1px dashed #f0c88a;border-radius:10px;padding:12px;font-size:14px;line-height:1.8;color:#374151;white-space:pre-wrap;word-break:break-word;margin-bottom:10px}
.subj-item .sub-q{font-size:13.5px;font-weight:700;color:#9d174d;margin:8px 0 4px}
.subj-item .score-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.subj-item .score-row label{font-size:13px;color:#6b7280}
.subj-item .score-row input{width:84px;padding:7px 8px;border:1.5px solid #e6ebf2;border-radius:9px;font-size:15px;font-weight:700;color:#111827;text-align:center;background:#fff}
.subj-item .score-row input:focus{outline:none;border-color:#2563eb}
.subj-item .max{font-size:12.5px;color:#9aa4b2}
</style>

<style id="ui-enhance">
/* UI增强层 */
:root{
  --primary:#2563eb;
  --bg:#f6f8fc;
  --card:#ffffff;
  --shadow:0 8px 24px rgba(15,23,42,.08);
}

body{
  background:
    radial-gradient(circle at top left,rgba(37,99,235,.08),transparent 35%),
    var(--bg);
}

#app{
  max-width:760px;
}

.topbar{
  height:60px;
  backdrop-filter:blur(12px);
  background:rgba(255,255,255,.88);

}

.home-hero{
  margin:0 0 14px;
  padding:34px 24px 30px;
  border-radius:0 0 30px 30px;
  background:linear-gradient(135deg,#1d4ed8,#60a5fa);
}

.home-hero h1{
  font-size:24px;
  letter-spacing:1px;
}

.card,.qcard,.sec-item,.wrongitem,.subj-block{
  border-radius:22px;

  border:none;

}

.card:hover,.sec-item:hover{
  transform:translateY(-3px);
}

.card{
  padding:20px 18px;
}

.card .icon{
  width:56px;
  height:56px;
  border-radius:18px;
  box-shadow:0 6px 14px rgba(37,99,235,.25);
}

.qcard{
  padding:22px 18px;
}

.qtext{
  font-size:18px;
  line-height:1.8;
}

.opt{
  border-radius:16px;
  padding:14px 15px;
  background:#f8fafc;
}

.opt:hover{
  background:#eff6ff;
}

.btn{
  border-radius:16px;
  box-shadow:0 5px 12px rgba(37,99,235,.15);
}

.btn-p{

}

.footerbar{
  backdrop-filter:blur(15px);
  background:rgba(255,255,255,.9);
}

.answer-card{
  border-radius:26px 26px 0 0;

.card-num{
  border-radius:12px;
}

.result-hero{
  border-radius:26px;
}

.progress{
  height:8px;

  body{
    font-size:16px;
  }
  .home-hero h1{
    font-size:21px;
  }
  .qtext{
    font-size:16.5px;
  }
}
</style>


<style id="ui-theme">

html[data-theme="dark"] .wrongitem,html[data-theme="dark"] .subj-block{background:#161b22;border-color:#232b36;box-shadow:0 8px 24px rgba(0,0,0,.35)}

html[data-theme="dark"] .opt.wrong{background:#3a1418;border-color:#a03040}

/* ===== 题库（逐题一行，便于维护） ===== */
{"ch":0,"t":"short","q":"简答：为什么说马克思主义是学习和研究管理学的根本指导思想？","a":"（1）马克思主义为管理学研究提供了科学的世界观和方法论，即辩证唯物主义和历史唯物主义。\n（2）辩证唯物主义要求从管理实践出发，用联系的、发展的、对立统一的观点揭示管理活动的规律；历史唯物主义要求把管理放到一定的社会生产方式和历史条件中考察，把握管理的自然属性与社会属性。\n（3）坚持马克思主义指导，才能正确认识管理中人与物、人与人以及组织与环境的关系，保证管理学研究和管理实践的正确方向。","e":"关键词：科学世界观方法论＋辩证唯物（联系发展矛盾）＋历史唯物（生产方式/两重属性）。","id":"mgmt-0001"},
{"ch":0,"t":"single","q":"管理学是研究（　　）的科学","o":["人类管理活动一般规律","企业管理活动的一般规律","行政管理活动的一般规律","经济活动运行规律"],"a":0,"e":"管理学是研究人类管理活动一般规律的科学。","id":"mgmt-0002"},
{"ch":0,"t":"single","q":"管理学学习和研究的目的不包括（　　）","o":["揭示管理活动一般规律","分析规律在特定时期的表现形式","探讨如何指导不同情境下的管理实践","创造管理理论本身"],"a":3,"e":"管理学学习和研究的目的就是在揭示管理活动一般规律的基础上，分析这种规律在特定时期的表现形式，探讨如何根据这种规律指导不同情境下的管理实践。","id":"mgmt-0003"},
{"ch":0,"t":"single","q":"管理学的研究对象主要是（　　）","o":["个体在日常活动中的行为及其管理","企业内部财务与营销等具体经营活动的管理","人类有组织的群体活动的管理","政府机关的行政管理"],"a":2,"e":"现代管理学通常通过剖析企业管理活动来描述和抽象管理活动的一般规律，其主要研究对象是人类有组织的群体活动的管理。","id":"mgmt-0004"},
{"ch":0,"t":"single","q":"被称为“科学管理之父”的是（　　）","o":["法约尔","泰勒","韦伯","梅奥"],"a":1,"e":"泰勒1911年出版《科学管理原理》，创立科学管理理论，被誉为“科学管理之父”。","id":"mgmt-0005"},
{"ch":0,"t":"single","q":"科学的管理思维是（　　）的统一","o":["战略思维、系统思维、创新思维、底线思维","历史思维、辩证思维、创新思维","战略思维、辩证思维、创新思维、底线思维","战略思维、历史思维、辩证思维、创新思维、底线思维"],"a":3,"e":"科学的管理思维是战略思维、历史思维、辩证思维、创新思维以及底线思维的统一。","id":"mgmt-0006"},
{"ch":0,"t":"multi","q":"管理学的研究对象包括（　　）","o":["对个体活动的管理","对群体活动的管理","对企业组织员工日常行为的管理","对一般组织的管理"],"a":[0,1,3],"e":"广义上来说，管理学的研究对象既包括对个体活动的管理，也包括对群体活动的管理。现代管理学通常通过剖析企业管理活动来描述和抽象管理活动的一般规律。","id":"mgmt-0007"},
{"ch":0,"t":"judge","q":"顺道无为、重人求和、预谋慎战、依法治理是中国古代管理思想的代表。","a":true,"e":"中国古代管理思想以顺道无为、重人求和、预谋慎战、依法治理为代表，四项均为教材所列的典型主张。","id":"mgmt-0008"},
{"ch":0,"t":"multi","q":"西方工厂制度早期的管理思想代表人物包括（　　）","o":["欧文","斯密","巴贝奇","泰勒"],"a":[0,1,2],"e":"欧文、斯密以及巴贝奇是在西方工厂制度早期对管理活动进行思考的代表人物。","id":"mgmt-0009"},
{"ch":0,"t":"multi","q":"学习管理学的意义包括（　　）","o":["了解管理的一般规律，掌握管理理论的基本规律","形成理性分析能力，学会用理论分析问题","提升以直觉判断为基础的决策或决断能力","替代管理实践经验的积累"],"a":[0,1,2],"e":"学习管理学可以了解管理的一般规律，形成理性分析能力，提升以直觉判断为基础的决策能力，最终指导管理实践。","id":"mgmt-0010"},
{"ch":0,"t":"judge","q":"管理学的研究对象主要是对个体活动的管理。","a":false,"e":"现代管理学主要研究对人类有组织的群体活动的管理。","id":"mgmt-0011"},
{"ch":0,"t":"judge","q":"泰勒被称为“组织理论之父”。","a":false,"e":"泰勒被称为“科学管理之父”，韦伯被称为“组织理论之父”。","id":"mgmt-0012"},
{"ch":0,"t":"judge","q":"管理学的系统形成和发展是人们对管理活动思考及其结晶的累积。","a":true,"e":"管理思想是不同时期人们关于管理活动思考的结晶，管理学的系统形成和发展即是这种思考及其结晶的累积。","id":"mgmt-0013"},
{"ch":0,"t":"judge","q":"理论联系实际是管理学学习和研究的基本方法。","a":true,"e":"理论联系实际是在马克思主义指导下学习和研究管理学的基本方法。","id":"mgmt-0014"},
{"ch":0,"t":"term","q":"名词解释：管理学","a":"管理学是研究人类管理活动一般规律的科学。答题时先完整写出这一教材核心定义；如需展开，可再说明其目的在于揭示一般规律、分析规律在特定时期的表现形式，并指导不同情境下的管理实践。","e":"核心句：研究人类管理活动一般规律的科学。","id":"mgmt-0015"},
{"ch":0,"t":"term","q":"名词解释：霍桑实验","a":"霍桑实验是指梅奥教授参与的于1927—1932年间在芝加哥西方电气公司霍桑工厂进行的系列实验。这个实验包括照明实验、继电器装配工人小组实验、大规模访问交谈、对接线板接线工作室的研究等几个阶段。","e":"结论：①工人是“社会人”；②企业中存在着“非正式组织”；③生产率主要取决于工人的工作态度以及他和周围人的关系。","id":"mgmt-0016"},
{"ch":0,"t":"term","q":"名词解释：管理理论的丛林","a":"美国管理学者孔茨把二战后众多管理学派并存的现象称为“管理理论的丛林”。不同学者分别从系统、决策、经验、权变等角度对企业管理问题进行了全方位的思考，管理学的理论框架因此而逐渐成熟。","e":"提出者：孔茨。","id":"mgmt-0017"},
{"ch":0,"t":"short","q":"简答：简述管理学的研究对象","a":"管理学是研究人类管理活动一般规律的科学。\n（1）广义上来说，管理学的研究对象既包括对个体活动的管理，也包括对群体活动的管理。\n（2）现代管理学通常通过剖析企业管理活动来描述和抽象管理活动的一般规律。把企业组织作为管理学的研究对象，是历史发展的选择。\n（3）对人的活动，或者说对人在活动中的行为与关系的协调，是企业以及其他有组织的群体活动管理的基本内容，因此在企业研究基础上抽象出的一般管理理论对其他类型组织的管理也具有普遍的指导意义。","e":"关键句：管理学是以各种管理工作中普遍适用的原理和方法作为研究对象的。","id":"mgmt-0018"},
{"ch":0,"t":"short","q":"简答：简述现代管理学的产生","a":"现代管理学的产生和发展源于工厂制度的产生和发展：\n（1）泰勒强调科学管理方法，于1911年发表《科学管理原理》，开启了科学管理之路。\n（2）法约尔致力于一般管理理论的研究和宣传，于1916年出版《工业管理与一般管理》，构建了管理研究的基本框架。\n（3）韦伯分析了官僚组织的构成要素和运行特点，提出并论证了官僚组织是理想的组织形态的观点。\n（4）梅奥通过霍桑实验，研究生产过程中“人”的因素，明确提出了企业员工是社会人的假设。\n（5）20世纪40年代后，管理学家从不同的研究视角探究企业管理问题，推动了管理理论丛林的产生和发展。","e":"答题要诀：按“泰勒—法约尔—韦伯—梅奥—管理理论丛林”的顺序展开。","id":"mgmt-0019"},
{"ch":0,"t":"short","q":"简答：简述管理学学习的目的和意义","a":"（1）学习管理学的目的，是在一般管理规律的基础上，深入挖掘不同时代背景、环境特征下，如何选择最合适的管理方法进行管理实践。\n（2）学习管理学的意义：\n①有助于个体了解并掌握管理理论的基本规律，更高效地进行管理活动，提高管理效率；\n②有助于理性分析和直觉判断相结合，提高分析问题和解决问题的能力；\n③有助于提升管理水平，应用于管理实践。通过管理理论和方法的学习，有助于明确组织在不同阶段的目标、使命和愿景，根据内外部环境变化及时调整组织发展方向，提高资源配置效率。","e":"三步“了解规律→提高能力→指导实践”。","id":"mgmt-0020"},
{"ch":0,"t":"case","q":"某高校土地资源管理专业大一新生在《管理学》绪论课上，围绕“管理学的研究对象”展开课堂辩论。有同学认为，管理学要研究人类的管理活动，就应把政府机关、学校、医院等一切有组织的活动都纳入研究对象；也有同学认为，管理学源于企业管理实践，其研究对象只应是企业。老师随即举例：某市土地储备中心运用目标管理方法推进年度土地收储计划，同样取得了良好效果，引发同学们进一步思考。\n问题：","sub":[{"q":"（1）结合管理的内涵与本质，说明管理学的研究对象。（4分）","a":"①管理是管理者为了有效地实现组织目标，对组织活动进行决策、组织、领导、控制并不断创新的过程；管理的本质是对组织成员在活动中的行为进行协调。②管理学的研究对象是人类的管理活动，重点是研究管理活动的一般规律，既包括对个体活动的管理，也包括对群体活动的管理。现代管理学通常通过剖析企业管理活动来抽象管理活动的一般规律。（采分点：管理定义1分、管理本质1分、研究对象及范围2分）"},{"q":"（2）在企业管理研究基础上抽象出的一般管理理论，对政府机关、事业单位等其他组织是否具有指导意义？请说明理由。（5分）","a":"①具有普遍的指导意义。②对人的活动，或者说对人在活动中的行为与关系的协调，是企业以及其他一切有组织的群体活动管理的基本内容；③因此，在企业管理基础上抽象出的一般管理理论，对政府机关、学校、医院等非营利组织的管理同样适用；④但运用时应结合各类组织自身的性质和特点灵活调整，不能生搬硬套。（采分点：明确结论1分、共性依据2分、灵活运用2分）"},{"q":"（3）案例中老师以土地储备中心为例的做法，体现了怎样的认识方法？对学习管理学有何启示？（4分）","a":"①体现了“从个别到一般、再从一般回到个别”的认识方法：从具体的管理实践中抽象出管理的一般规律，再用一般理论去指导具体的管理实践；②启示：学习管理学不仅要掌握基本概念和原理，更要学会运用理论分析现实中的管理问题，做到理论联系实际、学以致用；③言之有理、结合案例展开论述酌情给分。（采分点：认识方法2分、启示2分）"}],"e":"【答题思路】本题紧扣“管理的内涵与本质→研究对象→理论适用性”主线。作答要先亮明观点（研究对象是什么、理论是否适用），再分条论证，并尽量引用案例中“土地储备中心运用目标管理”的事实，切忌脱离案例只默写教材定义。","id":"mgmt-0021"},
{"ch":1,"t":"multi","q":"全球化经营中，国际直接投资（股权）进入方式主要有（　　）","o":["合资进入","独资进入","许可（特许）进入","新建进入"],"a":[0,1,3],"e":"国际直接投资形式：合资、独资、新建（绿地投资）、购并；出口和特许（许可）属贸易/非股权进入，不是直接投资。（了解即可，非重点）","id":"mgmt-0022"},
{"ch":1,"t":"multi","q":"当代管理活动所处的时代背景主要包括（　　）","o":["全球化","信息化","市场化","区域化"],"a":[0,1,2],"e":"三大时代背景：全球化、信息化、市场化。","id":"mgmt-0023"},
{"ch":1,"t":"single","q":"在信息化基础上，以大数据、人工智能等驱动业务与决策智能化的发展阶段是（　　）","o":["工业化阶段","数智化","电气化阶段","城镇化阶段"],"a":1,"e":"数智化是信息化的深化，强调用数据和智能技术重塑业务流程与管理决策。（了解即可，非重点）","id":"mgmt-0024"},
{"ch":1,"t":"judge","q":"市场化改革的核心之一，是使企业真正成为自主经营、自负盈亏、自我发展、自我约束的市场主体。","a":true,"e":"企业是市场经济活动的主要参加者，是国民经济的细胞；市场化改革关键在于确立企业的市场主体地位。","id":"mgmt-0025"},
{"ch":1,"t":"single","q":"企业开展全球化管理，最需要培育的关键能力是（　　）","o":["固定资产购建与生产能力扩张的能力","面向单一国内市场的本地促销能力","跨国公司的行政层级控制能力","跨文化管理与全球资源整合能力"],"a":3,"e":"全球化管理要求管理者具备国际视野、跨文化沟通与管理能力，以及在全球范围内整合资源、配置生产经营活动的能力。（了解即可，非重点）","id":"mgmt-0026"},
{"ch":1,"t":"single","q":"对于高层管理者而言，最重要的管理技能是（　　）","o":["生产一线的具体业务操作技能","概念技能","与上下级和外部沟通的人际技能","技术技能"],"a":1,"e":"管理者三种技能：①技术技能：基层管理者最重要；②人际技能：所有层级都重要；③概念技能：高层管理者最重要，用于洞察复杂环境、做战略判断。","id":"mgmt-0027"},
{"ch":1,"t":"single","q":"明茨伯格管理者角色理论中，下列不属于人际角色的是（　　）","o":["代表人","监督者","联络者","领导者"],"a":1,"e":"明茨伯格三大类角色：人际角色（代表人、领导者、联络者）；信息角色（监督者、传播者、发言人）；决策角色（企业家、冲突处理者、资源分配者、谈判者）。","id":"mgmt-0028"},
{"ch":1,"t":"multi","q":"罗伯特·卡茨提出管理者需要具备的基本技能包括（　　）","o":["技术技能","人际技能","概念技能","诊断技能"],"a":[0,1,2],"e":"①技术技能：完成专业业务；②人际技能：与人打交道；③概念技能：抽象思考、洞察全局。高层更看重概念技能，基层看重技术技能。","id":"mgmt-0029"},
{"ch":1,"t":"judge","q":"明茨伯格认为，管理者的决策角色包括企业家、冲突处理者、资源分配者和传播者。","a":false,"e":"明茨伯格的管理者角色中，决策角色为企业家、冲突处理者、资源分配者、谈判者；“传播者”属于信息角色，故本句错误。","id":"mgmt-0030"},
{"ch":1,"t":"judge","q":"基层管理者最需要的是概念技能。","a":false,"e":"基层管理者重点需要技术技能；高层管理者重点需要概念技能；人际技能各层级都不可或缺。","id":"mgmt-0031"},
{"ch":1,"t":"short","q":"简答：简述管理二重性（自然属性、社会属性）","a":"（1）管理自然属性：由生产力、社会化大生产决定；和社会制度无关，是合理组织生产力的客观要求。\n（2）管理社会属性：由生产关系、社会制度决定，体现生产资料所有者意志，维护特定生产关系。\n（3）二者辩证统一：现实管理活动同时兼具自然属性与社会属性。","e":"马工程教材开篇重要简答，区分生产力与生产关系角度。","id":"mgmt-0032"},
{"ch":1,"t":"single","q":"所有管理的最初目的都是要提高（　　）","o":["提高产品的质量水平","提高员工的满意度","资源利用效率","提高市场占有率"],"a":2,"e":"所有管理的最初目的都是要提高资源利用的效率。这源于资源本身以及获取资源能力的双重有限性。","id":"mgmt-0033"},
{"ch":1,"t":"single","q":"管理的本质是（　　）","o":["对组织所拥有的各种资源进行合理的配置","对组织目标及其实现途径所进行的决策","对组织成员在活动中的行为进行协调","对组织各项活动过程实施的监督与控制"],"a":2,"e":"任何活动都要靠人来完成，因此管理是对人或人的行为的管理，管理的本质从某种意义上说是对组织成员在活动中的行为进行协调。","id":"mgmt-0034"},
{"ch":1,"t":"single","q":"管理的首要原理是（　　）","o":["人本原理","系统原理","效益原理","适度原理"],"a":0,"e":"人是组织的中心，也是管理的中心，人本原理当是管理的首要原理。","id":"mgmt-0035"},
{"ch":1,"t":"single","q":"系统的基本特征是（　　）","o":["整体性","构成要素的相关性","结构层次的有序性","与外部环境的互动性"],"a":0,"e":"系统的四个共同特征是：整体性、相关性、有序性、与外部环境的互动性。其中整体性是系统的基本特征。","id":"mgmt-0036"},
{"ch":1,"t":"single","q":"管理者影响人的行为的两类基本工具是（　　）","o":["制度规范与业务流程","奖惩手段与员工培训","计划安排与过程控制","权力与组织文化"],"a":3,"e":"管理者影响人的行为的手段无非两类：一类与权力有关，另一类与组织文化有关。","id":"mgmt-0037"},
{"ch":1,"t":"single","q":"效益是指（　　）","o":["组织在一定时期内投入与产出的比值","组织在经营活动中所实现的全部利润总额","组织目标的实现与实现组织目标所付代价之间的一种比例关系","组织所提供的产品在市场上所占的份额"],"a":2,"e":"效益是指组织目标的实现与实现组织目标所付代价之间的一种比例关系。","id":"mgmt-0038"},
{"ch":1,"t":"multi","q":"管理的四大基本原理包括（　　）","o":["人本原理","责任原理","系统原理","效益原理"],"a":[0,2,3],"e":"管理的基本原理主要有人本原理、系统原理、效益原理以及适度原理。","id":"mgmt-0039"},
{"ch":1,"t":"judge","q":"系统具有整体性、相关性、封闭性以及与外部环境的互动性等共同特征。","a":false,"e":"系统的四个共同特征是整体性、相关性、有序性、与外部环境的互动性。系统是开放的系统，与外部环境存在物质、能量和信息的交换，“封闭性”不是系统的共同特征，本句以“封闭性”替换了“有序性”，故错误。","id":"mgmt-0040"},
{"ch":1,"t":"multi","q":"管理的五大职能包括（　　）","o":["计划","决策","组织","领导"],"a":[1,2,3],"e":"管理是一个包括决策、组织、领导、控制以及创新等一系列工作的综合过程。","id":"mgmt-0041"},
{"ch":1,"t":"judge","q":"组织是由两个或两个以上成员构成、具有明确目标、有特殊活动、独立存在且与外部有相对明确界限的集合体。","a":true,"e":"组织的四个基本特征：由两个或两个以上成员构成；具有明确的目标；有特殊的活动；独立存在且与外部有相对明确的界限。","id":"mgmt-0042"},
{"ch":1,"t":"judge","q":"管理的最初目的是提高资源利用效率。","a":true,"e":"所有管理的最初目的都是要提高资源利用的效率。","id":"mgmt-0043"},
{"ch":1,"t":"judge","q":"管理的本质是对组织成员在活动中的行为进行协调。","a":true,"e":"管理的本质从某种意义上说是对组织成员在活动中的行为进行协调。","id":"mgmt-0044"},
{"ch":1,"t":"judge","q":"管理的自然属性对应生产力，社会属性对应生产关系。","a":true,"e":"管理的自然属性对应生产力，社会属性对应生产关系。","id":"mgmt-0045"},
{"ch":1,"t":"judge","q":"“无为”是指管理者完全不管事。","a":false,"e":"无为不是消极放任，而是让客观规律发挥作用。","id":"mgmt-0046"},
{"ch":1,"t":"term","q":"名词解释：管理","a":"管理就是为了有效地实现组织目标，由管理者利用相关知识、技术和方法对组织活动进行决策、组织、领导、控制并不断创新的过程。","e":"关键词：有效实现目标＋管理者（主体）＋相关知识技术方法（手段）＋组织活动（客体）＋五职能。","id":"mgmt-0047"},
{"ch":1,"t":"term","q":"名词解释：人本原理","a":"人本原理是指人是组织的中心，也是管理的中心，管理应以人为中心，既要“为了人的管理”，也要“依靠人的管理”。它是管理的首要原理。","e":"两层含义：为了人的管理、依靠人的管理。","id":"mgmt-0048"},
{"ch":1,"t":"term","q":"名词解释：适度原理","a":"适度原理是指管理活动中存在许多相互矛盾的选择，管理者必须在两个极端之间找到最恰当的点，进行适度管理，实现适度组合。它体现了管理实践的艺术性，即对“度”的把握。","e":"三对矛盾：专业化与多元化、管理幅度宽与窄、集权与分权。","id":"mgmt-0049"},
{"ch":1,"t":"short","q":"简答：简述管理的五大职能","a":"管理是一个包括决策、组织、领导、控制以及创新等一系列工作的综合过程。\n（1）决策：组织在未来众多行动可能中选择合理方案，是计划的前提。\n（2）组织：根据目标活动要求设计合理组织，包括职务设计、机构设计、结构设计。\n（3）领导：利用组织赋予的权力和自身能力指挥影响下属，激励成员为实现组织目标努力。\n（4）控制：根据预定标准检查监督各部门工作，分析偏差原因并实施纠正措施。\n（5）创新：组织内部活动技术与方法不断变革，活动与人的安排不断优化。","e":"口诀“决组领控创”。注意：第二版五职能含“创新”，不含“计划”。","id":"mgmt-0050"},
{"ch":1,"t":"short","q":"简答：简述管理的基本原理","a":"（1）人本原理：人是组织和管理的中心，是管理的首要原理。包括“为了人的管理”和“依靠人的管理”两方面。\n（2）系统原理：系统是由若干相互依存、相互作用的要素或子系统组合而成具有特定功能的有机整体。四个特征：整体性、相关性、有序性、与外部环境的互动性。\n（3）效益原理：效益是组织目标的实现与实现组织目标所付代价之间的比例关系。\n（4）适度原理：在专业化与多元化、管理幅度宽窄、集权与分权等矛盾中找最恰当的点。","e":"口诀“人系效适”。第二版只有四个原理。","id":"mgmt-0051"},
{"ch":1,"t":"short","q":"简答：如何理解管理的本质","a":"（1）管理是对人或人的行为的管理。管理者对事的管理的目标是通过对人的管理来实现的。\n（2）管理的本质是对组织成员在活动中的行为进行协调。\n（3）协调的前提是组织成员愿意接受协调且行为具有可协调性。\n（4）行为可协调性的前提是行为的可预测性，而可预测性要求存在规则。因此，管理活动要围绕规则的设立、运行以及不断改进来组织展开。","e":"核心句：管理是对人或人的行为的管理，本质是对成员行为进行协调。","id":"mgmt-0052"},
{"ch":1,"t":"case","q":"某建材公司创立初期规模较小，所有经营决策均由创始人一人拍板，凭借其个人经验和威望，公司发展迅速。随着公司规模扩大、业务扩展到三座城市，创始人发现：重大事项都要等自己拍板，决策十分迟缓；各业务部门之间相互推诿，出了问题无人负责；员工普遍觉得干多干少一个样，积极性明显下降。在管理顾问建议下，创始人决定引入职业经理人，推行分权管理，并建立覆盖采购、生产、销售等环节的规章制度。\n问题：","sub":[{"q":"（1）从管理的基本原理角度，分析创始人调整管理方式的必要性。（5分）","a":"①人本原理：人是组织的中心，也是管理的中心，管理既要“为了人的管理”，也要“依靠人的管理”；过度集权使员工缺乏参与，压抑积极性，必须让员工参与管理。②系统原理：组织是由若干相互依存的要素组成的有机整体，各管理层次必须职责清楚、任务明确，分权有利于各司其职。③效益原理：效益是组织目标的实现与实现目标所付代价之间的比例关系；规范管理、合理分权有利于提高决策效率和资源利用效率。④适度原理：管理要在集权与分权之间寻求最恰当的点，规模扩大后应适度分权。（采分点：人本原理2分、系统原理1分、效益原理1分、适度原理1分）"},{"q":"（2）结合管理的本质，说明该公司为什么必须从“人治”转向依靠规则和制度进行管理。（4分）","a":"①管理的本质是对组织成员在活动中的行为进行协调；②协调的前提是组织成员愿意接受协调，且行为具有可协调性，而行为可协调性的前提是行为具有可预测性，可预测性要求存在规则；③公司规模扩大后，仅靠创始人个人权威和直接指挥已无法有效协调众多成员的行为，必须依靠规章制度使员工行为可预测、可协调，实现从“人治”到“法治”的转变。（采分点：管理本质1分、协调与规则的关系2分、结合案例1分）"},{"q":"（3）假如你是该公司的管理顾问，还可提出哪些改进建议？（4分）","a":"①明确各部门职责和权限，完善授权与监督机制，做到权责对等；②建立科学的绩效考评与激励制度，使员工贡献与回报挂钩，调动积极性；③重视组织文化建设，增强员工对组织的认同感和凝聚力；④定期评估规章制度执行效果，根据环境变化持续改进。言之有理、结合案例提出可操作建议酌情给分。（每点1分）"}],"e":"【答题思路】本题围绕“管理基本原理→管理本质→改进建议”展开。前两问先亮出教材理论（人本/系统/效益/适度原理；管理的本质是协调人的行为、依赖规则），再逐一对应案例中“决策慢、部门推诿、积极性下降”等现象，切忌脱离案例只背原理；第三问为开放题，须结合案例提出可操作建议。","id":"mgmt-0053"},
{"ch":2,"t":"term","q":"名词解释：法约尔跳板（法约尔桥）","a":"法约尔跳板又称法约尔桥，是指在等级链（等级制度）的基础上，为提高信息传递和处理问题的效率，允许同级之间在征得上级同意、事后报告的前提下直接横向沟通联系的一种制度安排。","e":"关键词：等级链＋同级直接沟通＋事先授权、事后报告；既维护统一指挥又提高效率。","id":"mgmt-0054"},
{"ch":2,"t":"single","q":"权变管理理论的核心观点是（　　）","o":["管理要根据组织内外环境条件随机应变，没有一成不变的最好方法","管理只需依靠严格的规章制度来约束成员","管理效率的高低主要取决于组织所采用的技术水平","存在着普遍适用的、能够解决一切组织一切情况问题的、最好的管理方法"],"a":0,"e":"权变理论认为组织要适应所处内外环境，管理方式应随环境变量而变；超Y理论是其在人性假设上的体现。","id":"mgmt-0055"},
{"ch":2,"t":"term","q":"名词解释：复合决策","a":"西蒙认为，组织的决策是一个复合决策的过程，决策结果是由许多人参与的许多决策综合而成的。高层管理者的任务与其说是决策，不如说是组织决策、影响组织成员的决策，努力使每一个组织成员在做决策的时候不仅考虑个人的理性要求，还要考虑组织的理性要求。","e":"关键词：西蒙、许多人参与的许多决策综合而成、个人理性与组织理性。","id":"mgmt-0056"},
{"ch":2,"t":"single","q":"管理科学学派的基本特点是（　　）","o":["强调人际关系与非正式组织对生产效率的重要影响","强调依靠管理者的经验直觉进行判断和决策","强调运用数学模型和定量方法寻求最优化方案","强调权威服从与严格的层级节制和规章约束"],"a":2,"e":"管理科学学派以系统观点为基础，假设组织成员是“经济人”、组织是追求最优决策的系统，主张用数学、统计和电子计算机进行定量分析。","id":"mgmt-0057"},
{"ch":2,"t":"multi","q":"管理科学学派常用的定量方法包括（　　）","o":["运筹学（线性规划、排队论）","概率论与数理统计","网络分析（计划评审技术）","头脑风暴法"],"a":[0,1,2],"e":"常用方法：运筹学（含线性规划、排队论、库存论、对策论）、概率统计、网络计划技术、模拟等；头脑风暴属定性方法。","id":"mgmt-0058"},
{"ch":2,"t":"judge","q":"法约尔提出的十四条管理原则包括劳动分工、统一指挥、统一领导、权责对等、纪律、个人利益服从集体利益、等级制度、秩序、公平、人员稳定、首创精神、人员团结以及报酬合理、集权等。","a":true,"e":"法约尔的十四条管理原则为：劳动分工、权责对等、纪律、统一指挥、统一领导、个人利益服从集体利益、报酬合理、集权、等级链、秩序、公平、人员稳定、首创精神、人员团结。","id":"mgmt-0059"},
{"ch":2,"t":"multi","q":"明茨伯格认为，组织的基本构成部分包括（　　）","o":["战略高层、中间线（直线管理层）","技术结构、支持人员","操作核心（作业层）","股东"],"a":[0,1,2],"e":"五构成部分：战略高层、中间线、操作核心、技术结构、支持人员；不同组合形成不同组织结构形态。","id":"mgmt-0060"},
{"ch":2,"t":"judge","q":"哈默提出的业务流程再造原则包括围绕结果（而不是任务）进行组织、让需要流程产出的人自己执行流程、把信息处理工作纳入产生信息的实际工作中、将各地分散的资源视为一体等。","a":true,"e":"哈默的业务流程再造原则可归纳为：围绕结果而非任务组织、让需要流程产出的人自己执行流程、把信息处理工作纳入产生信息的实际工作中、将各地分散资源视为一体、将并行活动连接起来、在流程中设置控制、在信息产生地一次获取信息。","id":"mgmt-0061"},
{"ch":2,"t":"judge","q":"业务流程再造的实施过程一般包括观念再造、流程再造、组织再造、全面铺开、实现愿景目标五个阶段。","a":false,"e":"业务流程再造的实施过程为：观念再造→流程再造→组织再造→试点和切换→实现愿景目标。第四阶段是“试点和切换”而不是“全面铺开”，故本句错误。","id":"mgmt-0062"},
{"ch":2,"t":"single","q":"泰勒科学管理理论的中心问题是（　　）","o":["提高工人满意度","完善组织结构","加大质量控制力度","提高劳动生产率"],"a":3,"e":"泰勒科学管理理论的中心问题就是提高劳动生产率。","id":"mgmt-0063"},
{"ch":2,"t":"single","q":"泰勒提出的、上级主管把日常事务授权给下级处理而自己保留对例外事项决策权的原则是（　　）","o":["统一指挥原则","例外管理原则","职能工长制","差别计件工资制"],"a":1,"e":"例外管理是指企业的上级主管把一般的日常事务授权给下级管理人员去处理，而自己保留对例外事项或重要问题的决策与监督权。","id":"mgmt-0064"},

{"ch":2,"t":"single","q":"韦伯认为只有哪种权力才能成为科层组织的基础（　　）","o":["传统型权力","个人魅力型权力","法理型权力","强制型权力"],"a":2,"e":"韦伯把权力分为传统型权力、个人魅力型权力和法理型权力三类。他认为只有法理型权力才能成为科层组织的基础。","id":"mgmt-0066"},
{"ch":2,"t":"single","q":"霍桑实验的主持者是（　　）","o":["泰勒","梅奥","韦伯","巴纳德"],"a":1,"e":"梅奥领导了霍桑实验，并提出了人际关系学说。","id":"mgmt-0067"},
{"ch":2,"t":"single","q":"把管理理论的各种流派称为“管理理论的丛林”的学者是（　　）","o":["孔茨","德鲁克","西蒙","明茨伯格"],"a":0,"e":"美国管理学者孔茨把二战后众多管理学派并存的这种现象称为“管理理论的丛林”。","id":"mgmt-0068"},
{"ch":2,"t":"single","q":"社会系统学派的创始人是（　　）","o":["巴纳德","西蒙","孔茨","明茨伯格"],"a":0,"e":"巴纳德被后人称为社会系统学派的创始人，代表作是1938年出版的《经理人员的职能》。","id":"mgmt-0069"},
{"ch":2,"t":"single","q":"提出组织六种协调机制的是（　　）","o":["西蒙","德鲁克","明茨伯格","巴纳德"],"a":2,"e":"明茨伯格指出，不论组织采用的具体协调方法有多少种，都可以归纳为六种基本机制。","id":"mgmt-0070"},
{"ch":2,"t":"single","q":"业务流程再造理论的提出者是（　　）","o":["泰勒和法约尔","哈默和钱皮","巴纳德和西蒙","明茨伯格和德鲁克"],"a":1,"e":"业务流程再造（BPR）是由美国的哈默和钱皮提出并引入西方企业管理领域的。","id":"mgmt-0071"},
{"ch":2,"t":"judge","q":"泰勒科学管理理论的主要内容包括改进工作方法并根据工作要求挑选和培训工人、改进分配方法并实行计时工资制、改进生产组织并设置计划部门使计划职能与执行职能分开。","a":false,"e":"泰勒科学管理理论包含三大方面：改进工作方法（挑选和培训工人、动作与工时研究）、改进分配方法（差别计件工资制）、改进生产组织（设置计划部门，计划职能与执行职能分开；职能工长制；例外管理）。泰勒在分配上实行的是差别计件工资制，而不是一般的计时工资制，故本句错误。","id":"mgmt-0072"},
{"ch":2,"t":"judge","q":"法约尔认为管理由计划、组织、指挥、决策和控制五个要素构成。","a":false,"e":"法约尔的管理五要素是计划、组织、指挥、协调、控制；“决策”是西蒙决策理论的核心概念，不属于法约尔的五要素，故本句错误。","id":"mgmt-0073"},
{"ch":2,"t":"multi","q":"韦伯提出的权力类型包括（　　）","o":["传统型权力","个人魅力型权力","法理型权力","经济型权力"],"a":[0,1,2],"e":"韦伯把社会所接受的权力分为三类：传统型权力、个人魅力型权力、法理型权力。","id":"mgmt-0074"},
{"ch":2,"t":"multi","q":"巴纳德认为协作系统的基本要素包括（　　）","o":["协作的意愿","共同的目标","信息的沟通","严格的纪律"],"a":[0,1,2],"e":"巴纳德认为，作为正式组织的协作系统，都包含了三个基本要素：协作的意愿、共同的目标和信息的沟通。","id":"mgmt-0075"},
{"ch":2,"t":"judge","q":"明茨伯格把组织的协调机制归纳为相互调适、直接监督、工作程序标准化、成果标准化、技术（技能）与知识标准化、规范标准化六种。","a":true,"e":"明茨伯格指出，不论组织采用的具体协调方法有多少种，都可归纳为六种基本机制，口诀为“调适、监督、程序、成果、技能、规范”。","id":"mgmt-0076"},
{"ch":2,"t":"multi","q":"合法性导致组织趋同的三种机制包括（　　）","o":["强迫性机制","模仿机制","社会规范机制","竞争机制"],"a":[0,1,2],"e":"迪马吉奥和鲍威尔讨论了合法性导致组织趋同的三种不同机制。","id":"mgmt-0077"},
{"ch":2,"t":"judge","q":"泰勒科学管理理论把人看作是“社会人”。","a":false,"e":"泰勒科学管理把人当作“经济人”，霍桑实验则表明人是“社会人”。","id":"mgmt-0078"},
{"ch":2,"t":"judge","q":"法约尔认为管理只是经营的一部分。","a":true,"e":"法约尔认为经营包括技术、商业、财务、安全、会计以及管理六种职能，管理只是经营的一部分。","id":"mgmt-0079"},
{"ch":2,"t":"judge","q":"韦伯认为个人魅力型权力可以作为政治统治的稳固制度的基础。","a":false,"e":"韦伯认为个人魅力型权力产生于动乱和危机之中，崩溃于稳定秩序条件下的日常事务管理，不能作为政治统治的稳固制度的基础。","id":"mgmt-0080"},
{"ch":2,"t":"judge","q":"巴纳德认为权威取决于指挥下属的命令是否为下属所接受。","a":true,"e":"巴纳德提出“权威接受论”，认为管理人员的权威取决于指挥下属的命令是否为下属所接受。","id":"mgmt-0081"},
{"ch":2,"t":"judge","q":"西蒙主张用“最优化”准则代替“令人满意”准则。","a":false,"e":"西蒙等人提出以“令人满意的”准则代替“最优化”准则作为决策的准则。","id":"mgmt-0082"},
{"ch":2,"t":"term","q":"名词解释：科学管理（泰勒制）","a":"科学管理是20世纪初在西方工业国家影响最大、推广最普遍的一种管理理论。它包括一系列关于生产组织合理化和生产作业标准化的科学方法及理论依据，是由美国的机械工程师泰勒首先提出并极力推广的，因此通常也被称作泰勒制。","e":"关键词：生产组织合理化＋生产作业标准化＋泰勒首创。","id":"mgmt-0083"},
{"ch":2,"t":"term","q":"名词解释：例外管理","a":"例外管理是指企业的上级主管把一般的日常事务授权给下级管理人员去处理，而自己保留对例外事项或重要问题的决策与监督权。","e":"关键词：日常事务授权下级＋保留例外/重要事项决策监督权。","id":"mgmt-0084"},
{"ch":2,"t":"term","q":"名词解释：科层组织","a":"科层组织或科层制度，通常亦被译为官僚组织、官僚政治，是一种通过公职或职位，而不是通过世袭或个人魅力来进行管理的理想的组织制度。","e":"关键词：通过公职/职位管理的理想组织制度。","id":"mgmt-0085"},
{"ch":2,"t":"term","q":"名词解释：业务流程再造（BPR）","a":"业务流程再造也被称为业务流程重组或企业经营过程再造，是针对企业业务流程的基本问题进行反思，并对它进行彻底的重新设计，以在成本、质量、服务和速度等当前衡量企业业绩的这些重要方面取得显著的进展。","e":"关键词：反思基本问题＋彻底重新设计＋成本质量服务速度显著进展。","id":"mgmt-0086"},
{"ch":2,"t":"short","q":"简答：简述泰勒科学管理理论的主要内容","a":"（1）改进工作方法，并根据工作要求挑选和培训工人：①改进操作方法，把每项操作分解为动素，形成标准作业方法和标准作业时间；②实现作业环境与作业条件标准化；③根据工人特长分配工作，按标准作业方法集中成批培训工人。\n（2）改进分配方法，实行差别计件工资制：未完成定额按低工资率付给，完成并超过定额按高工资率付给。\n（3）改进生产组织，加强企业管理：①设置计划部门，把计划（管理）职能与执行（作业）职能分开；②实行职能工长制；③进行例外管理。","e":"口诀：改进工作方法＋差别计件工资制＋计划与执行分离＋职能工长制＋例外管理。","id":"mgmt-0087"},
{"ch":2,"t":"short","q":"简答：简述韦伯的科层组织理论","a":"（1）科层组织是一种通过公职或职位，而不是通过世袭或个人魅力来进行管理的理想的组织制度。\n（2）三种合法权力类型：传统型权力、个人魅力型权力、法理型权力。\n（3）只有法理型权力才能成为科层组织的基础，因为这种权力具有四个特征：为管理的连续性奠定基础、合理性、领导人可借助法律手段保证权力行使、所有权力都有明确规定。","e":"韦伯被称为“组织理论之父”。","id":"mgmt-0088"},
{"ch":2,"t":"short","q":"简答：简述巴纳德协作系统的三要素和经理人员的三项职能","a":"（1）协作系统的三个基本要素：\n①协作的意愿：意味着个人自我克制、交出对自己行为至少是部分的控制权。\n②共同的目标：是协作意愿的必要前提。\n③信息的沟通：组织的存在及活动以信息沟通为条件。\n（2）经理人员的三项职能：\n①建立和维持一个信息系统；\n②从不同的组织成员那里获得必要的服务；\n③规定组织的共同目标，并用各个部门的具体目标加以阐明。","e":"三要素口诀“意愿、目标、沟通”；三职能口诀“建信息系统、获成员服务、定共同目标”。","id":"mgmt-0089"},
{"ch":2,"t":"short","q":"简答：简述西蒙决策理论的主要观点","a":"（1）管理的本质是决策，决策贯穿于管理各个方面和全部过程。\n（2）决策过程包括四个阶段：①情报活动；②设计活动；③抉择活动；④审查活动。\n（3）决策的准则：由于认识能力、时间、经费及情报来源的限制，不可能做出“完全合理”或“最优”的决策，只能满足于“令人满意的”准则（有限理性）。\n（4）程序化决策与非程序化决策。","e":"四阶段口诀“情报—设计—抉择—审查”。","id":"mgmt-0090"},
{"ch":2,"t":"case","q":"某大型家电制造企业经过多年扩张，产品线不断增多，但企业内部却出现“大企业病”：部门越设越多，管理层级层层叠加，一份订单审批要经过六个部门、十几个签字环节，平均耗时长达两周；机构臃肿、人浮于事，部门之间互相扯皮，形式主义蔓延，对市场变化的反应速度明显下降。为扭转局面，公司决定以客户需求为导向，对从订单到交付的全业务流程进行重新设计，把被职能部门割裂的流程重新整合起来。\n问题：","sub":[{"q":"（1）该公司出现的“大企业病”和流程再造实践，反映了哪种当代管理理论产生的时代背景？（4分）","a":"①反映了企业再造理论（业务流程再造，BPR）产生的时代背景；②20世纪八九十年代，随着信息技术迅速发展、市场竞争日趋激烈、顾客需求不断变化，许多大企业机构臃肿、决策迟缓、效率低下，传统的职能型组织难以适应新环境，企业再造理论应运而生；③案例中该公司机构臃肿、审批链条过长、反应迟缓，正是这一背景的典型表现。（采分点：理论名称2分、背景分析2分）"},{"q":"（2）简述业务流程再造（BPR）的核心思想。（5分）","a":"①以业务流程为改造对象和中心；②以关心客户的需求和满意度为目标；③对现有业务流程进行根本性的再思考和彻底性的再设计；④打破传统的职能型组织结构，建立全新的过程型组织结构，使企业真正围绕业务流程和客户需求运作。（采分点：改造对象1分、目标1分、根本再思考与彻底再设计2分、过程型组织1分）"},{"q":"（3）有学者指出，业务流程再造的基本逻辑早已隐含于泰勒的科学管理原理之中。请结合所学说明二者的联系与区别。（4分）","a":"①联系：泰勒科学管理原理的主要内容是对生产过程组织的合理化和生产作业方法标准化的研究，其通过分析、改进生产作业流程来提高效率的思想，与流程再造“重新设计流程”的基本逻辑一脉相承；②区别：泰勒侧重对基层生产作业环节进行标准化和合理化，流程再造则面向企业整体业务流程，以信息技术为支撑、以客户为导向进行彻底重构，二者的层次、范围和手段明显不同。（采分点：联系2分、区别2分）"}],"e":"【答题思路】本题考察管理理论的历史演变：当代管理理论（企业再造）与古典管理理论（泰勒科学管理）。第一问结合案例中“机构臃肿、决策迟缓”等现象作答；第二问按“对象—目标—方法—结果”四层作答；第三问先答联系再答区别，务必点出“流程”这一共同关注点。","id":"mgmt-0091"},
{"ch":3,"t":"single","q":"决策的核心是（　　）","o":["目标","方案","选择","信息"],"a":2,"e":"决策是指为实现一定的目标，在多个备选方案中选择一个方案的分析判断过程。选择是决策的核心。","id":"mgmt-0092"},
{"ch":3,"t":"single","q":"决策过程的起点是（　　）","o":["确定目标","诊断原因","制定方案","识别问题"],"a":3,"e":"识别问题就是要找出现状与预期结果的偏离，是决策过程的开始。","id":"mgmt-0093"},

{"ch":3,"t":"multi","q":"决策的要素包括（　　）","o":["决策主体","决策目标","决策方案","决策程序和决策效果"],"a":[0,1,2],"e":"决策要素主要包括决策主体（核心）、决策目标、决策方案、决策准则、不确定性情境。","id":"mgmt-0098"},
{"ch":3,"t":"judge","q":"决策的基本特征包括目标性、可行性、动态性、整体性和创造性。","a":true,"e":"决策的五个基本特征：目标性、可行性、动态性、整体性、创造性。","id":"mgmt-0099"},

{"ch":3,"t":"judge","q":"不确定性情境下决策方案选择的准则包括乐观准则、悲观准则、等概率准则和最小后悔准则。","a":true,"e":"四准则：乐观准则（大中取大）、悲观准则（小中取大）、等概率准则（选期望值最大）、最小后悔准则（大中取小）。","id":"mgmt-0101"},
{"ch":3,"t":"judge","q":"决策拟定的方案越多越好。","a":false,"e":"决策方案要具有可行性和创造性，并非越多越好。","id":"mgmt-0102"},
{"ch":3,"t":"judge","q":"决策一定要遵循严格的程序，不能随意跳过任何一个阶段。","a":false,"e":"决策过程虽然包括六个阶段，但在实践中可以根据具体情况灵活调整。","id":"mgmt-0103"},
{"ch":3,"t":"judge","q":"程序化决策涉及的是例外问题。","a":false,"e":"程序化决策涉及的是例行问题，非程序化决策涉及的是例外问题。","id":"mgmt-0104"},
{"ch":3,"t":"judge","q":"决策是计划的前提，计划是决策的逻辑延续。","a":true,"e":"决策为计划的任务安排提供了依据，计划则为决策所选择的活动和活动方案的落实提供了实施保证。","id":"mgmt-0105"},
{"ch":3,"t":"term","q":"名词解释：决策","a":"决策是指为实现一定的目标，在多个备选方案中选择一个方案的分析判断过程。狭义的决策是一种行为，是在几种行动方案中做出选择；广义的决策是一个过程，包括在做出最后选择之前必须进行的一切活动。","e":"关键词：为实现一定目标＋多个备选方案＋选一个方案。","id":"mgmt-0106"},
{"ch":3,"t":"term","q":"名词解释：程序化决策","a":"程序化决策即在问题重复发生的情况下，决策者通过限制或排除行动方案，按照书面的或不成文的政策、程序或规则所进行的决策。","e":"关键词：问题重复发生＋按政策/程序/规则。","id":"mgmt-0107"},
{"ch":3,"t":"term","q":"名词解释：非程序化决策","a":"非程序化决策是指旨在处理那些不常发生的或例外的非结构化问题的决策。","e":"关键词：不常发生/例外＋非结构化问题。","id":"mgmt-0108"},
{"ch":3,"t":"judge","q":"决策的实施与监督是决策过程的最后一个阶段，实施决策比评价和选择方案更为重要。","a":true,"e":"决策过程第六阶段即实施和监督；教材明确指出实施决策比评价和选择行动方案更重要。","id":"mgmt-0109"},
{"ch":3,"t":"short","q":"简答：简述决策的影响因素","a":"（1）环境：环境是组织生存与发展的土壤，环境变化往往是导致组织进行变革决策的最直接的原因。\n（2）组织的历史：组织过去活动的特点、过去决策的依据以及过去决策在实施过程中遇到的问题都会影响今天的选择。\n（3）决策者的特点：决策者的职能背景、风险意识、过往成败都会影响决策。\n（4）组织文化：人们对待组织变化或变革的态度，在根本上取决于组织文化的特点。\n（5）商业伦理与社会责任：决策要兼顾经济效益和社会效益。","e":"口诀“环境—组织历史—决策者特点—组织文化—商业伦理与社会责任”。","id":"mgmt-0110"},
{"ch":3,"t":"short","q":"简答：简述群体决策的优缺点","a":"（1）优点：\n①有利于集中不同领域专家的智慧；\n②能够利用更多的知识优势，形成更多的可行性方案；\n③有利于提高决策时考虑问题的全面性；\n④容易得到普遍的认同，有助于决策的顺利实施；\n⑤有利于使人们勇于承担风险。\n（2）缺点：\n①速度、效率可能低下；\n②有可能为个人或子群体所左右，容易形成“一言堂”的局面。","e":"口诀“集中专家智慧—更多可行方案—考虑问题全面—普遍认同利实施—勇于承担风险”。","id":"mgmt-0111"},
{"ch":3,"t":"case","q":"某食品生产企业拟开拓西部地区市场。市场部经过调研认为，若全面进入，新产品有60%的概率获得较高收益，但也有40%的概率因水土不服而亏损；财务部则担心前期投入过大、资金链紧张，主张暂缓进入。公司为此召开高层会议讨论，市场部力主进入，财务部坚决反对，双方争论不下。CEO在综合各方意见后，决定先在省会城市选择三个区县进行小规模试点销售，根据试点数据再决定是否全面铺开。\n问题：","sub":[{"q":"（1）该决策属于哪种类型的决策？请说明判断依据。（4分）","a":"①属于风险型决策；②判断依据：决策者虽不能准确判断每一备选方案的确定结果，但通过调研掌握了较充分的信息，能够预测各备选方案及其结果发生的可能性（如60%高收益、40%亏损的概率），符合风险型决策“有概率、可预测”的基本特征。（采分点：判断2分、依据2分）"},{"q":"（2）该公司通过召开高层会议进行决策，属于何种决策方式？请分析其优缺点。（5分）","a":"①属于群体决策；②优点：有利于集中不同领域专家的智慧，利用更多知识优势形成更多可行性方案，有利于提高决策时考虑问题的全面性，容易得到普遍认同、有利于决策的顺利实施，也有利于使人们勇于承担风险；③缺点：决策速度、效率可能低下，有可能为个人或子群体左右，形成“一言堂”的局面。（采分点：判断1分、优点3分、缺点1分）"},{"q":"（3）从决策准则与决策过程角度，分析CEO“先小规模试点”决策的合理性。（4分）","a":"①CEO综合市场部与财务部意见，避免偏听偏信，体现了决策的整体性；②“先试点”既不过度冒险（采纳财务部风险提示），也不放弃机会（采纳市场部主张），体现了组织决策遵循“满意”原则而非“最优”原则，也带有乐观与悲观准则之间的折中考虑；③从决策过程看，试点实质是“实施和监督”阶段的重要环节——通过小范围实施获取真实反馈数据，降低不确定性，为后续全面铺开决策提供依据，体现了决策的动态性。（采分点：综合意见/整体性1分、满意准则或折中1分、试点即实施监督与动态性2分）"}],"e":"【答题思路】本题考察决策类型、群体决策和决策准则。第一问抓住“概率”二字判断风险型决策；第二问按教材分点作答群体决策优缺点；第三问必须扣住“小规模试点”这一案例细节，联系决策的满意准则、动态性以及决策过程“实施和监督”阶段展开分析，不能脱离案例。","id":"mgmt-0112"},
{"ch":4,"t":"single","q":"企业社会责任中最基本、最首要的层次是（　　）","o":["慈善责任","法律责任","经济责任","伦理责任"],"a":2,"e":"企业社会责任分为经济、法律、伦理、慈善（自愿）四个层次；经济责任是基础，慈善责任层次最高。","id":"mgmt-0113"},
{"ch":4,"t":"multi","q":"个人道德发展划分为三个层次，包括（　　）","o":["前惯例层次","惯例层次","原则层次","后惯例层次"],"a":[0,1,2],"e":"三层次：前惯例（受个人利害、惩罚驱动）、惯例（符合周围人期望、遵守规则）、原则（依个人道德原则）；层次越高越能做出伦理决策。","id":"mgmt-0114"},
{"ch":4,"t":"multi","q":"波特价值链模型中的辅助（支持）活动包括（　　）","o":["企业基础设施","人力资源管理","技术开发","市场营销与售后服务"],"a":[0,1,2],"e":"价值链分基本活动（进料后勤、生产、发货后勤、销售、服务）和辅助活动（采购、技术开发、人力资源管理、企业基础设施）。","id":"mgmt-0115"},
{"ch":4,"t":"single","q":"某产品单价30元，单位变动成本10元，固定成本20万元，则盈亏平衡销售量为（　　）","o":["1万件","2万件","5万件","10万件"],"a":0,"e":"盈亏平衡产量＝固定成本÷（单价－单位变动成本）＝200000÷(30－10)＝10000件，即1万件。","id":"mgmt-0116"},

{"ch":4,"t":"multi","q":"多元化（多角化）战略的主要类型有（　　）","o":["同心多元化（相关多元化）","横向多元化","无关（非相关）多元化","纵向多元化"],"a":[0,1,2],"e":"同心多元化（增加与原有业务相关的新产品）、横向多元化（面向现有顾客提供新业务）、无关多元化（进入不相关领域）。","id":"mgmt-0119"},
{"ch":4,"t":"term","q":"名词解释：脚本法（情景分析法）","a":"脚本法又称情景分析法，是指在充分假设未来环境可能发生变化的基础上，按照时间顺序对多种可能的未来发展情景加以描述和推演，据以制定相应对策、增强决策适应性的一种环境分析方法。","e":"关键词：多种未来情景＋按时间顺序推演＋提高应变能力。","id":"mgmt-0120"},
{"ch":4,"t":"single","q":"前景理论的提出者是（　　）","o":["赫伯特·西蒙","迈克尔·波特","弗鲁姆","卡尼曼和特沃斯基"],"a":3,"e":"卡尼曼和特沃斯基提出前景理论，认为面对收益时倾向风险规避、面对损失时倾向风险偏好，且等量损失的痛苦大于等量收益的快乐（损失厌恶）。","id":"mgmt-0121"},
{"ch":4,"t":"single","q":"行为决策理论的核心主张是（　　）","o":["人是完全理性的，只要掌握充分信息就总能找到最优方案","决策与决策者的心理因素无关，只服从严密的逻辑推演","人的理性有限，判断常受认知偏差和直觉（启发式）影响","决策只依赖定量模型，定性分析与经验判断在决策中不起作用"],"a":2,"e":"行为决策理论以有限理性为基础，研究人们实际如何决策，强调启发式、框架效应和认知偏差，代表人物有西蒙、卡尼曼等。","id":"mgmt-0122"},
{"ch":4,"t":"multi","q":"行为决策中常见的启发式（直觉判断方式）包括（　　）","o":["熟悉性启发式","便利性（可得性）启发式","锚定和调整启发式","德尔菲启发式"],"a":[0,1,2],"e":"三启发式：熟悉性（凭代表性判断）、便利性（凭容易想到的事例判断）、锚定和调整（以初始信息为锚再调整）。","id":"mgmt-0123"},
{"ch":4,"t":"single","q":"决策者只愿意接受支持自己原有判断的信息，该心理偏差是（　　）","o":["锚定效应","过度自信","证实性偏见","损失厌恶"],"a":2,"e":"证实性偏见：刻意搜集能够印证自己原有观点的信息，忽略反面证据。","id":"mgmt-0124"},
{"ch":4,"t":"judge","q":"决策中常见的心理认知偏差包括锚定效应、证实性偏见、过度自信和损失厌恶。","a":true,"e":"锚定效应：过度依赖最先获取的信息；证实性偏见：只看支持自己观点的信息；过度自信：高估判断准确性；损失厌恶：对损失的感受强于同等收益。","id":"mgmt-0125"},
{"ch":4,"t":"short","q":"简答：伦理决策的主要影响因素","a":"伦理决策受到多方面因素共同影响：\n①个人层面：个人价值观、道德发展阶段、人格特质；\n②组织层面：组织文化、奖惩制度、组织规范；\n③外部社会层面：社会风俗、法律制度、行业伦理规范、利益相关者压力。","e":"利益相关者：股东、员工、顾客、政府、社区、供应商。","id":"mgmt-0126"},

{"ch":4,"t":"single","q":"提出SWOT分析的学者是（　　）","o":["波特","安德鲁斯","西蒙","洛克"],"a":1,"e":"SWOT分析是由哈佛大学的安德鲁斯等人提出的一种分析技术。","id":"mgmt-0129"},

{"ch":4,"t":"single","q":"理性决策的假设条件不包括（　　）","o":["目标是明确的，组织上下对目标有一致的认识","信息是完全的，决策者能够掌握所需的全部详细决策信息","方案是可量化的，所有可行性方案及其可能结果都能量化评估","决策者是完全感性的"],"a":3,"e":"理性决策假设决策者是理性的，合乎逻辑地评估标准和偏好。","id":"mgmt-0133"},
{"ch":4,"t":"judge","q":"波特五种力量模型包括行业竞争者、潜在进入者、供应商、顾客和替代产品的生产者。","a":true,"e":"五力＝现有企业间竞争、卖方（供应商）议价能力、买方（顾客）议价能力、潜在进入者威胁、替代品生产者威胁。","id":"mgmt-0134"},

{"ch":4,"t":"judge","q":"德尔菲法的主要优点是时间短、费用低。","a":false,"e":"德尔菲法的不足之处是时间较长，费用较高。","id":"mgmt-0141"},
{"ch":4,"t":"judge","q":"有限理性决策模型认为决策者可以收集完全信息。","a":false,"e":"有限理性认为决策者受知识结构、经验、能力以及信息等因素的限制，不可能收集完全信息。","id":"mgmt-0142"},
{"ch":4,"t":"term","q":"名词解释：有限理性","a":"有限理性是指由于知识结构、经验、能力以及信息等因素的限制，决策者是有限理性的人，不可能预见一切结果，只能在可供选择的方案中选出一个“满意的”方案。","e":"西蒙提出。","id":"mgmt-0143"},
{"ch":4,"t":"term","q":"名词解释：直觉决策","a":"直觉决策是基于经验、感受和积累的判断力做出决策。直觉与正式的分析相对，直觉决策可以补充理性决策。","e":"本质是快速的逻辑思维过程的结果。","id":"mgmt-0144"},
{"ch":4,"t":"term","q":"名词解释：头脑风暴法","a":"头脑风暴法是一种定性的方法，具体做法是请一定数量的专家，对预测对象的未来发展趋势及状况做出判断。通过与专家面对面的信息交流，引起思维共振，产生组合效应，进行创造性思维。","e":"关键数字：10～15人、40～60分钟。","id":"mgmt-0145"},
{"ch":4,"t":"term","q":"名词解释：德尔菲法","a":"德尔菲法又称专家预测法，是由兰德公司提出的，依靠专家背靠背地发表意见，管理小组对专家的意见进行统计处理和信息反馈，经过几轮循环，使分散的意见逐步统一，最后达到较高的预测精度。","e":"三个特征：匿名性、反馈性、收敛性。","id":"mgmt-0146"},
{"ch":4,"t":"term","q":"名词解释：理性决策","a":"理性决策是指决策者基于完全信息和完全理性，在所有可行方案中选择能够使价值最大化的方案的决策过程。理性决策要求目标明确、信息完全、方案可量化、评估标准明确、决策者完全理性。","e":"五个假设条件。","id":"mgmt-0147"},
{"ch":4,"t":"short","q":"简答：简述波特五种力量模型","a":"迈克尔·波特发现，在企业经营环境中，能够经常为企业提供机会或产生威胁的因素主要有五种：\n（1）行业竞争者：同种产品的制造者和销售者争夺顾客，形成市场竞争。\n（2）潜在进入者：主要从进入障碍的角度分析进入威胁。\n（3）供应商（卖方）：分析卖方议价能力。\n（4）顾客（买方）：分析买方议价能力。\n（5）替代产品生产者：替代产品的存在扩大了顾客的选择余地。","e":"口诀“现有竞争者、潜在进入者、供应商、顾客、替代品”。","id":"mgmt-0148"},
{"ch":4,"t":"short","q":"简答：简述理性决策的假设条件","a":"（1）组织要实现的目标是明确的、组织一致同意的，问题可以识别并精确地予以陈述；\n（2）决策者可以收集完全信息，能够得到所需要的全部详细决策信息；\n（3）所有可行性方案和可能的结果都可以量化和评估；\n（4）方案评估标准明确或可以确定；\n（5）决策者是理性的，合乎逻辑地评估标准和偏好，选择能够使价值最大化的方案。\n显然，这些条件不能完全具备，所以理性假设只是理论上的，但其价值在于为决策工作确立了努力的方向。","e":"答题时最后一定要指出“条件不能完全具备”。","id":"mgmt-0149"},
{"ch":4,"t":"short","q":"简答：如何克服决策者的理性限制","a":"（1）重视决策者和决策权的有效匹配，核心是让合适的人做对的决策。具体表现为：①权力下放；②隐性知识转化为显性知识；③重视专家。\n（2）组织民主决策：让较多的人参与决策过程。\n（3）大数据辅助决策：①生成更多的行动方案；②形成企业管理“驾驶舱”；③提供决策辅助；④人机共同决策。","e":"三途径口诀“决策权匹配—民主决策—大数据辅助”。","id":"mgmt-0150"},
{"ch":4,"t":"short","q":"简答：简述理性决策与非理性决策的区别","a":"（1）理性决策：基于完全信息和完全理性，追求最优化。假设条件包括目标明确、信息完全、方案可量化、评估标准明确、决策者完全理性。\n（2）非理性决策：基于有限理性和直觉判断。有限理性认为决策者受知识结构、经验、能力及信息限制，只能选择“满意”方案；直觉决策是基于经验、感受和积累的判断力做出决策，可以补充理性决策。\n（3）二者关系：理性决策是理论上的理想状态，现实中更多是有限理性决策和直觉决策。","e":"重点区分完全理性与有限理性。","id":"mgmt-0151"},
{"ch":5,"t":"multi","q":"按计划的层次（对组织整体的影响程度），可分为（　　）","o":["战略计划","战术计划","作业计划","项目计划"],"a":[0,1,2],"e":"战略计划（高层、全局、长期）→战术计划（中层）→作业计划（基层、具体）。","id":"mgmt-0152"},
{"ch":5,"t":"multi","q":"下列关于计划分类的表述正确的有（　　）","o":["按期限分为长期计划、中期计划和短期计划","按内容分为综合计划、专业计划和项目计划","按层次分为战略计划、战术计划和作业计划","按约束程度分为正式计划和非正式计划"],"a":[0,1,2],"e":"三套分类：期限（长中短）、内容（综合/专业/项目）、层次（战略/战术/作业）。","id":"mgmt-0153"},
{"ch":5,"t":"single","q":"目标管理中，把组织目标层层分解、落实到每个成员的类型是（　　）","o":["半分解式目标管理","弹性目标管理","滚动目标管理","全分解式目标管理"],"a":3,"e":"全分解式把目标逐级分解到个人，责任明确；半分解式只分解到部门或部分层级，保留一定整体性。","id":"mgmt-0154"},
{"ch":5,"t":"multi","q":"按预算涉及的业务内容，预算可分为（　　）","o":["经营预算","投资预算","财务预算","零基预算"],"a":[0,1,2],"e":"经营预算（日常供产销）、投资预算（长期资产购建）、财务预算（现金、预计利润表、资产负债表）；零基预算是编制方法。","id":"mgmt-0155"},
{"ch":5,"t":"single","q":"以预算期内可预见的多种业务量水平为基础编制、能随业务量调整的预算是（　　）","o":["弹性预算","刚性（固定）预算","零基预算","滚动预算"],"a":0,"e":"弹性预算按多种业务量水平分别确定费用，适应性强；刚性预算只按某一固定业务量编制。","id":"mgmt-0156"},
{"ch":5,"t":"judge","q":"PDCA循环包括计划（Plan）、执行（Do）、检查（Check）和处理（Action）四个阶段。","a":true,"e":"PDCA循环即P计划—D执行—C检查—A处理（标准化并转入下一循环），大环套小环、阶梯式上升。","id":"mgmt-0157"},
{"ch":5,"t":"multi","q":"计划的层次体系包含（　　）","o":["使命、目标","战略、政策","程序、规则","方案、控制"],"a":[0,1,2],"e":"计划层次从抽象到具体：使命→目标→战略→政策→程序→规则→方案→预算。预算是数字化的计划。","id":"mgmt-0158"},

{"ch":5,"t":"single","q":"滚动计划法的基本思想是（　　）","o":["远具体、近概略","全部具体","全部概略","近具体、远概略"],"a":3,"e":"滚动计划法采取“近具体、远概略”的方法。","id":"mgmt-0163"},

{"ch":5,"t":"judge","q":"决策追踪与调整是对原决策的根本否定。","a":false,"e":"决策追踪与调整是对原决策的“扬弃”。","id":"mgmt-0173"},
{"ch":5,"t":"judge","q":"目标管理又称成果管理，是德鲁克于1954年在《管理的实践》一书中提出的。","a":true,"e":"目标管理又称成果管理，德鲁克1954年《管理的实践》提出，核心是自我控制。","id":"mgmt-0174"},
{"ch":5,"t":"term","q":"名词解释：滚动计划法","a":"滚动计划法是努力保证长期、中期、短期计划相互衔接的一种方法，其目的是增加计划的弹性和适应性，保证计划符合实际情况进而得以顺利实施。","e":"关键词：近具体、远概略＋逐期滚动调整。","id":"mgmt-0175"},
{"ch":5,"t":"term","q":"名词解释：零基预算法","a":"零基预算法是广为运用的典型预算方法之一。其基本思想是：在每个预算年度开始时，把所有还在继续开展的活动都看作从零开始的，预算也就以零为基础，重新安排各项活动及各个部门的资源分配和收支。","e":"关键词：从零开始＋重新安排资源分配和收支。","id":"mgmt-0176"},
{"ch":5,"t":"judge","q":"决策追踪与调整是对原决策的根本否定，其过程就是重新做出一次全新的决策。","a":false,"e":"决策追踪与调整是对原决策的“扬弃”，并非对原决策的根本否定；它也不是正常决策的简单重复，而是在初始决策基础上对已从事活动的方向、目标、方针及方案的追踪和重新调整。","id":"mgmt-0177"},
{"ch":5,"t":"judge","q":"计划的作用体现为：管理者进行指挥的抓手、实施控制的标准、降低未来不确定性的手段、提高效率与效益的工具、激励人员士气的依据。","a":true,"e":"计划五作用口诀“指、控、降、效、激”。","id":"mgmt-0178"},
{"ch":5,"t":"judge","q":"目标管理的过程分为目标制定与展开、目标实施和成果评价三个阶段，三个阶段形成一个循环。","a":true,"e":"目标管理过程三阶段“定展—实施—评价”，三阶段构成循环（每阶段各含三项工作）。","id":"mgmt-0179"},
{"ch":5,"t":"judge","q":"PDCA循环的关键环节是改进（Act）阶段。","a":true,"e":"教材明确：推动PDCA循环的关键是改进（A）阶段。","id":"mgmt-0180"},
{"ch":5,"t":"case","q":"某服饰公司推行目标管理，要求各部门自下而上制定年度目标。销售部门为完成公司下达的销售额目标，频繁开展低价促销，短期内销售额大增，却透支了市场需求、损害了品牌形象；研发部门的新品开发目标难以量化，只好用“提交报告数量”等指标代替，与销售部门在“新品上市时间”上产生矛盾、相互指责；财务部门则认为各部门目标缺少统一核算口径，无法有效考核。年终考核时，不少部门因目标完成情况与年初设定差距较大而产生争议。\n问题：","sub":[{"q":"（1）结合案例，分析该公司目标管理实施中暴露的问题及原因。（5分）","a":"①目标体系不健全、重短期轻长期：销售部门只盯短期销售额，过度促销损害品牌，体现目标管理容易导致管理者强调短期目标、不利于长期目标完成的缺陷；②目标难以量化：研发部门新品开发目标无法量化，用形式化指标代替，反映“可考核的目标往往很难确定”；③部门目标相互割裂：销售与研发部门各定各的目标、缺乏衔接，产生矛盾，反映目标设置过程中缺乏系统协调；④考核口径不统一：财务部门无法统一核算，年终考核争议不断。（采分点：每点1分，答出四点并结合案例得5分）"},{"q":"（2）针对上述问题，提出完善该公司目标管理的对策。（4分）","a":"①建立系统的目标体系，将长期目标与短期目标、组织目标与部门目标层层衔接；②加强部门间的沟通协调，统一目标口径，明确责任边界；③对难以量化的目标，采取定量指标与定性指标相结合、过程评价与成果评价相结合的方式；④完善绩效考评与奖惩机制，使目标完成情况与激励约束挂钩。（每点1分）"},{"q":"（3）运用PDCA循环，说明该公司如何实现目标管理水平的持续改进。（4分）","a":"①P（计划）：重新制定目标与行动计划，明确衡量标准和部门衔接规则；②D（实施）：严格执行计划，加强过程跟踪与检查；③C（检查）：总结执行结果，对照标准找出偏差及其原因；④A（改进）：对成功经验予以标准化，对失败教训提出整改措施，未解决的问题转入下一个循环，实现螺旋式上升。（每点1分）"}],"e":"【答题思路】本题考察目标管理与PDCA循环。第一问务必把教材中目标管理的缺陷与案例细节一一对应（低价促销→重短期轻长期；研发难量化→目标难考核；部门矛盾→目标体系不健全；考核争议→口径不统一），不能泛泛而谈；第二问针对问题逐条提出对策；第三问按P—D—C—A四阶段依次套用案例作答。","id":"mgmt-0181"},
{"ch":6,"t":"single","q":"钱德勒研究认为企业战略发展的第一个阶段是（　　）","o":["地区开拓并整合阶段","纵向联合发展阶段","数量扩大阶段","产品多样化阶段"],"a":2,"e":"战略发展四阶段：数量扩大→地区开拓→纵向联合发展→产品多样化；不同阶段要求不同组织结构（结构服从战略）。","id":"mgmt-0182"},
{"ch":6,"t":"multi","q":"组织部门化（部门划分）的基本形式有（　　）","o":["职能部门化","产品部门化","地区部门化","职能职权部门化"],"a":[0,1,2],"e":"五种部门化：职能、产品、地区、流程（工艺过程）、顾客（服务对象）。","id":"mgmt-0183"},
{"ch":6,"t":"term","q":"名词解释：集权","a":"集权是指决策权在组织系统中较高层次一定程度的集中，即组织高层集中较多的决策权力；与分权相对，分权是决策权在较低层次一定程度的分散。","e":"关键词：决策权向高层集中；与分权相对，二者各有优劣，关键在于适度。","id":"mgmt-0184"},
{"ch":6,"t":"judge","q":"管理幅度设计的影响因素包括管理者和被管理者的工作能力、工作内容和性质、工作条件与环境以及成员的差异性。","a":true,"e":"管理幅度设计四影响因素：工作能力、工作内容和性质、工作条件与环境、成员的差异性（口诀“能、容、境、异”）。原题四个选项即为教材完整清单，边界题改判断题。","id":"mgmt-0185"},
{"ch":6,"t":"judge","q":"影响分权程度的因素包括政策统一性、成员的自我管理能力、组织的可控性和组织的发展阶段，而管理者的领导风格不在其中。","a":true,"e":"影响分权程度五因素：组织规模、政策的统一性、成员的自我管理能力、组织的可控性、组织的发展阶段（口诀“规、政、管、控、阶”）；管理者的领导风格不属于教材所列因素。原题为全选清单题，边界题改判断题。","id":"mgmt-0186"},
{"ch":6,"t":"single","q":"关于授权与分权关系的表述，正确的是（　　）","o":["二者在含义与范围上完全等同，只是使用场合与表述习惯有所不同","授权只发生在组织高层，分权则只发生在组织的中层和基层管理者","分权是临时性、可随时收回的安排，授权则是永久性的制度规定","授权是分权的具体体现和实现途径，分权是授权的制度化结果"],"a":3,"e":"授权是管理者把部分职权委托给下属的短期、可收回行为；分权是组织层级间职权的制度性、长期分配；授权是分权的基础。","id":"mgmt-0187"},
{"ch":6,"t":"multi","q":"有效授权应遵循的原则有（　　）","o":["目的性原则（授权有明确目的，不为授权而授权）","信任原则（以信任为基础、减少干预、保持指挥统一）","权责一致原则（充分授权并鼓励下属承担相应责任）","级差授权原则（按层级逐级授权）"],"a":[0,1,2],"e":"授权原则：重要性、权责匹配、适度可控、级差授权；授权后仍负最终责任并需监督。","id":"mgmt-0188"},
{"ch":6,"t":"single","q":"直线人员与参谋人员产生矛盾的主要原因不包括（　　）","o":["背景、教育差异造成观点不同","双方职责、目标和考核标准不同","参谋建议被采纳后责任归属不清","二者职权完全相同"],"a":3,"e":"矛盾原因：背景观点差异、职责目标不同、责权（建议权与指挥权）不清、参谋越位或直线轻视参谋。","id":"mgmt-0189"},
{"ch":6,"t":"multi","q":"协调直线与参谋关系的方法主要有（　　）","o":["明确各自职权关系与职责范围","授予必要的职能职权并限定范围","参谋人员对其建议被采纳的后果承担全部责任","加强双方沟通、轮换与共同培训"],"a":[0,1,3],"e":"整合方法：分清职权、有限授权、责任挂钩、加强沟通与岗位轮换。","id":"mgmt-0190"},
{"ch":6,"t":"multi","q":"管理者正确对待和整合非正式组织，应当（　　）","o":["承认其客观存在，不简单取缔","分析并引导其为正式组织目标服务","规范其行为，防止消极作用","通过目标结合、感情联络和骨干影响加以整合","对消极作用的成员予以清退以消除非正式组织"],"a":[0,1,2,3],"e":"整合思路：承认—分析—引导—规范，发挥其凝聚、沟通的积极作用，限制其抵触变革、束缚成员的消极作用。","id":"mgmt-0191"},
{"ch":6,"t":"term","q":"名词解释：市场链","a":"市场链是海尔集团首创的一种组织设计理念。其核心思想是将市场经济中的利益调节机制引入企业内部，在集团宏观调控下，把企业内部的上下流程、上下工序和岗位之间的业务关系由原来的单纯行政关系转变成平等的买卖关系、服务关系和契约关系，通过这些关系把订单转变成一系列内部的市场订单，形成以订单为中心、上下工序和岗位间相互咬合、自行调节运行的市场链。","e":"关键词：海尔首创、利益调节机制、内部市场订单。（了解即可，非重点）","id":"mgmt-0192"},
{"ch":6,"t":"single","q":"只保留核心职能，依靠信息技术把设计、生产、销售等业务外包给不同合作企业、以合同和市场机制联结的组织结构是（　　）","o":["直线职能制","动态网络型结构","事业部制和矩阵制","事业部制和直线职能制"],"a":1,"e":"动态网络型结构（虚拟组织）以精干总部为中心，通过契约网络整合外部资源，高度柔性、虚拟化，但控制力较弱。","id":"mgmt-0193"},
{"ch":6,"t":"single","q":"管理者指挥下属的命令权力属于（　　）","o":["参谋职权和辅助职权","职能职权和直线职权","直线职权","矩阵职权和项目职权"],"a":2,"e":"直线职权：指挥、命令下属的上下级权力；参谋职权：咨询、建议权，无指挥权；职能职权：参谋部门部分行使直线权力。","id":"mgmt-0194"},
{"ch":6,"t":"multi","q":"组织中的职权类型包括（　　）","o":["直线职权","参谋职权","职能职权","制度职权"],"a":[0,1,2],"e":"直线职权：命令指挥；参谋职权：出谋划策；职能职权：参谋部门获得部分指挥权限。","id":"mgmt-0195"},
{"ch":6,"t":"multi","q":"组织生命周期的阶段包括（　　）","o":["创业阶段","集合阶段","规范化阶段","精细阶段和衰退阶段","整合阶段"],"a":[0,1,2,3],"e":"组织生命周期五阶段：创业、集合、规范化、精细、衰退；不同阶段组织结构、管理模式特征不同。","id":"mgmt-0196"},
{"ch":6,"t":"judge","q":"参谋职权拥有直接指挥下级的权力。","a":false,"e":"参谋职权只有建议咨询权，不具备直接指挥权力；直线职权才有指挥权。","id":"mgmt-0197"},
{"ch":6,"t":"single","q":"组织设计的最终成果是（　　）","o":["组织结构图和职责表","职务说明书","岗位职责表和工作流程图","岗位说明书和工作流程图"],"a":1,"e":"组织设计的任务是设计清晰的组织结构，规划各部门的职能和权限，最终编制职务说明书。","id":"mgmt-0198"},
{"ch":6,"t":"single","q":"当组织规模一定时，管理幅度与组织层级的关系是（　　）","o":["正比例变化关系","没有关系","先正后反","反比例关系"],"a":3,"e":"当组织规模一定时，管理幅度与组织层级呈现出反比例关系。","id":"mgmt-0199"},
{"ch":6,"t":"single","q":"事业部制组织结构的主要特点是（　　）","o":["统一指挥，分工负责","集中决策，分散经营","双重领导，纵横结合","直线指挥，参谋辅助"],"a":1,"e":"事业部制组织结构的主要特点是“集中决策，分散经营”。","id":"mgmt-0200"},
{"ch":6,"t":"single","q":"最早出现、最简单的组织结构形式是（　　）","o":["直线制","职能制","直线职能制","矩阵制"],"a":0,"e":"直线制是最早出现的一种组织结构形式。","id":"mgmt-0201"},
{"ch":6,"t":"single","q":"提出“结构服从战略”命题的学者是（　　）","o":["钱德勒","伍德沃德","伯恩斯","明茨伯格"],"a":0,"e":"美国企业史学者钱德勒提出一个重要命题：结构服从战略。","id":"mgmt-0202"},

{"ch":6,"t":"term","q":"名词解释：组织设计","a":"组织设计是对组织系统的整体设计，即按照组织目标在对管理活动进行横向和纵向分工的基础上，通过部门化形成组织框架并进行整合。","e":"关键词：横向、纵向分工→部门化→形成框架并整合。","id":"mgmt-0215"},
{"ch":6,"t":"term","q":"名词解释：管理幅度","a":"管理幅度又称管理跨度或控制幅度，是指一个管理人员直接有效地指挥下属人员的数量。当组织规模一定时，管理幅度与组织层级呈现出反比例关系。","e":"关键词：一个管理者直接有效指挥下属人员的数量。","id":"mgmt-0216"},
{"ch":6,"t":"term","q":"名词解释：事业部制","a":"事业部制组织结构是指组织面对不确定的环境，按照产品或类别、市场用户、地域以及流程等不同的业务单位分别成立若干个事业部，由事业部进行独立经营和分权管理的一种分权式组织结构。其主要特点是“集中决策，分散经营”。","e":"三要素：独立的市场、自负盈亏、独立经营。","id":"mgmt-0217"},
{"ch":6,"t":"term","q":"名词解释：非正式组织","a":"非正式组织是独立于正式组织目标之外，以人际关系和谐为导向，以非理性为行为逻辑，受潜在的不成文规定约束的个体组成的集合体。","e":"四区别：目标不同、行为逻辑不同、结合紧密程度不同、权威来源不同。","id":"mgmt-0218"},
{"ch":6,"t":"short","q":"简答：简述组织设计的原则","a":"（1）目标一致原则：组织活动围绕一定目标进行，组织设计需要以组织的整体目标为引领。包含两层含义：一是目标的一致性；二是统一指挥。\n（2）分工与协作原则：在分工的基础上实现部门间、人员间的协作与配合。\n（3）有效管理幅度原则：管理者直接管辖下属人数应控制在适当范围。\n（4）权责对等原则：各层级管理者需拥有开展工作所需的相应权力，同时承担相应责任。\n（5）柔性经济原则：组织设计需保持灵活性，同时结构设计要精干合理。","e":"口诀“目、分、幅、责、柔”。","id":"mgmt-0219"},
{"ch":6,"t":"short","q":"简答：简述影响组织设计的因素","a":"（1）环境：包括一般环境和任务环境。环境稳定时采用机械式层级结构，不稳定时采用有机式组织结构。\n（2）战略：钱德勒提出“结构服从战略”命题。单一领域发展偏向集权职能结构，多元化经营多采用分权事业部结构。\n（3）技术：伍德沃德将生产技术分为单件小批量生产、大批量生产和连续生产三类。\n（4）规模：大型组织与小型组织在规范程度、集权程度、复杂程度和人员结构四个方面存在区别。\n（5）发展阶段：组织经历生成、成长、成熟、衰退和再生五个阶段。","e":"口诀“环、战、技、规、阶”。","id":"mgmt-0220"},
{"ch":6,"t":"short","q":"简答：简述事业部制组织结构的优缺点","a":"（1）优点：\n①有利于高层管理者专注于战略规划与决策；\n②有利于培养通才；\n③提高了组织对环境的适应能力。\n（2）缺点：\n①机构重复设置导致管理成本上升；\n②容易滋生本位主义。","e":"主要特点“集中决策，分散经营”。","id":"mgmt-0221"},
{"ch":6,"t":"short","q":"简答：简述矩阵制组织结构的优缺点","a":"（1）优点：\n①机动性强；②目标明确、人员结构合理；③通过异质组合实现创新；④沟通顺畅。\n（2）缺点：\n①稳定性差；②多头领导；③权责不对等。","e":"口诀：优点“机动、明确、创新、畅通”；缺点“稳定性差、多头领导、权责不对等”。","id":"mgmt-0222"},
{"ch":6,"t":"case","q":"某机械集团由一家单一工厂逐步发展为在三个省份拥有五家分厂的跨区域集团，产品涵盖工程机械、农用机械、精密零部件三大系列，各区域客户需求差异明显。集团仍沿用按职能划分的直线职能制结构：各分厂生产计划统一由总部职能部门下达，原材料由总部集中采购，分厂负责人缺乏自主权。随着规模扩大，总部决策日益迟缓，无法及时响应区域市场变化；各分厂之间为争夺资源各自为政、重复建设生产线；总部职能部门过多干预日常经营，权责不清。管理层拟调整组织结构。\n问题：","sub":[{"q":"（1）结合影响组织设计的因素，分析该集团调整组织结构的必要性。（4分）","a":"①战略因素：集团实行多元化、跨区域经营，钱德勒提出“结构服从战略”的命题，单一领域的直线职能制结构已不适应多元化、跨区域战略的需要；②环境因素：不同区域、不同产品线面临的市场环境差异明显，要求组织结构对环境变化作出灵敏反应；③规模与发展阶段因素：集团规模扩大，管理幅度与层级矛盾突出，原有结构难以承载。（采分点：战略因素1.5分、环境因素1.5分、规模与阶段因素1分）"},{"q":"（2）你认为该集团宜采用哪种组织结构形式？请说明其特点与优缺点。（5分）","a":"①宜采用事业部制组织结构（M型组织）；②主要特点：“集中决策，分散经营”——按产品、地区或顾客等划分事业部，各事业部独立经营、自负盈亏、独立核算；③优点：有利于高层管理者专注于战略规划与决策，有利于培养通才，提高了组织对环境变化的适应能力；④缺点：机构重复设置导致管理成本上升，容易滋生本位主义。（采分点：判断1分、特点1分、优点2分、缺点1分）"},{"q":"（3）若实行分权管理，应如何设计总部的控制体系，做到“放而不乱”？（4分）","a":"①总部保留重大战略决策权、人事任免权、财务预算与资本配置权等关键权力；②通过利润指标、投资回报率等对事业部进行目标考核与监督；③建立统一的信息系统，使总部能够及时掌握各事业部经营数据；④完善内部审计与制度监督，防止事业部违规经营和本位主义蔓延。（每点1分）"}],"e":"【答题思路】本题考察组织设计。第一问用“战略—环境—规模”三个影响因素对应案例现象；第二问先判断（事业部制）再按“特点—优点—缺点”作答，并说明判断依据（跨区域、多产品线、需求差异大）；第三问围绕“集权与分权的平衡”提出可操作的控制设计，结合案例中资源重复配置等问题作答。","id":"mgmt-0223"},
{"ch":7,"t":"single","q":"组织将空缺岗位及其条件在内部公告、鼓励员工应聘的内部选聘方式是（　　）","o":["猎头公司代招（定向付费寻聘）","职务选聘海报（工作公告法）","校园选聘（应届毕业生）","劳务派遣（第三方用工）"],"a":1,"e":"职务选聘海报（布告法/工作公告）是内部选聘重要途径，公开透明，利于内部人员公平竞争和合理流动。","id":"mgmt-0224"},

{"ch":7,"t":"multi","q":"组织社会化经历的阶段有（　　）","o":["预期社会化","遭遇阶段","改变和获取阶段","离职阶段"],"a":[0,1,2],"e":"组织社会化三阶段：预期社会化（入职前认知）；遭遇（进入现实，认知冲击）；改变和获取，接纳组织规范。","id":"mgmt-0230"},
{"ch":7,"t":"single","q":"人员配备的首要任务是（　　）","o":["促进组织结构功能的有效发挥","为组织岗位物色合适的人选","充分开发和挖掘组织内的人力资源","促进人的全面和自由的发展"],"a":1,"e":"人员配备的首要任务就是根据岗位工作需要，经过严格的考查和科学的论证，找出或培训组织所需的各类人员。","id":"mgmt-0231"},
{"ch":7,"t":"single","q":"人员选聘要做到“三个匹配”，下列不属于三个匹配的是（　　）","o":["人员技能与岗位职责相匹配","人员个性与岗位特点相匹配","人员价值观与组织价值观相匹配","人员年龄与岗位工龄相匹配"],"a":3,"e":"三个匹配：人员技能与岗位职责相匹配、人员个性与岗位特点相匹配、人员价值观与组织价值观相匹配。","id":"mgmt-0232"},

{"ch":7,"t":"judge","q":"人员配备的原则包括任人唯贤、程序化规范化、因事择人因材器使、量才使用用人所长和动态平衡。","a":true,"e":"人员配备五原则：任人唯贤、程序化规范化、因事择人因材器使、量才使用用人所长、动态平衡（口诀“贤、规、事、量、衡”）。原题四选项即为教材完整清单，边界题改判断题。","id":"mgmt-0235"},

{"ch":7,"t":"judge","q":"师徒传承法的缺点是容易形成组织内的小团体。","a":true,"e":"师徒传承法的缺点是容易形成组织内的小团体，对组织的凝聚力会有一定影响。","id":"mgmt-0242"},
{"ch":7,"t":"judge","q":"人员培训只包括岗前培训。","a":false,"e":"人员培训包括岗前培训、在职培训和专题培训三种类型。","id":"mgmt-0243"},
{"ch":7,"t":"term","q":"名词解释：人员配备","a":"人员配备是指对企业员工进行恰当而有效的选拔、培训和考评，其目的是配备合适的人员去充实组织机构中所规定的各项职务，以保证组织活动的正常进行，进而实现组织的既定目标。","e":"四任务：为组织岗位物色合适的人选（首要）、促进组织结构功能的有效发挥、充分开发和挖掘组织内的人力资源、促进人的全面和自由的发展。","id":"mgmt-0244"},
{"ch":7,"t":"term","q":"名词解释：人员考评","a":"人员考评是指对一段时间内组织成员的工作能力及工作绩效进行考核与评价。人员考评要素从大的方面讲主要包括四个部分：职业品德、工作态度、工作能力、工作业绩。","e":"四内容口诀“德、态、能、绩”。","id":"mgmt-0245"},
{"ch":7,"t":"term","q":"名词解释：人员培训","a":"人员培训是指组织根据工作需要，对员工进行有计划、有组织的教育和训练，使其掌握必要的知识、技能和态度，以提高工作绩效的活动。","e":"三类型：岗前培训、在职培训、专题培训。","id":"mgmt-0246"},
{"ch":7,"t":"short","q":"简答：简述人员配备的任务","a":"（1）为组织岗位物色合适的人选。这是人员配备的首要任务。\n（2）促进组织结构功能的有效发挥。\n（3）充分开发和挖掘组织内的人力资源。\n（4）促进人的全面和自由的发展。","e":"口诀“找人、发挥、挖潜、发展”。","id":"mgmt-0247"},
{"ch":7,"t":"short","q":"简答：简述内部选聘与外部选聘的优缺点","a":"（1）内部选聘的优点：\n①可以提供激励因素和培养组织成员的忠诚度；\n②组织比较容易对选聘人员进行全面了解，所需培训较少；\n③被提升的组织成员熟悉工作环境，可以迅速适应新的工作岗位。\n内部选聘的缺点：\n①不利于引入新思想；\n②可能导致人际关系复杂、经营思想保守。\n（2）外部选聘的优点：\n①能给组织带来新观念、新思想、新技术和新方法；\n②外来者无裙带关系，能较客观地评价组织工作；\n③能聘用到已经受过训练的人员；\n④外聘人员使用较灵活。\n外部选聘的缺点：\n①有可能挫伤内部成员的工作积极性；\n②外聘者需要较长调整时间。","e":"内部“三优两缺”、外部“四优三缺”。","id":"mgmt-0248"},
{"ch":7,"t":"short","q":"简答：简述人员考评的基本内容和方法","a":"（1）人员考评的基本内容：\n①职业品德：包括忠诚度和贯彻执行；\n②工作态度：包括人际关系、组织纪律性、团队合作等；\n③工作能力：包括专业知识和技能、理解执行、沟通协调、应变创新；\n④工作业绩：包括目标达成度、工作品质、工作方法、工作绩效。\n（2）人员考评的方法：实测法、成绩记录法、书面考试法、直观评估法、情境模拟法、民主测评法、因素评分法。","e":"四内容口诀“德、态、能、绩”；七方法口诀“测、记、考、观、境、民、因”。","id":"mgmt-0249"},
{"ch":7,"t":"short","q":"简答：简述人员培训的方法","a":"人员培训的方法主要包括：\n（1）课堂讲授法：通过集中授课传授知识和理论。\n（2）工作轮换法：让员工在不同岗位轮换，培养综合能力。\n（3）师徒传承法：由经验丰富的员工指导新员工。\n（4）情景模拟法：模拟实际工作情景进行训练。\n（5）案例分析法：通过分析实际案例提升分析和解决问题的能力。\n（6）角色扮演法：让员工扮演不同角色进行演练。","e":"口诀“讲、轮、师、模、案、角”。","id":"mgmt-0250"},
{"ch":7,"t":"case","q":"某软件公司研发部门技术总监即将退休。人力资源部建议面向社会外部招聘，认为可以引进行业内熟悉大数据技术的优秀人才，为公司带来新技术、新理念；技术副总则建议从公司内部提拔，认为现任研发部副经理王强技术过硬、熟悉公司产品和团队，且内部提拔可以激励员工。公司领导层对两种意见犹豫不决：担心外部招聘的“空降兵”难以融入、成本较高；又担心内部提拔技术视野受限、缺乏新鲜血液。公司最终决定先对内部候选人进行系统考评，同时保留外部招聘作为备选。\n问题：","sub":[{"q":"（1）比较内部选聘与外部选聘的优缺点。（7分）","a":"①内部选聘优点：可以提供激励因素和培养组织成员的忠诚度；组织比较容易对选聘人员进行全面了解，所需培训较少；被提升者熟悉工作环境，可以迅速适应新的工作岗位。内部选聘缺点：不利于引入新思想，容易导致人际关系复杂、经营思想保守。②外部选聘优点：能给组织带来新观念、新思想、新技术和新方法；外来者无裙带关系，能较客观地评价组织工作；能聘用到已经受过训练的人员；外聘人员使用较灵活。外部选聘缺点：有可能挫伤内部成员的工作积极性；外聘者需要较长时间的调整与适应。（采分点：内部三优两缺3.5分、外部四优两缺3.5分）"},{"q":"（2）结合人员配备的原则，对该岗位的选聘方案提出你的建议。（6分）","a":"①坚持任人唯贤原则：以能力和业绩为标准选人，不拘泥于内部或外部；②坚持因事择人、因材器使与量才使用、用人所长原则：根据技术总监岗位对专业技术、团队管理等能力的要求，匹配合适人选，用其所长；③坚持程序化、规范化原则：通过公开竞聘、系统考评等规范程序选聘，保证公正公平；④坚持动态平衡原则：兼顾组织当前的岗位需要与长期人才梯队建设；⑤具体建议：在内部候选人考评合格的前提下，优先内部提拔以激励员工、稳定队伍，同时将外部招聘作为备选，若内部无人胜任再启动外聘。（采分点：原则每条1分、结合案例的建议1分，言之有理酌情给分）"}],"e":"【答题思路】本题考察人员配备中的选聘方式与原则。第一问按“内部—外部”两类分别列出优点、缺点，分点作答、不要遗漏；第二问先把人员配备的原则列出，再逐一对应案例中技术总监岗位特点、激励考虑和人才储备等细节提出建议，切忌脱离案例空谈原则。","id":"mgmt-0251"},
{"ch":8,"t":"single","q":"组织文化的核心层是（　　）","o":["物质层文化（表层）","制度层文化（中层）","行为层文化（外部）","精神层文化"],"a":3,"e":"组织文化由物质层（表层）文化、制度层（中层）文化和精神层（核心）文化三个基本层次构成。","id":"mgmt-0252"},
{"ch":8,"t":"single","q":"组织文化的制度层是（　　）","o":["组织文化的载体和物质标志","精神层向物质层转化的中介","组织文化的灵魂和核心内容","组织文化的中层和制度安排"],"a":1,"e":"制度层文化是组织文化的中间层次，是潜层次的精神层文化向表层的物质层文化转化的中介。","id":"mgmt-0253"},
{"ch":8,"t":"single","q":"提出棒球队型、俱乐部型、学院型、要塞型四种组织文化分类的学者是（　　）","o":["科特和赫斯克特","桑南菲尔德","德鲁克和明茨伯格","赫斯克特和科特"],"a":1,"e":"美国埃默里大学的杰弗里·桑南菲尔德按组织文化的内在特征，将组织文化划分为四种类型：棒球队型、俱乐部型、学院型、要塞型。注意：第一版称\"堡垒型\"，第二版改为\"要塞型\"。","id":"mgmt-0254"},
{"ch":8,"t":"single","q":"提出强力型、策略合理型、灵活适应型三种组织文化分类的学者是（　　）","o":["科特和赫斯克特","桑南菲尔德和德鲁克","德鲁克和明茨伯格","明茨伯格和赫斯克特"],"a":0,"e":"美国哈佛商学院教授约翰·科特和詹姆斯·赫斯克特依据组织文化对组织成员的影响力，将组织文化分为三种类型。","id":"mgmt-0255"},
{"ch":8,"t":"single","q":"提出“组织文化就是老板文化”这一说法的依据是（　　）","o":["组织成员的素质","领导者的素质","组织发展的阶段","民族文化"],"a":1,"e":"领导者的价值观念、经营哲学、行为方式及人格特征等都对组织文化的形成和发展具有显著影响。","id":"mgmt-0256"},
{"ch":8,"t":"judge","q":"组织文化的特征包括精神性、系统性、相对稳定性和融合继承性。","a":true,"e":"第二版组织文化四特征：精神性、系统性、相对稳定性、融合继承性（口诀“精、系、稳、融”），第一版“融合性”已改为“融合继承性”。原题四选项即为教材完整清单，边界题改判断题。","id":"mgmt-0257"},
{"ch":8,"t":"multi","q":"影响组织文化形成与发展的外部因素包括（　　）","o":["民族文化","制度文化","外来文化","领导者的素质"],"a":[0,1,2],"e":"外部因素三：民族文化、制度文化、外来文化。内部因素三：领导者的素质、组织成员的素质、组织发展的不同阶段。","id":"mgmt-0258"},
{"ch":8,"t":"multi","q":"组织文化的正功能包括（　　）","o":["导向功能","凝聚功能","激励和约束功能","辐射功能和调适功能","奖惩功能"],"a":[0,1,2,3],"e":"正功能五口诀“导、凝、激励、辐、调”。","id":"mgmt-0259"},
{"ch":8,"t":"multi","q":"组织文化的反功能包括（　　）","o":["可能成为组织变革的障碍","可能成为组织有效决策的障碍","可能成为组织并购的障碍","可能降低组织效率"],"a":[0,1,2],"e":"反功能三口诀“变革、决策、并购”。","id":"mgmt-0260"},
{"ch":8,"t":"judge","q":"组织文化塑造的步骤依次是选择价值观、强化认同、提炼定格和巩固完善，其中选择价值观是首要任务。","a":true,"e":"组织文化塑造四步骤：选择价值观（首要任务，价值观是文化的核心和灵魂）→强化认同→提炼定格→巩固完善。原题四选项即为教材完整清单，边界题改判断题。","id":"mgmt-0261"},
{"ch":8,"t":"judge","q":"组织文化的核心层是物质层文化。","a":false,"e":"组织文化的核心层是精神层文化。","id":"mgmt-0262"},
{"ch":8,"t":"judge","q":"组织文化的稳定性是绝对的，不会随环境变化而改变。","a":false,"e":"组织文化的稳定性是相对的。","id":"mgmt-0263"},
{"ch":8,"t":"judge","q":"组织文化一旦形成，对组织成员的行为影响是持续的、普遍的、低成本的。","a":true,"e":"组织文化一旦形成，对组织成员的行为影响就会是持续的、普遍的，而且是低成本的。","id":"mgmt-0264"},
{"ch":8,"t":"judge","q":"选择价值观是塑造良好组织文化的首要任务。","a":true,"e":"组织价值观是整个组织文化的核心和灵魂，选择正确的组织价值观是塑造良好组织文化的首要任务。","id":"mgmt-0265"},
{"ch":8,"t":"term","q":"名词解释：组织文化","a":"组织文化指的是一个组织在长期实践活动中形成的具有本组织特征的文化现象，是组织中的全体成员共同接受和共同遵循的价值观念和行为准则。","e":"关键词：长期实践形成＋具有本组织特征＋全体成员共同接受和遵循。","id":"mgmt-0266"},
{"ch":8,"t":"term","q":"名词解释：主文化","a":"主文化体现组织的核心价值观，它为组织大多数成员所认可。任何一个组织都因为拥有这种宏观层面的文化，才具有独特的个性。","e":"对比记忆：亚文化是某一社会主流文化中一个较小的组成部分。","id":"mgmt-0267"},
{"ch":8,"t":"term","q":"名词解释：亚文化","a":"亚文化是某一社会主流文化中一个较小的组成部分。存在于组织中的各种小群体，无论是正式的、有严格划分的子系统，还是非正式群体，都有其独特的亚文化。","e":"三种关系：有益补充、相悖、无害甚至替代。","id":"mgmt-0268"},
{"ch":8,"t":"short","q":"简答：简述组织文化的构成层次","a":"组织文化由物质层（表层）文化、制度层（中层）文化和精神层（核心）文化三个基本层次构成：\n（1）物质层文化：是组织文化的表层部分，是精神层文化和制度层文化的载体。\n（2）制度层文化：是组织文化的中间层次，是潜层次的精神层文化向表层的物质层文化转化的中介。\n（3）精神层文化：是组织价值观的核心，是组织文化的灵魂，是维系组织生存与发展的精神支柱。","e":"口诀“表、中、心”。","id":"mgmt-0269"},
{"ch":8,"t":"short","q":"简答：简述组织文化的功能","a":"（1）正功能：\n①导向功能；②凝聚功能；③激励和约束功能；④辐射功能；⑤调适功能。\n（2）反功能：可能成为组织变革的障碍、组织有效决策的障碍、组织并购的障碍。","e":"正功能五口诀“导、凝、激励、辐、调”；反功能三口诀“变革、决策、并购”。","id":"mgmt-0270"},
{"ch":8,"t":"short","q":"简答：简述组织文化塑造的途径","a":"（1）选择价值观：组织价值观是整个组织文化的核心和灵魂。\n（2）强化认同：①广泛宣传；②培养和树立典型；③加强培训和教育。\n（3）提炼定格：①精心分析；②全面归纳；③精练定格。\n（4）巩固完善：①建立奖优罚劣的规章制度；②领导者率先垂范。","e":"四步骤口诀“选、认、炼、固”。","id":"mgmt-0271"},
{"ch":9,"t":"single","q":"领导者在带领下属实现组织目标的过程中，主要发挥的作用是（　　）","o":["指挥作用、协调作用、激励作用","计划作用、组织作用和控制作用","授权作用、监督作用和绩效考核作用","沟通作用、谈判作用和决策作用"],"a":0,"e":"领导三作用：指挥（指明方向）、协调（理顺关系、化解矛盾）、激励（调动积极性）。","id":"mgmt-0272"},
{"ch":9,"t":"single","q":"主要依靠领导者个人魅力、通过描绘和灌输愿景鼓舞追随者的领导类型是（　　）","o":["利益交换型领导","魅力型领导","日常事务型领导","自由放任型领导"],"a":1,"e":"魅力型领导以个人感召力和愿景影响下属，常与变革型领导相联系；交易型领导以利益交换为基础。","id":"mgmt-0273"},
{"ch":9,"t":"multi","q":"勒温通过实验划分的领导方式（作风）有（　　）","o":["专制（专权）型","民主型","放任型","权变型"],"a":[0,1,2],"e":"勒温三种领导方式：专制型、民主型、放任型；一般认为民主型效率与关系较好，但有效性仍取决于情境。","id":"mgmt-0274"},
{"ch":9,"t":"single","q":"密歇根大学研究提出的两类领导方式是（　　）","o":["关怀维度与定规（结构）维度两类","任务结构、职位权力与领导关系","员工导向与生产（工作）导向","专制式、民主式与放任式领导作风"],"a":2,"e":"密歇根（李克特）研究比较员工导向与生产导向，认为员工导向的领导与较高群体生产率和满意度相联系。","id":"mgmt-0275"},
{"ch":9,"t":"single","q":"俄亥俄州立大学研究把领导行为归纳为两个维度，即（　　）","o":["员工导向与生产（工作）导向两类","任务结构、职位权力与领导者关系","对生产的关心与对人的关心两维度","关怀维度和定规（结构）维度"],"a":3,"e":"俄亥俄研究：关怀（关心下属、尊重意见）与定规（界定角色、安排工作、定规则），“高关怀—高定规”通常效果较好；易混：密歇根是员工/生产导向。","id":"mgmt-0276"},
{"ch":9,"t":"judge","q":"选拔和评价领导者，必须立足中国实际，推动领导者标准的中国化时代化，不能照搬西方领导理论。","a":true,"e":"领导标准中国化时代化要求坚持党的领导、德才兼备以德为先，把政治素质、能力作风与时代要求和中国情境结合。","id":"mgmt-0277"},
{"ch":9,"t":"single","q":"领导的本质是（　　）","o":["影响力","法定职权","职务权力","行政控制"],"a":0,"e":"领导的本质是对被领导者的影响力，这种影响力来自下属自愿的服从与追随。","id":"mgmt-0278"},

{"ch":9,"t":"judge","q":"领导者对被领导者的影响力只能来自组织职位所赋予的法定权力，与领导者的个人特征无关。","a":false,"e":"领导权力有五种来源：奖赏权力、强制权力、法定权力（三者属职位权力），参照权力、专家权力（二者属个人权力）。参照权力源于领导者的个人特征与魅力，专家权力源于其专业知识或技能，均与职位无关，故题干错误。原题为四选项全选清单题，属边界题，改判断题。","id":"mgmt-0289"},
{"ch":9,"t":"judge","q":"巴斯指出，变革型领导采用理想化影响力、鼓舞性激励、智力激发和个性化关怀四种相互关联的方式。","a":true,"e":"巴斯变革型领导四方式：理想化影响力（榜样、受敬佩尊重信任、考虑追随者需要、分担风险）、鼓舞性激励（表达美好愿景、提供意义与挑战、激发团队精神）、智力激发（质疑旧假定传统、鼓励创新）、个性化关怀（关注个体需求能力抱负、耐心倾听指导），口诀“影响、激励、智力、关怀”。原题四选项即为教材完整清单，边界题改判断题。","id":"mgmt-0290"},

{"ch":9,"t":"term","q":"名词解释：领导","a":"领导是指利用组织赋予的权力和自身的能力去指挥和影响下属为实现组织目标而努力工作的管理活动过程。","e":"关键因素：人（领导者和被领导者）、影响、目标。领导本质是影响力。","id":"mgmt-0298"},
{"ch":9,"t":"term","q":"名词解释：变革型领导","a":"变革型领导指的是领导者和追随者相互将对方的动机和道德提升到更高水平的过程。这一过程将追随者的需要层次从对安全和保障的需要提升到对成就和自我实现的需要。","e":"四方式：理想化影响力、鼓舞性激励、智力激发、个性化关怀。","id":"mgmt-0299"},
{"ch":9,"t":"term","q":"名词解释：交易型领导","a":"交易型领导指的是领导者和追随者之间的交换关系，以满足他们的个人利益。这种交换在本质上可能是经济的、政治的或心理的。","e":"与变革型领导对比记忆。","id":"mgmt-0300"},
{"ch":9,"t":"term","q":"名词解释：领导—成员交换理论","a":"领导—成员交换理论认为领导者并不是以同样的行为对待所有下属，而是对于不同特点的下属会采取不同的领导方式。根据关系的不同，领导者将下属分为圈内人和圈外人。","e":"四个维度：贡献、情感、忠诚、职业尊重。","id":"mgmt-0301"},
{"ch":9,"t":"term","q":"名词解释：情境领导模型","a":"情境领导模型是由赫塞和布兰查德提出的领导理论。该理论认为，领导者的领导方式应随着下属成熟度的不同而改变。下属成熟度分为R1（既无能力又不愿意）、R2（无能力但愿意）、R3（有能力但不愿意）、R4（既愿意又有能力）四个级别，对应告知型、推销型、参与型和授权型四种领导方式。","e":"四级别对应四方式。","id":"mgmt-0302"},
{"ch":9,"t":"short","q":"简答：简述领导与管理的区别","a":"（1）范围不同：领导是管理的一个部分，属于管理工作的范畴；而管理除了领导职能，还包含了决策、组织、控制和创新等其他职能。\n（2）权力来源不同：管理的权力来自组织结构，建立在合法的和强制性的权力基础之上；领导的权力可以来源于其所在职位，也可以来源于其个人。","e":"重点记“范围、权力来源”两区别。","id":"mgmt-0303"},
{"ch":9,"t":"short","q":"简答：简述领导权力的五种来源","a":"根据约翰·弗兰奇和伯特伦·瑞文的观点，权力有五种：\n（1）奖赏权力：能够对他人进行奖赏的权力。\n（2）强制权力：惩罚的权力。\n（3）法定权力：特定职位和角色被法定的、公认的正式权力。\n（4）参照权力：源于领导者个人的特征。\n（5）专家权力：产生于领导者个人的专业知识或技能。\n其中前三种与职位相关，统称职位权力；后两种与个人有关，统称个人权力。","e":"口诀“奖、惩、法、参、专”。","id":"mgmt-0304"},
{"ch":9,"t":"short","q":"简答：简述管理方格理论","a":"罗伯特·布莱克和简·莫顿指出，以生产为中心和以人为中心的领导者行为是可以同时存在的。五种典型的领导方式为：\n（1）（1，9）乡村俱乐部型管理：对生产较少关心，对人高度关心。\n（2）（9，1）任务型管理：高度关心生产，很少关心人。\n（3）（1，1）贫乏型管理：对生产和人都极少关心。\n（4）（9，9）团队型管理：把对生产的高度关心和对人的高度关心结合起来，这是最有效的。\n（5）（5，5）中间型管理：对生产和对人的关心都是适度的。","e":"横轴＝对生产的关心，纵轴＝对人的关心。最有效的是（9，9）团队型。","id":"mgmt-0305"},
{"ch":9,"t":"short","q":"简答：简述费德勒权变领导理论","a":"（1）费德勒权变模型指出，组织的效率取决于两个变量的相互作用：一个是领导者的风格，另一个是情境的有利性。\n（2）领导者的风格分为两类：任务取向型和关系取向型。费德勒设计了最难共事者（LPC）问卷来测量。\n（3）情境的有利性从三个维度分析：①领导者—成员关系（最重要）；②任务结构（第二重要）；③职位权力。\n（4）匹配结论：任务取向型领导者在非常有利或非常不利的情境下表现得更好；关系取向型领导者则在中等有利的情境下绩效较好。","e":"口诀“任务走两端、关系在中间”。","id":"mgmt-0306"},
{"ch":9,"t":"short","q":"简答：简述情境领导模型的内容","a":"情境领导模型由赫塞和布兰查德提出，认为领导者的领导方式应随着下属成熟度的不同而改变。\n（1）下属成熟度四个级别：\n①R1：既无能力又不愿意承担任务；\n②R2：无能力但愿意承担任务；\n③R3：有能力但不愿意承担任务；\n④R4：既愿意又有能力承担任务。\n（2）四种领导方式：\n①告知型（S1，高任务/低关系）：适用于R1；\n②推销型（S2，高任务/高关系）：适用于R2；\n③参与型（S3，低任务/高关系）：适用于R3；\n④授权型（S4，低任务/低关系）：适用于R4。","e":"口诀“R1告知、R2推销、R3参与、R4授权”。","id":"mgmt-0307"},
{"ch":9,"t":"short","q":"简答：简述领导-成员交换理论","a":"领导-成员交换理论由格雷恩等人提出。\n（1）核心观点：领导者并不是以同样的行为对待所有下属，而是对于不同特点的下属会采取不同的领导方式。\n（2）圈内人与圈外人：根据关系的不同，领导者将下属分为圈内人和圈外人。圈内人得到更多的信任、关怀和资源，圈外人则相反。\n（3）四个维度：贡献、情感、忠诚、职业尊重。","e":"四个维度口诀“贡献、情感、忠诚、职业尊重”。","id":"mgmt-0308"},
{"ch":9,"t":"case","q":"某制造企业任命张某为装配车间经理。张某到任后发现，车间多数员工技术熟练、经验丰富，完全具备独立完成装配任务的能力，但工作积极性普遍不高，对张经理下达的指令阳奉阴违，有任务就往后推。经深入了解，张某得知：员工们并不是不会做，而是觉得车间缺少自主空间，任何操作细节都要听上级安排，干好干坏一个样，因而不愿承担更多责任。张某为此很苦恼，不知道应该采用更严格的管理方式，还是放手让员工自行安排。\n问题：","sub":[{"q":"（1）依据情境领导模型，判断该车间员工的成熟度水平，并说明判断依据。（4分）","a":"①员工处于R3成熟度水平（中高成熟度）：具有从事分配工作任务的能力，却不愿意去做；②判断依据：情境领导模型以“能力”和“意愿”两个维度划分下属成熟度，案例中员工技术熟练、经验丰富（有能力），但积极性不高、不愿承担责任（不愿意），属于“有能力但不愿意”的R3类型。（采分点：判断2分、依据2分）"},{"q":"（2）张某应采取哪种领导风格？为什么？（4分）","a":"①应采取参与型领导风格（S3，低任务/高关系）；②理由：参与型领导方式适用于R3下属——让下属参与决策，领导者为其提供便利条件和必要支持，充分信任和尊重下属；③不宜继续采用高任务的告知型（S1）或推销型（S2）风格，否则会进一步挫伤员工的积极性。（采分点：风格判断2分、适用理由2分）"},{"q":"（3）结合领导权力来源理论，分析张某应如何提升自己对员工的影响力。（5分）","a":"①职位权力方面：合理运用法定权力和奖赏权力，对表现优秀的员工及时肯定与奖励，慎用强制权力；②个人权力方面：提升专家权力——用过硬的专业知识指导员工，赢得技术上的信服；提升参照权力——以身作则、公正待人，成为员工认可的榜样；③通过授权和信任扩大员工自主空间，把权力行使转化为对员工的有效影响。（采分点：职位权力1分、专家权力2分、参照权力与授权2分，结合案例酌情给分）"}],"e":"【答题思路】本题考察情境领导模型与领导权力来源。第一问务必先判断再给依据（有能力、意愿低→R3）；第二问把S1—S4与R1—R4的对应关系写清楚，说明“为什么是参与型”；第三问按职位权力、个人权力分层作答，并落到案例中“调动积极性、扩大自主空间”的具体做法。","id":"mgmt-0309"},
{"ch":10,"t":"short","q":"简答：简述X理论与Y理论的主要观点","a":"麦格雷戈提出两种对立的人性假设：\n（1）X理论（对应经济人）：人天生厌恶劳动、逃避责任、缺乏进取心，必须靠强制、惩罚和指挥控制才能使其努力工作，主张集权。\n（2）Y理论（对应自我实现人）：人并非天生厌恶工作，工作如同游戏休息一样自然；人能够自我指挥、自我控制，主动承担责任，多数人具有创造力，主张分权、参与和授权。","e":"X＝性恶、靠管；Y＝性善、靠引导；管理应更多依据Y理论。","id":"mgmt-0310"},
{"ch":10,"t":"single","q":"综合期望理论和公平理论、提出“努力—绩效—奖酬—满足”综合激励模型的学者是（　　）","o":["维克托·弗鲁姆","约翰·亚当斯","伯尔赫斯·斯金纳","波特和劳勒"],"a":3,"e":"波特—劳勒综合激励理论认为努力取决于奖酬价值与期望概率，绩效带来内在、外在奖酬，经公平比较后产生满足感并形成反馈。","id":"mgmt-0311"},
{"ch":10,"t":"single","q":"激励工作中最应优先发现并满足的是职工的（　　）","o":["安全与稳定的基本需要","生理与社交方面的需要","主导（优势）需要","物质待遇方面的需要"],"a":2,"e":"多种需要中在一定时期总有一种占支配地位的主导（优势）需要，抓住主导需要激励才最有效。","id":"mgmt-0312"},

{"ch":10,"t":"judge","q":"超Y理论即复杂人假设，它认为人的需要和动机是复杂多变的，不存在一种适用于任何时代、任何人的管理方式。","a":true,"e":"四种人性假设：经济人假设（X理论）、社会人假设（人际关系理论）、自我实现人假设（Y理论）、复杂人假设（超Y理论）。复杂人假设强调人的需要与动机复杂多变，管理方式应因人因情境而异。原题为四选项全选清单题，边界题改判断题。","id":"mgmt-0321"},

{"ch":10,"t":"judge","q":"根据强化的目的，强化可分为正强化、负强化和惩罚三种类型。","a":false,"e":"依据强化的目的，强化分为四种类型：正强化、负强化、惩罚和自然消退。自然消退是指通过避免为某种行为提供任何积极反馈来减少该行为的发生，题干漏掉该类型，故错误。原题为四选项全选清单题，边界题改判断题。","id":"mgmt-0323"},
