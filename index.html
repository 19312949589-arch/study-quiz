{"ch":10,"t":"term","q":"名词解释：激励","a":"激励是组织诱发个体产生满足某种需要的动机进而促使个体行为与组织目标趋同的管理过程。因此，激励应从调动人的积极性的角度出发，系统解决“激励什么”和“如何激励”两个关键问题。","e":"两关键问题：“激励什么”“如何激励”。","id":"mgmt-0330"},
{"ch":10,"t":"term","q":"名词解释：保健因素","a":"保健因素是指那些与人们的不满情绪有关的因素。典型的保健因素有企业政策、工资水平、工作环境、劳动保护、人际关系、安全等。保健因素处理不好，会引发对工作的不满情绪；处理得好，可以预防或消除这种不满。但这类因素并不能对员工起到激励的作用。","e":"保健因素只能消除不满意，不能产生满意。","id":"mgmt-0331"},
{"ch":10,"t":"term","q":"名词解释：公平理论","a":"公平理论又称社会比较理论，是由美国心理学家约翰·亚当斯提出的，主要讨论报酬的合理性、公平性对人们工作积极性的影响。人们对报酬是否满意产生于一个社会比较过程，满意的程度不仅取决于绝对报酬，更取决于相对报酬。","e":"横向比较（与他人比）、纵向比较（与自己过去比）。","id":"mgmt-0332"},
{"ch":10,"t":"term","q":"名词解释：期望理论","a":"期望理论由美国心理学家维克托·弗鲁姆提出。该理论认为，人们从事任何工作行为的激励程度将取决于经过其努力后取得的成果的价值与他对实现目标的可能性的估计的乘积，即激励力＝效价×期望值（M＝V×E）。","e":"公式M＝V×E是必背内容。","id":"mgmt-0333"},
{"ch":10,"t":"short","q":"简答：简述需要层次理论","a":"需要层次理论由美国心理学家亚伯拉罕·马斯洛提出。\n（1）五个层次：生理需要、安全需要、社交需要、尊重需要、自我实现需要。\n（2）五个层次分为高低两级：生理需要、安全需要和社交需要属于较低层次的需要；尊重需要和自我实现需要属于较高层次的需要。\n（3）主要观点：\n①人是有需要的动物，只有尚未满足的需要能够影响行为；\n②人的需要都有高低层次，某一层需要得到满足后，另一层需要才出现；\n③未满足的需要才具有激励作用。","e":"口诀“生安社尊我”。","id":"mgmt-0334"},
{"ch":10,"t":"short","q":"简答：简述双因素理论","a":"双因素理论是由美国心理学家赫茨伯格提出的，又称激励—保健理论。\n（1）主要观点：\n①满意和不满意并非共存于单一连续体中，而是截然分开的；\n②使人们感到不满意的因素往往都是属于工作环境或外界因素方面的，被称为保健因素；\n③使人们感到满意的因素往往都是属于工作本身或工作内容方面的，被称为激励因素；\n④保健因素只能消除不满意，激励因素才是调动人们积极性的关键。","e":"关键结论：“满意的对立面是没有满意，不满意的对立面是没有不满意”。","id":"mgmt-0335"},
{"ch":10,"t":"short","q":"简答：简述期望理论及其对管理者的启示","a":"（1）期望理论由美国心理学家维克托·弗鲁姆提出。其公式为：M＝V×E\nM是人们所感受到的激励程度；V（效价）是人们对某一预期成果或目标的重视程度或偏好程度；E（期望值）是人们对通过特定的行为活动达到预期成果或目标的可能性的概率判断。\n（2）激励的过程要处理好三方面的关系：\n①努力与绩效的关系；②绩效与奖励的关系；③奖励与满足需要的关系。\n（3）启示：管理者应使工作的能力要求略高于执行者的实际能力。","e":"公式M＝V×E＋三关系。","id":"mgmt-0336"},
{"ch":10,"t":"short","q":"简答：简述强化理论","a":"强化理论是由美国心理学家斯金纳提出的。该理论认为，人们出于某种动机，会采取一定的行为作用于环境；如果这种行为的结果对他有利，这种行为会重复出现；若对他不利，这种行为会减少或消失。\n（1）根据强化的目的，可以分为四种类型：\n①正强化：通过出现积极的、令人愉快的结果而使某种行为得到加强；\n②负强化：通过消除或减少令人厌恶的结果来增加某种行为发生的可能性；\n③惩罚：对令人不快或不希望的行为给予处罚；\n④自然消退：通过避免为某种行为提供任何积极反馈来减少该行为的发生。\n（2）应用原则：①按照强化对象的不同需要采取不同的强化措施；②对所期望取得的工作业绩应予以明确的规定和表述；③对工作业绩予以及时的反馈。","e":"易混点：负强化是“消除厌恶结果→增加行为”，惩罚是“给予处罚→减少行为”。","id":"mgmt-0337"},
{"ch":10,"t":"case","q":"某互联网科技公司近两年员工流失率居高不下，技术骨干流失尤为严重，直接导致多个项目延期。公司薪酬水平在行业中处于中等水平，但加班严重，几乎每天都要晚上九点以后下班；晋升通道不清晰，员工干满三年仍看不到发展空间；员工普遍反映“只是拿钱干活，没有成就感”。人力资源部建议提高薪酬待遇留住人才，CEO则认为薪酬水平并不算低，问题出在工作氛围和企业文化上，主张先改善管理、营造良好氛围。公司内部对留人策略争论不休。\n问题：","sub":[{"q":"（1）运用双因素理论，分析该公司员工流失的主要原因。（5分）","a":"①双因素理论认为，影响员工行为的因素分为保健因素与激励因素：保健因素只能消除不满意，激励因素才能带来满意并产生激励作用；②案例中加班严重、工作环境差属于保健因素处理不好，引发员工不满；③薪酬处于中等水平，即便提高也只能消除部分不满，难以产生激励效果；④晋升通道不清晰、缺乏成就感、工作本身缺乏挑战性属于激励因素缺失，这才是技术骨干流失的根本原因。（采分点：理论要点2分、保健因素分析1分、激励因素缺失2分）"},{"q":"（2）运用期望理论（或公平理论），分析“提高薪酬留人”方案可能存在的问题。（4分）","a":"①用期望理论看：激励力=效价×期望值。员工努力后若看不到绩效与奖励之间的明确联系（晋升无通道、奖励不明确），即使薪酬提高，其期望值仍然偏低，激励力不足，难以稳定留住人才；②用公平理论看：员工会将自身投入与所得报酬同他人进行横向比较，也会与自己的过去进行纵向比较，若感到付出（长期加班）与回报（中等薪酬）不匹配，会产生不公平感而选择离职；③因此，单纯“高薪留人”治标不治本。（采分点：理论要点2分、结合案例分析2分）"},{"q":"（3）如果你是该公司HR总监，请提出一套综合性的留人方案。（4分）","a":"①改善保健因素：合理确定薪酬水平、控制过度加班、改善办公环境；②强化激励因素：建立清晰的多通道晋升机制，提供有挑战性的项目和工作，及时认可与表彰员工成就；③确保公平：建立公开透明的绩效考核与薪酬分配制度；④关注员工成长：提供培训与职业发展机会，培育积极向上的组织文化。（每点1分，言之有理酌情给分）"}],"e":"【答题思路】本题是激励章节案例分析的高频考法，务必“理论+案例”一一对应。第一问先写出双因素理论要点，再用“保健因素：加班、环境”和“激励因素：晋升、成就感”分别解释流失原因；第二问选择期望理论或公平理论之一即可，但要结合案例中“加班、薪酬中等、晋升不清”等细节；第三问按“保健因素—激励因素—公平—成长发展”综合作答。","id":"mgmt-0338"},
{"ch":11,"t":"judge","q":"组织冲突只源于资源相对稀缺和信息沟通失误，与目标差异、结构差异无关。","a":false,"e":"冲突的来源大致可分为个体差异、沟通差异和结构差异三大类，具体包括目标不相容、资源相对稀缺、层级结构关系差异以及信息沟通失误和相互竞争等。题干把来源仅归结为两类并否定目标差异与结构差异，故错误。原题为四选项全选清单题，边界题改判断题。","id":"mgmt-0339"},
{"ch":11,"t":"judge","q":"沟通过程由发送者、编码、信息、渠道、解码、接收者、反馈等基本要素构成，噪声则存在于沟通过程的各个环节。","a":true,"e":"沟通过程七要素：发送者→编码→信息→渠道→解码→接收者→反馈；噪声是七要素之外的干扰因素，存在于沟通过程的各个环节，不属于某一固定环节。原题四选项即为完整要素清单，边界题改判断题。","id":"mgmt-0340"},
{"ch":11,"t":"judge","q":"按信息传递的方法（媒介）划分，沟通可分为口头沟通、书面沟通、非言语沟通和电子沟通。","a":true,"e":"按信息传递的媒介划分，沟通分为口头沟通、书面沟通、非言语沟通和电子沟通：口头沟通灵活、反馈快但易失真，书面沟通规范可保存，非言语沟通（表情动作语调）起辅助作用，电子沟通快捷、范围广。原题四选项即为完整清单，边界题改判断题。","id":"mgmt-0341"},
{"ch":11,"t":"single","q":"非正式沟通网络当中，把信息传递给少数挑选对象，再由他们扩散出去，是（　　）","o":["集束式","流言式网络","随机式网络","单线式网络"],"a":0,"e":"集束式（最普遍）；流言式：一个人散播给所有人；随机式随机传递；单线式逐个传递链条传播。","id":"mgmt-0342"},
{"ch":11,"t":"multi","q":"非正式沟通网络形式有（　　）","o":["集束式","流言式","轮式","单线式"],"a":[0,1,3],"e":"集束式是现实组织最常见非正式沟通模式。","id":"mgmt-0343"},
{"ch":11,"t":"single","q":"在面对面沟通中，信息来源占比最大的是（　　）","o":["说话人所使用的具体词汇","面部表情和身体语言","说话时的语音语调与节奏","事先准备好的书面文字材料"],"a":1,"e":"研究表明，在面对面的交谈中，信息的55%来自面部表情和身体语言，38%来自语调，只有7%真正来自词汇。","id":"mgmt-0344"},
{"ch":11,"t":"single","q":"传统组织内最主要的沟通渠道是（　　）","o":["自下而上的沟通","同级之间的沟通","跨部门层级的沟通","下行沟通"],"a":3,"e":"下行沟通是指信息由组织中的较高层级向较低层级流动的过程，这是传统组织内最主要的沟通渠道。","id":"mgmt-0345"},
{"ch":11,"t":"single","q":"非正式沟通网络中最普通的形式是（　　）","o":["流言式网络","随机式网络","集束式","单线式网络"],"a":2,"e":"集束式是最普通的形式，信息拥有者将信息传递给经过选择的有限人员。","id":"mgmt-0346"},
{"ch":11,"t":"single","q":"托马斯冲突处理策略中，代表双赢局面的策略是（　　）","o":["竞争策略（利己）","回避策略（双输）","合作策略","迁就策略（利他）"],"a":2,"e":"合作策略是指尽可能满足双方利益，代表了冲突解决中的双赢局面。","id":"mgmt-0347"},
{"ch":11,"t":"multi","q":"沟通的功能包括（　　）","o":["降低管理的模糊性，提高管理的效能","组织的凝聚剂和润滑剂","组织与外部环境之间建立联系的桥梁","提高员工的技术水平"],"a":[0,1,2],"e":"沟通三功能口诀“降模糊、凝润滑、架桥梁”。","id":"mgmt-0348"},
{"ch":11,"t":"judge","q":"人际沟通障碍只表现为表达能力和知识经验的差异，与情绪、选择性知觉和信息过滤无关。","a":false,"e":"人际沟通障碍主要有七种：表达能力、知识和经验差异、个性和人际关系、情绪、选择性知觉、信息过滤、信息过载（口诀“表、知、个、情、选、滤、载”）。题干只承认其中两种并否定其余，故错误。原题为四选项全选清单题，边界题改判断题。","id":"mgmt-0349"},
{"ch":11,"t":"judge","q":"冲突具有存在的客观性、知觉的主观性和影响的二重性，冲突水平越高，组织绩效就越好。","a":false,"e":"冲突的四个特征：存在的客观性、知觉的主观性、影响的二重性以及冲突水平与绩效关系的不确定性。冲突水平与绩效并非简单的线性关系，过低或过高都不利于绩效，中等水平通常最优，故题干后半句错误。原题为四选项全选清单题，边界题改判断题。","id":"mgmt-0350"},
{"ch":11,"t":"judge","q":"托马斯提出的冲突处理策略包括竞争、合作、回避、迁就和妥协五种。","a":true,"e":"托马斯以“合作性”为横坐标、“坚持己见”为纵坐标构成冲突行为二维空间，组合出五种策略：竞争（坚持己见、不合作）、合作（坚持己见、合作）、回避（不坚持己见、不合作）、迁就（不坚持己见、合作）、妥协（中等坚持、中等合作），口诀“竞合回迁妥”。原题四选项即为完整清单，边界题改判断题。","id":"mgmt-0351"},
{"ch":11,"t":"judge","q":"非正式沟通的信息往往不确定性高，容易传播流言蜚语。","a":true,"e":"非正式沟通的缺点是较难控制，传递的信息往往不确定性高。","id":"mgmt-0352"},
{"ch":11,"t":"judge","q":"冲突对组织只有消极影响，没有积极影响。","a":false,"e":"冲突具有二重性：既具有建设性、有益性，又具有破坏性、有害性。","id":"mgmt-0353"},
{"ch":11,"t":"judge","q":"当冲突水平过低时，组织会缺乏生机和活力，绩效低下。","a":true,"e":"当冲突水平过低时，组织缺乏生机和活力，会进入变革困难时期。","id":"mgmt-0354"},
{"ch":11,"t":"judge","q":"下行沟通是传统组织内最主要的沟通渠道。","a":true,"e":"下行沟通是指信息由组织中的较高层级向较低层级流动的过程，这是传统组织内最主要的沟通渠道。","id":"mgmt-0355"},
{"ch":11,"t":"term","q":"名词解释：沟通","a":"沟通是信息的传递与理解的过程，是在两人或更多人之间进行的在事实、思想、意见和情感等方面的交流。有效的沟通不仅包括信息的传递，还包括信息的被理解。","e":"关键词：信息的传递与理解＋被理解（不必完全接受）。","id":"mgmt-0356"},
{"ch":11,"t":"term","q":"名词解释：非正式沟通","a":"非正式沟通是指在正式沟通渠道以外进行的信息传递和交流。非正式沟通的主要功能是传播员工所关心的信息，体现个人兴趣和利益，与组织正式的要求无关。","e":"非正式沟通网络四形式：集束式（最普通）、随机式、流言式、单线式（最少见）。","id":"mgmt-0357"},
{"ch":11,"t":"term","q":"名词解释：冲突","a":"冲突是相互作用的主体之间存在的不相容的行为或目标，发生于对稀缺资源分配方式的分歧以及不同的观点、信念、行为、个性的冲撞。","e":"三特征：存在的客观性、知觉的主观性、影响的二重性。","id":"mgmt-0358"},
{"ch":11,"t":"short","q":"简答：简述沟通的功能","a":"沟通是信息的传递与理解的过程，在管理中具有以下几方面的重要作用：\n（1）有效沟通可以降低管理的模糊性，提高管理的效能。\n（2）沟通是组织的凝聚剂和润滑剂。它可以改善组织内的工作关系，充分调动下属的积极性。\n（3）沟通是组织与外部环境之间建立联系的桥梁。","e":"口诀“降模糊、凝润滑、架桥梁”。","id":"mgmt-0359"},
{"ch":11,"t":"short","q":"简答：简述影响有效沟通的障碍及克服方法","a":"（1）影响有效沟通的障碍包括三大类：\n①人际障碍：表达能力、知识和经验差异、个性和人际关系、情绪、选择性知觉、信息过滤、信息过载。\n②组织障碍：组织结构不合理、组织氛围不和谐。\n③文化障碍：不同文化在自我意识、语言、价值观、信仰、思维方式等方面的差异。\n（2）克服沟通障碍的方法：\n①学会倾听；②重视反馈；③克服认知差异；④抑制情绪化反应；⑤缩短信息传递链、拓宽沟通渠道。","e":"障碍三大类＋克服五方法。","id":"mgmt-0360"},
{"ch":11,"t":"short","q":"简答：简述冲突管理的方法（抑制与激发）","a":"（1）冲突的抑制——托马斯五种策略：\n①竞争策略：又称强制策略，是一种“我赢你输”的策略。\n②合作策略：尽可能满足双方利益，代表双赢局面。\n③回避策略：既不合作又不坚持己见。\n④迁就策略：又称克制策略。\n⑤妥协策略：实质上是一种交易。\n（2）冲突的激发（当组织冲突不足时）：\n①将冲突合法化；②适度引入外部的新鲜血液；③通过组织结构的安排来激发冲突。","e":"五策略口诀“竞合回迁妥”。","id":"mgmt-0361"},
{"ch":12,"t":"multi","q":"按照控制力（控制实施主体）的来源，控制可分为（　　）","o":["正式组织控制","群体控制","自我控制","现场控制"],"a":[0,1,2],"e":"正式组织控制（制度、规章、审计）、群体控制（群体规范、群体压力）、自我控制（个人自觉）；现场控制是按进程分类。","id":"mgmt-0362"},
{"ch":12,"t":"judge","q":"按照控制方式的不同，控制可以分为集中控制、分散控制和分层控制三种类型。","a":true,"e":"教材对控制的划分只有三种标准：按控制进程分为前馈控制、现场控制、反馈控制；按控制方式分为集中控制、分散控制、分层控制；按控制力来源分为组织控制、群体控制、自我控制。按控制方式划分的三种类型是：集中控制（建立一个控制中心，统一收集、存储和加工信息并发出指令）、分散控制（把控制中心的职能分散成相对独立的控制子系统，各控一定范围的对象及活动）、分层控制（集中控制与分散控制的结合形态，上层对下层进行指导性协调和控制）。","id":"mgmt-0363"},
{"ch":12,"t":"single","q":"控制工作的起点是（　　）","o":["衡量工作绩效","分析偏差产生的原因","确定标准","实施纠偏"],"a":2,"e":"确定控制标准是进行控制工作的起点。","id":"mgmt-0364"},
{"ch":12,"t":"single","q":"在工作活动正式开始前进行的控制是（　　）","o":["现场同步控制","前馈控制","反馈控制","同期控制"],"a":1,"e":"前馈控制又称事前控制或预先控制。","id":"mgmt-0365"},
{"ch":12,"t":"single","q":"在工作进行过程中实施的控制是（　　）","o":["现场控制","事前的预先控制","反馈控制","事后控制"],"a":0,"e":"现场控制也称为事中控制、同步控制或同期控制。","id":"mgmt-0366"},
{"ch":12,"t":"single","q":"反馈控制又称为（　　）","o":["事前的预先控制","事中控制","同步控制","事后控制"],"a":3,"e":"反馈控制又称为事后控制。","id":"mgmt-0367"},
{"ch":12,"t":"single","q":"下列不属于控制原则的是（　　）","o":["有效标准原则","控制关键点原则","控制趋势原则","平均用力原则"],"a":3,"e":"有效控制的原则包括：有效标准原则、控制关键点原则、控制趋势原则、直接控制原则、例外原则。","id":"mgmt-0368"},
{"ch":12,"t":"judge","q":"有效的控制应遵循有效标准原则、控制关键点原则、控制趋势原则、统一指挥原则和例外原则。","a":false,"e":"控制的原则是有效标准原则、控制关键点原则、控制趋势原则、直接控制原则和例外原则，口诀“标—点—势—直—例”。统一指挥原则是法约尔提出的一般管理原则（属组织管理原则），不是控制原则。","id":"mgmt-0369"},
{"ch":12,"t":"multi","q":"控制过程的三步骤包括（　　）","o":["确定标准","衡量绩效","分析与纠偏","制定计划"],"a":[0,1,2],"e":"控制过程三步骤：确定标准、衡量绩效、分析与纠偏。","id":"mgmt-0370"},
{"ch":12,"t":"multi","q":"偏差产生的原因包括（　　）","o":["计划指标或工作标准制定得不科学，脱离实际","组织外部环境发生了没有预料到的变化","组织内部因素的变化，如工作方法不当、组织不力、领导无方","员工个人家庭原因"],"a":[0,1,2],"e":"偏差三原因：标准不科学、外部环境未预料变化、内部因素变化。","id":"mgmt-0371"},
{"ch":12,"t":"judge","q":"前馈控制是在工作结束之后进行的控制。","a":false,"e":"前馈控制是在工作活动正式开始前进行的控制。","id":"mgmt-0372"},
{"ch":12,"t":"judge","q":"控制的起点是衡量绩效。","a":false,"e":"控制的起点是确定标准。","id":"mgmt-0373"},
{"ch":12,"t":"judge","q":"控制工作是所有管理人员的职责，而绝不仅仅是组织中高层管理者的责任。","a":true,"e":"各级管理人员都承担着完成计划的责任，所以控制工作是所有管理人员的职责。","id":"mgmt-0374"},
{"ch":12,"t":"judge","q":"反馈控制的主要弊端是在矫正措施实施之前，偏差或损失已经产生。","a":true,"e":"反馈控制的主要弊端是：在矫正措施实施之前，偏差或损失已经产生。","id":"mgmt-0375"},
{"ch":12,"t":"term","q":"名词解释：控制","a":"控制是指对组织内部的管理活动及其效果进行衡量和矫正，以确保组织的目标以及为此而拟定的计划得以实现。","e":"关键词：衡量＋矫正＋保目标与计划实现。","id":"mgmt-0376"},
{"ch":12,"t":"term","q":"名词解释：前馈控制","a":"前馈控制又称事前控制或预先控制，是指组织在工作活动正式开始前对工作中可能产生的偏差进行预测和估计并采取防范措施，将可能的偏差消除于产生之前。","e":"优点：防患未然。缺点：需要及时准确信息。","id":"mgmt-0377"},
{"ch":12,"t":"term","q":"名词解释：反馈控制","a":"反馈控制又称为事后控制，是指在工作结束或行为发生之后进行的控制。反馈控制把注意力主要集中于工作或行为的结果上。","e":"作用四：免下次、消除后续影响、总结经验、供奖惩依据。","id":"mgmt-0378"},
{"ch":12,"t":"short","q":"简答：简述控制的必要性","a":"控制工作的必要性可以从以下几个方面进行分析：\n（1）适应组织环境的变化。环境的变化必然要求组织对原先制定的计划进行调整。\n（2）应对管理权力的分散。有效的控制系统可以向管理者适时提供下属的工作信息，防止下属滥用授权。\n（3）应对员工工作能力的差异。不同组织成员的认识能力和工作能力是有所差异的。","e":"必要性三＝环境、分权、能力。","id":"mgmt-0379"},
{"ch":12,"t":"short","q":"简答：简述控制的过程","a":"控制过程可以分为三个步骤：\n（1）确定标准：这是进行控制工作的起点。\n（2）衡量绩效：管理者应对由谁来衡量、衡量什么、如何衡量以及间隔多久衡量等方面做出合理安排。\n（3）分析与纠偏：将衡量结果与标准进行对比，确定有无偏差。纠偏措施包括修订标准和改善工作。","e":"口诀“确定标准—衡量绩效—分析与纠偏”。","id":"mgmt-0380"},
{"ch":12,"t":"short","q":"简答：简述前馈控制、现场控制和反馈控制的区别","a":"按照控制的进程不同，可以分为三种类型：\n（1）前馈控制（事前控制或预先控制）：在工作活动正式开始前对工作中可能产生的偏差进行预测和估计并采取防范措施。优点：防患于未然。缺点：需要及时和准确的信息。\n（2）现场控制（事中控制、同步控制或同期控制）：在某项工作或活动正在进行过程中所实施的控制。主要有监督和指导两项职能。\n（3）反馈控制（事后控制）：在工作结束或行为发生之后进行的控制。弊端：偏差或损失已经产生，只能亡羊补牢。","e":"口诀“前馈—现场—反馈”对应“事前—事中—事后”。","id":"mgmt-0381"},
{"ch":13,"t":"multi","q":"质量管理的发展大体经历的阶段有（　　）","o":["质量检查（检验）阶段","统计质量管理阶段","全面质量管理阶段","质量管理国际化阶段"],"a":[0,1,2],"e":"三阶段：事后质量检验→统计质量控制（控制图、抽样）→全面质量管理（TQM）；“国际化”不是独立发展阶段。","id":"mgmt-0382"},
{"ch":13,"t":"single","q":"大中型组织最基本的控制方法是（　　）","o":["市场控制","层级控制","团体控制","组织文化控制"],"a":1,"e":"层级控制是多数中型和大型组织最基本的控制方法。","id":"mgmt-0383"},
{"ch":13,"t":"single","q":"全面质量管理的基本要求是（　　）","o":["两全一多原则","四全一多","三全两多","三全一多"],"a":3,"e":"全面质量管理的基本要求是“三全一多”。","id":"mgmt-0384"},
{"ch":13,"t":"single","q":"平衡计分卡的四个维度中，处于核心地位的是（　　）","o":["财务维度","客户维度","内部管理维度","创新与学习维度"],"a":0,"e":"财务指标能够综合反映企业的经营绩效，是平衡计分卡所有层面的目标和指标的核心。","id":"mgmt-0385"},
{"ch":13,"t":"single","q":"团体控制的基础是（　　）","o":["组织文化","市场价格机制","规章制度","层级权力"],"a":0,"e":"组织文化是团体控制的基础。","id":"mgmt-0386"},
{"ch":13,"t":"single","q":"平衡计分卡是由谁提出的（　　）","o":["彼得·德鲁克","爱德华兹·戴明","卡普兰和诺顿","迈克尔·波特"],"a":2,"e":"平衡计分卡是卡普兰和诺顿于20世纪90年代提出的。","id":"mgmt-0387"},
{"ch":13,"t":"multi","q":"层级控制的方法包括（　　）","o":["预算控制","审计控制","财务控制","市场控制"],"a":[0,1,2],"e":"常见的层级控制方法有预算控制、审计控制和财务控制。","id":"mgmt-0388"},
{"ch":13,"t":"multi","q":"平衡计分卡的四个维度包括（　　）","o":["财务维度","社会责任维度","客户维度","内部管理维度"],"a":[0,2,3],"e":"平衡计分卡的四个维度是财务维度、客户维度、内部管理维度和创新与学习维度。社会责任维度不属于平衡计分卡的四个维度：平衡计分卡虽然考虑了客户这一外部因素，但基本上只反映企业内部运营质量，缺乏对环境（E）、社会责任（S）和公司治理（G）的全面考虑，目标基本上还是股东价值最大化；ESG评价体系正是对这一局限的补充。","id":"mgmt-0389"},
{"ch":13,"t":"multi","q":"管理控制的信息技术包括（　　）","o":["业务处理系统（EDPS/TPS）","管理信息系统（MIS）","决策支持系统（DSS）","办公自动化系统（OAS）"],"a":[0,1,2],"e":"现代管理控制的信息技术可以划分为相互联系的三个层级：业务处理系统、管理信息系统、决策支持系统。","id":"mgmt-0390"},
{"ch":13,"t":"judge","q":"管理控制信息技术的发展趋势包括自动化、数字化、智能化、规模化和生态化。","a":false,"e":"管理控制信息技术的发展趋势是日益强大的自动化、日益全面的数字化、日益高级的智能化、日益广泛的社交化和日益和谐的生态化（“五化”）。自动化指机器人替代基层工作、RPA在管控层嵌入规则；数字化指业务层应用数字孪生、虚拟现实技术，管理层推进流程标准化数字化；智能化指知识图谱、人工智能、机器学习构建决策模型，生成式AI展示革命性前景；社交化指与客户实现社交化连接，实现生产和消费同步化；生态化指超越组织边界、与供应商和客户系统集成，区块链等前沿技术构建跨边界控制模式。第二版已删除“柔性作业系统”，五大趋势中不含“规模化”。","id":"mgmt-0391"},
{"ch":13,"t":"judge","q":"层级控制是多数小型组织最基本的控制方法。","a":false,"e":"层级控制是多数中型和大型组织最基本的控制方法。","id":"mgmt-0392"},
{"ch":13,"t":"judge","q":"速动比率用以反映企业流动资产中可以立即用于偿付短期负债的能力。","a":true,"e":"速动比率用以反映企业流动资产中可以立即用于偿付短期负债的能力。","id":"mgmt-0393"},
{"ch":13,"t":"judge","q":"全面质量管理的基本要求是“三全一多”。","a":true,"e":"“三全一多”即全过程的质量管理、全员的质量管理、全组织的质量管理和多方法的质量管理。","id":"mgmt-0394"},
{"ch":13,"t":"judge","q":"团体控制的基础是规章制度。","a":false,"e":"团体控制的基础是组织文化。","id":"mgmt-0395"},
{"ch":13,"t":"term","q":"名词解释：预算控制","a":"预算控制就是根据预算规定的收入与支出标准来检查和监督各个部门的生产经营活动，以保证各种活动或各个部门在充分达成既定目标、实现利润的过程中对经营资源进行有效利用，从而使成本费用支出受到严格有效的约束。","e":"编制预算就是控制工作的第一步——拟定标准。","id":"mgmt-0396"},
{"ch":13,"t":"term","q":"名词解释：市场控制","a":"市场控制是指组织借助经济的力量，通过价格机制来规范组织内部门（单位）和员工的行为。其核心是通过构建组织内部的市场关系，激发员工在经济利益方面的追求，形成自发的动力。","e":"三个层次：企业层次、部门层次、个人层次。","id":"mgmt-0397"},
{"ch":13,"t":"term","q":"名词解释：团体控制","a":"团体控制是指将个体融入团体之中，使个人的价值观与组织的价值观和目标相统一，通过团体的共同行为范式来实现组织成员的自我约束和自我控制。","e":"团体控制主要依靠组织文化手段来控制员工的行为。","id":"mgmt-0398"},
{"ch":13,"t":"term","q":"名词解释：全面质量管理","a":"全面质量管理是指一个组织以质量为中心，以全员参与为基础，目的在于通过让顾客满意和本组织所有者、员工、供方、合作伙伴或社会等利益相关者受益而达到长期成功的一种管理途径。","e":"三全一多＝全过程、全员、全组织、多方法。","id":"mgmt-0399"},
{"ch":13,"t":"short","q":"简答：简述预算控制的含义及局限性","a":"（1）预算控制就是根据预算规定的收入与支出标准来检查和监督各个部门的生产经营活动，以保证各种活动或各个部门在充分达成既定目标、实现利润的过程中对经营资源进行有效利用。\n（2）局限性：\n①预算只能帮助企业控制那些可以计量的业务活动；\n②编制预算时通常参照上期的预算项目和标准，可能出现对本期活动的实际需要估计不足；\n③组织的外部环境是不断变化的，这些变化可能在编制时很难预测，从而使预算变得不合时宜。","e":"三大局限＋对策（零基预算法）。","id":"mgmt-0400"},
{"ch":13,"t":"short","q":"简答：简述全面质量管理的基本要求","a":"全面质量管理（TQM）是指一个组织以质量为中心，以全员参与为基础，目的在于通过让顾客满意和本组织所有者、员工、供方、合作伙伴或社会等利益相关者受益而达到长期成功的一种管理途径。其基本要求是“三全一多”：\n（1）全过程的质量管理：必须把影响质量的所有环节和因素都控制起来。\n（2）全员的质量管理：质量控制要扩展到组织的所有人员。\n（3）全组织的质量管理：从组织的纵、横两方面来保证质量的不断提升。\n（4）多方法的质量管理：应用一切可以运用的方法。","e":"口诀“三全一多”。","id":"mgmt-0401"},
{"ch":13,"t":"short","q":"简答：简述平衡计分卡及其四个维度","a":"平衡计分卡（BSC）是卡普兰和诺顿于20世纪90年代提出的一个从财务、客户、内部管理、创新与学习四个维度来设计和选择企业业绩评价指标的体系。\n（1）财务维度：财务指标能够综合反映企业的经营绩效，是平衡计分卡所有层面的目标和指标的核心。\n（2）客户维度：客户价值包括产品和服务、关系和形象，是企业战略的核心。\n（3）内部管理维度：内部管理流程是支撑企业运营和客户价值创造的保障。\n（4）创新与学习维度：是企业发展最根本的决定因素，是平衡计分卡的基点。","e":"四个维度定位必记。","id":"mgmt-0402"},
{"ch":14,"t":"multi","q":"风险按不同标志可分为（　　）","o":["静态风险与动态风险","纯粹风险与投机风险","基本风险与特定风险","系统风险与非系统风险"],"a":[0,1,2],"e":"按性质（静态/动态）、有无获利可能（纯粹/投机）、作用范围（基本/特定）分类；纯粹风险只有损失机会，投机风险可能损失也可能获利。","id":"mgmt-0403"},
{"ch":14,"t":"judge","q":"危机预警系统一般由信息收集子系统、信息加工子系统、信息决策子系统和警报子系统构成。","a":true,"e":"危机预警系统由四个子系统构成，口诀“收加决警”。信息收集子系统的任务是对危机诱因和危机征兆等信息进行识别、观察和跟踪，确保信息的全面性、准确性和及时性；信息加工子系统完成所收集信息的整理、识别、分类和转化，评估可能发生的危机类型及危害程度；信息决策子系统根据加工结果决定是否发出警报及警报级别，建立各级警报的临界点并向警报子系统下达命令；警报子系统的功能是向危机管理领导小组成员和潜在受害者发出明确无误的警报。（“咨询（对策）子系统”不是教材所列的四个子系统之一）","id":"mgmt-0404"},
{"ch":14,"t":"short","q":"简答：简述风险管理成本与风险管理收益","a":"（1）风险管理成本：是组织为识别、衡量、处置风险所付出的各类资源，包括预防投入、管理人力、风险处置损失。\n（2）风险管理收益：降低风险事故发生概率、减少事故带来的损失，保障组织经营连续性，规避合规风险，维护组织声誉。\n（3）风险管理追求：成本小于风险带来的潜在损失，实现收益大于成本。","e":"风险管理不是不计成本消除全部风险，讲究成本-收益权衡。","id":"mgmt-0405"},
{"ch":14,"t":"single","q":"通过购买保险将风险转移给保险公司，这属于（　　）","o":["风险避免","风险分担","损失减低管理","风险保留"],"a":1,"e":"风险分担是指组织将自身可能遭受的风险或损失，有意识地通过正当、合法的手段，部分或全部转移给其他组织的风险处理方式。","id":"mgmt-0406"},
{"ch":14,"t":"single","q":"危机的首要特征是（　　）","o":["突发性","危害性","紧迫性","决策信息不充分"],"a":0,"e":"危机具有四个特征：突发性、危害性、紧迫性、决策信息不充分。","id":"mgmt-0407"},
{"ch":14,"t":"single","q":"“不要把鸡蛋放在一个篮子里”体现的是（　　）","o":["风险保留","风险避免","风险分散","风险损失分担"],"a":2,"e":"风险分散是指组织将面临的风险单位进行分割，划分为若干个较小而价值低的独立单位，并分散于不同的空间。","id":"mgmt-0408"},
{"ch":14,"t":"single","q":"通过绘制流程图来识别风险的方法是（　　）","o":["财务报表法","流程图法","现场调查法","情景分析法"],"a":1,"e":"流程图法是通过绘制业务流程图来识别各环节可能存在的风险。","id":"mgmt-0409"},
{"ch":14,"t":"single","q":"风险识别的方法不包括（　　）","o":["企业财务报表法","流程图法","现场调查法","头脑风暴法"],"a":3,"e":"风险识别方法包括财务报表法、流程图法、现场调查法、事故树法等。","id":"mgmt-0410"},
{"ch":14,"t":"multi","q":"风险控制的策略包括（　　）","o":["风险避免","损失减低管理","风险分担","风险分散"],"a":[0,1,2],"e":"风险控制的四种策略是风险避免、风险分担、损失减低管理和风险保留。风险分散不是独立的策略，而是“损失减低管理”中的具体做法：损失减低管理是指企业有意识地接受经营管理中存在的风险，通过对风险的分散以及风险损失的控制，化大风险为小风险。","id":"mgmt-0411"},
{"ch":14,"t":"multi","q":"风险管理的损失前目标包括（　　）","o":["经济目标","合法性目标","社会责任目标","生存目标"],"a":[0,1,2],"e":"损失前目标包括经济目标、合法性目标、社会责任目标。","id":"mgmt-0412"},
{"ch":14,"t":"judge","q":"有效的危机反应包括建立危机处理小组、启动应急预案或制定新的方案、隔离危机和及时发布真实信息。","a":true,"e":"危机反应的四项内容（口诀“组案离信”）：建立危机处理小组（危机管理的最高权力机构和协调机构，作为统一指挥中心有权调动组织资源、代表组织做出承诺和说明）；启动应急预案或制定新的方案；隔离危机（包括危害隔离即物理隔离与人员隔离）；及时发布真实信息（第二版由第一版的“获取更多信息”改为“及时发布真实信息”，以避免“谣言满天飞”和负面舆情）。注意“建立危机恢复小组”属于恢复管理阶段，不是危机反应的内容。","id":"mgmt-0413"},
{"ch":14,"t":"judge","q":"风险是危机的诱因，危机是风险积聚后的显性表现。","a":true,"e":"风险是危机的诱因，危机是风险积聚后的显性表现。","id":"mgmt-0414"},
{"ch":14,"t":"judge","q":"所有风险都会导致危机。","a":false,"e":"并非所有风险都会导致危机。","id":"mgmt-0415"},
{"ch":14,"t":"judge","q":"危机的发生毫无征兆，完全不可预测。","a":false,"e":"危机的发生虽然较为突然和出人意料，但并不是毫无征兆。","id":"mgmt-0416"},
{"ch":14,"t":"judge","q":"风险评估的定性分析方法的结果精准度高。","a":false,"e":"风险评估的定性分析方法的结果精准度不如定量分析方法。","id":"mgmt-0417"},
{"ch":14,"t":"term","q":"名词解释：风险","a":"风险是指发生对组织不利事件的不确定性，包括事件发生的可能性及后果的大小。","e":"分类：静态/动态风险、纯粹/投机风险、基本/特定风险。","id":"mgmt-0418"},
{"ch":14,"t":"term","q":"名词解释：风险管理","a":"风险管理是指组织通过对风险的识别、衡量和处理，力求以最小的经济代价为组织目标的实现提供安全保障的管理活动。","e":"目标分损失前和损失后。","id":"mgmt-0419"},
{"ch":14,"t":"term","q":"名词解释：危机","a":"危机是指突发的、严重影响组织的生存与发展的一种状态。危机具有突发性、危害性、紧迫性和决策信息不充分四个特征。","e":"四特征口诀“突发、危害、紧迫、信息不充分”。","id":"mgmt-0420"},
{"ch":14,"t":"term","q":"名词解释：风险识别","a":"风险识别是指组织通过对面临的各种风险进行系统分析和研究，找出组织可能面临的风险因素和风险事件的过程。风险识别是风险管理的第一步。","e":"风险管理第一步。","id":"mgmt-0421"},
{"ch":14,"t":"short","q":"简答：简述风险控制的策略","a":"依据风险处置方式的不同，组织控制风险的方法有如下几种：\n（1）风险避免：也称风险规避，是指在风险发生的可能性较大且影响程度较高的情况下，组织采取中止、放弃或调整等风险处理方式以避免风险损失的一种方法。\n（2）风险分担：是指组织将自身可能遭受的风险或损失，有意识地通过正当、合法的手段，部分或全部转移给其他组织的风险处理方式。\n（3）损失减低管理：是指企业有意识地接受经营管理中存在的风险，通过对风险的分散以及风险损失的控制，化大风险为小风险。\n（4）风险保留：是指面临风险的企业自己全部承担或部分承担风险事故造成的损失。","e":"四策略口诀“避免、分担、损失减低、保留”。","id":"mgmt-0422"},
{"ch":14,"t":"short","q":"简答：简述危机反应与恢复管理的主要内容","a":"（1）危机反应：\n①建立危机处理小组：危机管理的最高权力机构和协调机构。\n②启动应急预案或制定新的方案。\n③隔离危机：包括危害隔离（物理隔离）和人员隔离。\n④及时发布真实信息：避免形成负面舆情。\n（2）危机恢复管理：\n①建立危机恢复小组：使组织尽快从危机事件的影响中恢复过来。\n②获取危机处理信息：对受损情况展开客观公正评价。\n③制定并实施危机恢复计划。\n④危机评估与组织发展：总结经验教训，发掘危机中的机会，化危为机。","e":"危机反应四步＋恢复管理四步。","id":"mgmt-0423"},
{"ch":14,"t":"short","q":"简答：简述风险识别的方法","a":"风险识别的方法主要包括：\n（1）财务报表法：通过分析财务报表识别财务风险。\n（2）流程图法：通过绘制业务流程图识别各环节风险。\n（3）现场调查法：通过实地调查发现潜在风险。\n（4）事故树法：通过分析事故原因识别风险因素。\n（5）头脑风暴法：通过集体讨论识别风险。\n（6）德尔菲法：通过专家背靠背发表意见识别风险。","e":"口诀“报表、流程、调查、事故树、头脑风暴、德尔菲”。","id":"mgmt-0424"},
{"ch":15,"t":"judge","q":"推动组织创新的动因只来自组织外部环境的变化，与组织成员自身的成就欲和责任感无关。","a":false,"e":"创新动因＝外部拉动（市场需求、技术进步、竞争压力、制度变化）＋内部推动（组织内部危机或瓶颈、可预期的超额收益、组织成员的成就欲和责任感），内外动因共同作用，故本句错误。","id":"mgmt-0425"},
{"ch":15,"t":"single","q":"按创新的规模（范围和影响程度），管理创新可分为（　　）","o":["局部创新与整体创新","渐进创新与突破创新","自发创新与有组织创新","主动创新与被动创新"],"a":0,"e":"按规模/范围分局部创新与整体创新；按创新程度分渐进式与突破式；按组织程度分自发与有组织创新。","id":"mgmt-0426"},
{"ch":15,"t":"judge","q":"熊彼特提出的创新五种形式包括引入新产品、采用新的生产方法、开辟新市场、获取新的原材料来源和建立新的组织形式。","a":true,"e":"熊彼特在1912年出版的《经济发展理论》中提出，创新就是建立一种新的生产组合过程，具体包括新产品、新生产方法、新市场、新原材料供应来源、新组织形式五种形式。","id":"mgmt-0427"},
{"ch":15,"t":"single","q":"熊彼特认为，创新就是（　　）","o":["开发一个全新的区域销售市场","申请并获得一项技术发明专利","建立一种新的生产组合过程","发明一项领先世界的全新技术"],"a":2,"e":"熊彼特在1912年出版的《经济发展理论》中提出，创新就是建立一种新的生产组合过程。","id":"mgmt-0428"},
{"ch":15,"t":"single","q":"提出创新领导八环节的管理学家是（　　）","o":["德鲁克","科特","熊彼特","明茨伯格"],"a":1,"e":"管理学家约翰·科特提出创新领导包括八个环节。","id":"mgmt-0429"},
{"ch":15,"t":"single","q":"德鲁克把诱发企业创新的因素归纳为（　　）","o":["七种创新来源","五种不同的创新来源","六种不同的创新来源","八种不同的创新来源"],"a":0,"e":"美国学者德鲁克把诱发企业创新的因素归纳成七种不同的创新来源。","id":"mgmt-0430"},
{"ch":15,"t":"single","q":"创新是维持基础上的发展，而维持则是创新的（　　）","o":["创新追求的长远目标","对已有成果的根本否定","开展创新活动的前提条件","逻辑延续"],"a":3,"e":"创新是维持基础上的发展，而维持则是创新的逻辑延续。","id":"mgmt-0431"},
{"ch":15,"t":"multi","q":"按创新程度分类，管理创新可以分为（　　）","o":["渐进式创新","突破式创新","局部创新","整体创新"],"a":[0,1],"e":"按创新程度分类：渐进式创新与突破式创新。","id":"mgmt-0432"},
{"ch":15,"t":"multi","q":"德鲁克提出的创新来源包括（　　）","o":["意外的成功或失败、企业内外的不协调","过程改进的需要、产业和市场的改变","人口结构的变化","企业家个人的冒险精神与直觉"],"a":[0,1,2],"e":"七来源要背全。","id":"mgmt-0433"},
{"ch":15,"t":"judge","q":"创新是维持基础上的发展，维持是创新的逻辑延续。","a":true,"e":"创新是维持基础上的发展，而维持则是创新的逻辑延续。","id":"mgmt-0434"},
{"ch":15,"t":"judge","q":"熊彼特认为创新就是发明一项新技术。","a":false,"e":"熊彼特认为创新就是建立一种新的生产组合过程。","id":"mgmt-0435"},
{"ch":15,"t":"judge","q":"过度维持会导致组织的僵化和保守，过度创新会消耗大量的物力、财力资源。","a":true,"e":"过度维持会导致组织的僵化和保守；过度创新会消耗大量的物力、财力资源。","id":"mgmt-0436"},
{"ch":15,"t":"judge","q":"管理创新只包括管理职能活动的创新，不包括思维创新。","a":false,"e":"管理创新既表现为管理职能活动的创新，也包括影响管理职能活动的关键要素创新，特别是思维创新。","id":"mgmt-0437"},
{"ch":15,"t":"term","q":"名词解释：管理创新","a":"管理创新活动是相对于维持活动的另一类管理活动，它是在探究人类创新活动规律的基础上，改变管理活动的过程，是一种产生新的管理思想和新的管理行为的过程。","e":"关键词：相对于维持＋改变管理过程＋产生新管理思想和新管理行为。","id":"mgmt-0438"},
{"ch":15,"t":"term","q":"名词解释：熊彼特创新","a":"熊彼特在1912年出版的《经济发展理论》中提出，创新就是建立一种新的生产组合过程，即把一种从未有过的关于生产要素和生产条件的“新组合”引入生产体系。它包括五种基本形式。","e":"五种形式口诀“新产品、新生产方式、新市场、新供应来源、新组织形式”。","id":"mgmt-0439"},
{"ch":15,"t":"short","q":"简答：简述维持与创新的关系","a":"维持与创新作为管理的两个基本内容，对系统的生存发展都是非常重要的，二者相互联系、不可或缺：\n（1）创新是维持基础上的发展，维持是创新的逻辑延续。\n（2）维持是实现创新的成果，创新为更高层次的维持提供依托和框架。\n（3）二者在逻辑上表现为相互连接、互为延续的链条。\n（4）有效管理是实现维持与创新最优组合的管理。过度维持会导致组织的僵化和保守；过度创新会消耗大量的物力、财力资源。","e":"本章最高频论述题。","id":"mgmt-0440"},
{"ch":15,"t":"short","q":"简答：简述创新的来源（德鲁克七来源）","a":"美国学者德鲁克把诱发企业创新的因素归纳成七种不同的创新来源：\n（1）意外的成功或失败；\n（2）企业内外的不协调；\n（3）过程改进的需要；\n（4）产业和市场的改变；\n（5）人口结构的变化；\n（6）人们观念的改变；\n（7）新知识的产生。","e":"七来源口诀。","id":"mgmt-0441"},
{"ch":16,"t":"judge","q":"野中郁次郎提出的知识创新（转化）模式中，社会化是指从隐性知识到隐性知识的转化过程。","a":true,"e":"SECI四模式：社会化（隐性→隐性）、外在化（隐性→显性）、组合化（显性→显性）、内在化（显性→隐性），构成隐性知识与显性知识相互转化、螺旋上升的过程。","id":"mgmt-0442"},
{"ch":16,"t":"short","q":"简答：简述科特组织变革八步骤","a":"科特提出组织变革八大步骤：\n（1）建立紧迫感，剖析危机与机遇；\n（2）组建强有力变革领导联盟；\n（3）构建变革愿景；\n（4）向组织全员沟通变革愿景；\n（5）授权员工行动，扫清变革障碍；\n（6）创造短期可见的胜利成果；\n（7）巩固成果，持续推动变革；\n（8）将变革成果固化进组织文化。","e":"勒温三阶段侧重微观行为转变；科特八步骤侧重完整组织变革全流程，专升本简答高频考点。","id":"mgmt-0443"},
{"ch":16,"t":"single","q":"组织学习中，只修正行为，不改变原有心智模式的是（　　）","o":["单环学习","双环学习","适应性学习","创造性学习"],"a":0,"e":"单环学习：只改正行为，底层价值观不变；双环学习：反思、改变原有心智模式、底层假设。","id":"mgmt-0444"},
{"ch":16,"t":"multi","q":"组织学习类型包括（　　）","o":["单循环学习","双循环学习","再学习","团体学习"],"a":[0,1,2],"e":"单环学习：纠错不改底层逻辑；双环学习：质疑并改变底层假设。","id":"mgmt-0445"},
{"ch":16,"t":"judge","q":"双环学习仅仅改变行为，不改变内在的价值假设。","a":false,"e":"单环学习仅仅改变行为；双环学习反思、修改底层心智假设。","id":"mgmt-0446"},
{"ch":16,"t":"single","q":"勒温提出的组织变革三阶段是（　　）","o":["计划、执行、检查三个环节","创业、成长、成熟三个阶段","演化、适应、改造三条路径","解冻、转变、冻结"],"a":3,"e":"勒温最早提出了组织变革过程的三个阶段，即解冻、转变、冻结。","id":"mgmt-0447"},
{"ch":16,"t":"single","q":"组织变革的四条基本路径是（　　）","o":["解冻、转变、冻结、再冻结","演化、适应、改造、革命","渐进、突变、局部、整体","计划、组织、领导、控制"],"a":1,"e":"组织变革按其过程的方式可分成渐进式和突变式，由此可以划分为四条基本路径：演化、适应、改造和革命。","id":"mgmt-0448"},
{"ch":16,"t":"single","q":"知识创新四模式中，从隐性知识到显性知识的模式是（　　）","o":["社会化模式","组合化模式","外在化","内在化模式"],"a":2,"e":"野中郁次郎提出知识创新四种模式：社会化（隐性→隐性）、外在化（隐性→显性）、组合化（显性→显性）、内在化（显性→隐性）。","id":"mgmt-0449"},
{"ch":16,"t":"single","q":"提出学习型组织五项修炼的学者是（　　）","o":["克里斯·阿吉里斯","野中郁次郎","彼得·圣吉","詹姆斯·马奇"],"a":2,"e":"彼得·圣吉在《第五项修炼》中提出打造学习型组织的五项修炼。","id":"mgmt-0450"},
{"ch":16,"t":"single","q":"组织变革中，个人利益因素主要表现为（　　）","o":["人们的道德观念和职业操守","团队的心理压力和从众倾向","组织文化的遗传性与变异性","人们害怕失去原有的利益"],"a":3,"e":"个人利益因素：变革与创新意味着原有的组织结构被打破，工作流程将被重新设计，利益将被重新分配。","id":"mgmt-0451"},
{"ch":16,"t":"single","q":"组织结构创新中，减少管理层级、扩大管理幅度的趋势是（　　）","o":["扁平化","柔性化","无边界化","虚拟化"],"a":0,"e":"扁平化是指减少管理层级、扩大管理幅度，使组织结构更加精简高效。","id":"mgmt-0452"},
{"ch":16,"t":"single","q":"组织结构创新中，打破部门界限、增强组织灵活性的趋势是（　　）","o":["扁平化","柔性化","无边界化","虚拟化"],"a":1,"e":"柔性化是指组织结构具有更强的灵活性和适应性，能够快速响应环境变化。","id":"mgmt-0453"},
{"ch":16,"t":"single","q":"组织结构创新中，打破组织内外边界、实现资源共享的趋势是（　　）","o":["无边界化","扁平化趋势","柔性化趋势","虚拟化趋势"],"a":0,"e":"无边界化是指打破组织的横向、纵向和外部边界，保持组织的灵活性和有效运营。","id":"mgmt-0454"},
{"ch":16,"t":"multi","q":"组织变革的阻碍因素包括（　　）","o":["认知与心理因素","资源路径依赖因素","社会综合影响因素","技术因素"],"a":[0,1,2],"e":"三大类阻碍：认知与心理因素、资源路径依赖因素、社会综合影响因素。注意：第一版称\"社会与政治影响因素\"，第二版改为\"社会综合影响因素\"。","id":"mgmt-0455"},
{"ch":16,"t":"multi","q":"消除变革抵触的方法包括（　　）","o":["教育和沟通","参与和投入、提供便利和支持","协商以期一致、引导和说服、硬性实施","操纵和拉拢"],"a":[0,1,2],"e":"六方法。","id":"mgmt-0456"},
{"ch":16,"t":"judge","q":"野中郁次郎提出的知识创新四种模式中，内在化是指从显性知识到显性知识的转化。","a":false,"e":"内在化是显性知识到隐性知识的转化，与“干中学”紧密相连；从显性知识到显性知识的是组合化。","id":"mgmt-0457"},
{"ch":16,"t":"judge","q":"勒温提出的组织变革三阶段是解冻、转变、冻结。","a":true,"e":"勒温最早提出了组织变革过程的三个阶段，即解冻、转变、冻结。","id":"mgmt-0458"},
{"ch":16,"t":"judge","q":"组织学习的中断只有一种类型。","a":false,"e":"马奇和奥尔森提出了学习中断的四种类型。","id":"mgmt-0459"},
{"ch":16,"t":"judge","q":"学习型组织五项修炼中，系统思考是核心。","a":true,"e":"彼得·圣吉在《第五项修炼》中提出打造学习型组织的五项修炼，系统思考是核心。","id":"mgmt-0460"},
{"ch":16,"t":"judge","q":"组织文化具有遗传性强于变异性的特征，会过滤掉可能的变革选项。","a":true,"e":"组织文化的遗传性特征往往表现得更加突出。在企业变革过程中，组织文化会过滤掉可能的变革选项。","id":"mgmt-0461"},
{"ch":16,"t":"term","q":"名词解释：组织变革","a":"组织变革是指组织根据内外环境的变化，及时对组织中的要素进行结构性变革，以适应未来组织发展的要求。组织变革的基本目标是使组织整体、组织中的管理者和成员对外部环境的特点及其变化更具适应性。","e":"勒温三阶段：解冻、转变、冻结。四条路径：演化、适应、改造、革命。","id":"mgmt-0462"},
{"ch":16,"t":"term","q":"名词解释：学习型组织","a":"学习型组织是指培养出持续学习、适应和改变能力的组织。在学习型组织中，员工不断获取和分享新知识，并将这些知识应用于决策或工作。彼得·圣吉在《第五项修炼》中提出打造学习型组织的五项修炼：系统思考、自我超越、改善心智模式、建立共同愿景、团体学习。","e":"关键词：持续学习、适应改变、五项修炼。","id":"mgmt-0463"},
{"ch":16,"t":"term","q":"名词解释：组织动态能力","a":"组织的创新惯例就是组织有关创新规律的认知，它对组织创新活动有着启发和引导作用，它是组织创新艺术。因此，组织创新惯例是组织进行管理创新、应对环境变化的重要资源。这种资源也常常被学术界称为组织动态能力。","e":"关键词：组织创新惯例＋管理创新与应对环境变化的重要资源。","id":"mgmt-0464"},
{"ch":16,"t":"term","q":"名词解释：组织结构创新","a":"组织结构创新是指组织根据内外环境的变化，对组织结构进行重新设计和调整，以适应新的发展需要。组织结构创新的主要趋势包括扁平化、柔性化、无边界化和虚拟化。","e":"四趋势口诀“扁、柔、无、虚”。","id":"mgmt-0465"},
{"ch":16,"t":"short","q":"简答：简述组织变革的阻力及消除方法","a":"（1）组织中对变革与创新的抵触力来自复杂的系统因素，主要包括三大类：\n①认知与心理因素：缺乏了解、评价差异、认知惰性。\n②资源路径依赖因素：核心能力刚性、企业家行为选择的路径依赖性、组织文化的遗传性特征。\n③社会与政治影响因素：个人利益、道德的压力、团队心理压力。\n（2）消除变革抵触的六种方法：教育和沟通、参与和投入、提供便利和支持、协商以期一致、引导和说服、硬性实施。","e":"阻力三大类＋消除六方法。","id":"mgmt-0466"},
{"ch":16,"t":"short","q":"简答：简述知识创新的四种模式","a":"野中郁次郎提出，人类知识通过隐性知识和显性知识的社会交互作用进行创新和扩张。知识创新过程可以分成四种模式：\n（1）社会化——从隐性知识到隐性知识：是一个分享经验、创造隐性知识的过程。\n（2）外在化——从隐性知识到显性知识：隐性知识通过隐喻、类比、概念或模型的方式显性化，是一种最经典的知识创造过程。\n（3）组合化——从显性知识到显性知识：将概念系统化为整体知识的过程。\n（4）内在化——从显性知识到隐性知识：显性知识只有转化成隐性知识，才会有个人行动。内在化的过程和“干中学”紧密相连。\n组织知识创新的过程是一个连续的、自我升级的螺旋式运动过程。","e":"口诀“社会化（隐→隐）、外在化（隐→显）、组合化（显→显）、内在化（显→隐）”。","id":"mgmt-0467"},
{"ch":16,"t":"short","q":"简答：简述学习型组织的五项修炼","a":"彼得·圣吉在《第五项修炼》中提出，经过五个方面的修炼，管理者和员工会不断培养出全新的思维方式，从而使得组织转变成学习型组织：\n（1）系统思考：系统思考的关键在于具有系统的观点和动态的观点。这是五项修炼的核心。\n（2）自我超越：自我超越是一种愿景和实现愿景的过程。\n（3）改善心智模式：不断反思自己的心智模式和对他人的心智模式进行探寻。\n（4）建立共同的愿景：将个人的愿景整合成组织的共同愿景。\n（5）团体学习：发展组织成员整体合作与实现共同目标能力的过程。","e":"五项修炼口诀“系统思考、自我超越、改善心智模式、建立共同愿景、团体学习”。","id":"mgmt-0468"},
{"ch":16,"t":"short","q":"简答：简述组织结构创新的趋势","a":"组织结构创新的主要趋势包括：\n（1）扁平化：减少管理层级、扩大管理幅度，使组织结构更加精简高效，加快信息传递速度，提高决策效率。\n（2）柔性化：组织结构具有更强的灵活性和适应性，能够快速响应环境变化，采用临时性、跨职能的团队形式。\n（3）无边界化：打破组织的横向、纵向和外部边界，实现资源共享和协同创新。\n（4）虚拟化：借助信息技术，将不同地域、不同组织的资源整合起来，形成虚拟组织。","e":"四趋势口诀“扁、柔、无、虚”。","id":"mgmt-0469"},
{"ch":16,"t":"case","q":"某传统机械制造企业近年来订单持续下滑、技术装备老化，管理层决定实施数字化转型，引进智能生产线，推行数字化管理。然而变革推进困难重重：老员工担心智能设备上岗后自己会失去工作岗位，对新技术培训消极应付；中层管理者担心数字化使管理过程透明化、自身权力被削弱，对变革方案阳奉阴违；部分车间还流传着“公司要裁人”的传言，员工焦虑情绪蔓延，生产秩序受到影响。\n问题：","sub":[{"q":"（1）结合组织变革的阻力来源，分析该企业变革遭遇阻力的原因。（5分）","a":"①认知与心理因素：员工对数字化转型缺乏了解，产生认知惰性与评价差异，加上裁员传言，引发恐慌和抵触；②资源路径依赖因素：企业长期依赖传统生产模式和技术装备，形成核心能力刚性与路径依赖，变革的转换成本高；③社会与政治影响因素：老员工担心失去工作岗位、中层管理者担心权力被削弱，个人利益受损的预期导致抵制；团队心理压力在车间蔓延，使阻力进一步放大。（采分点：每类因素1.5分，结合案例展开共5分）"},{"q":"（2）运用勒温的组织变革三阶段理论，说明该企业应如何分阶段推进变革。（4分）","a":"①解冻：通过宣讲、培训打破员工原有认知，让全员认识到数字化转型的必要性和紧迫性，消除“变革与我无关”的心态，降低变革阻力；②转变（变革）：实施变革方案，合理安置与培训人员，及时沟通反馈，把新的行为方式和管理制度落实到位；③冻结（再冻结）：通过制度化和激励手段巩固变革成果，使新的生产方式和管理规范成为组织的新范式，防止旧行为回潮。（采分点：三阶段各1分，结合案例展开1分）"},{"q":"（3）针对不同群体的顾虑，提出消除变革阻力的具体措施。（4分）","a":"①对老员工：加强教育与沟通，承诺并落实转岗培训和岗位安置，缓解失业焦虑；②对中层管理者：让其参与变革方案设计，通过协商明确新的权责划分，把“削权”转化为“赋能”；③对全体员工：及时公开变革信息、辟谣止谣，提供便利和支持，对变革中表现突出者给予奖励；④对经沟通协商仍严重阻挠变革者，可采取必要的行政措施保证变革推进。（每点1分，言之有理酌情给分）"}],"e":"【答题思路】本题考察组织变革。第一问按“认知与心理—资源路径依赖—社会与政治”三类阻力逐条对应案例中老员工、中层管理者、传言等细节作答；第二问严格按勒温三阶段（解冻—转变—冻结）顺序展开；第三问必须“分对象”提措施（老员工/中层/全体），体现结合案例、区别对待，不能只默写教材条目。","id":"mgmt-0470"},
{"ch":17,"t":"single","q":"提出“后工业社会”概念、指出社会由商品生产转向服务和知识经济的学者是（　　）","o":["彼得·德鲁克","丹尼尔·贝尔","马克斯·韦伯","弗雷德里克·泰勒"],"a":1,"e":"丹尼尔·贝尔在《后工业社会的来临》中提出后工业社会概念，强调知识和信息成为核心资源，是理解数字化转型的理论起点。（了解即可，非重点）","id":"mgmt-0471"},
{"ch":17,"t":"single","q":"我国于（　　）年正式接入互联网","o":["1992年","1996年","1998年","1994"],"a":3,"e":"我国于1994年正式接入互联网。经过20多年的发展，我国网络基础和网络用户迅速增长，对社会经济文化产生了深远的影响。（了解即可，非重点）","id":"mgmt-0472"},
{"ch":17,"t":"single","q":"数字经济中，以（　　）为关键生产要素","o":["劳动力、资本和土地等传统生产要素","现代信息网络和通信技术","数字化的知识和信息","各类有形资产和物质资源"],"a":2,"e":"2016年G20杭州峰会通过的《二十国集团数字经济发展与合作倡议》指出，数字经济是指以使用数字化的知识和信息作为关键生产要素、以现代信息网络作为重要载体、以信息通信技术的有效使用作为效率提升和经济结构优化的重要推动力的一系列经济活动。（了解即可，非重点）","id":"mgmt-0473"},
{"ch":17,"t":"single","q":"“数字孪生”技术主要应用于（　　）","o":["生产制造过程的数字化模拟","企业财务报表的编制与经营分析","人力资源招聘与绩效考核管理","市场营销策划与品牌推广策略"],"a":0,"e":"数字孪生是指以数字化方式创建物理实体的虚拟模型，借助数据模拟物理实体在现实环境中的行为。在制造领域，数字孪生可以用于产品设计、生产制造、运维管理等环节。（了解即可，非重点）","id":"mgmt-0474"},
{"ch":17,"t":"single","q":"互联网广泛应用引发的管理革命，不包括（　　）","o":["企业财务管理方式的适应性变革","企业组织结构与形式的适应性变革","员工管理方式与激励机制的适应性变革","管理者决策方式与决策过程的适应性变革"],"a":0,"e":"互联网广泛应用引发的管理革命主要体现在三个方面：企业组织形式、员工管理方式和管理者决策方式。（了解即可，非重点）","id":"mgmt-0475"},
{"ch":17,"t":"single","q":"下列不属于数字经济范畴的是（　　）","o":["产业数字化与数字产业化","传统手工制造业","数字化治理与数据价值化","数字技术与实体经济的融合"],"a":1,"e":"数字经济包括数字产业化、产业数字化、数字化治理和数据价值化四个方面。传统手工制造业不属于数字经济范畴。（了解即可，非重点）","id":"mgmt-0476"},
