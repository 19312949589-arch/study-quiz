{"ch":17,"t":"term","q":"名词解释：数字经济","a":"2016年9月二十国集团领导人杭州峰会上中国推动制定的《二十国集团数字经济发展与合作倡议》指出：数字经济是指以使用数字化的知识和信息作为关键生产要素、以现代信息网络作为重要载体、以信息通信技术的有效使用作为效率提升和经济结构优化的重要推动力的一系列经济活动。","e":"三要素：数字化知识信息为关键生产要素、现代信息网络为重要载体、信息通信技术为推动力。（了解即可，非重点）","id":"mgmt-0487"},
{"ch":17,"t":"term","q":"名词解释：数字化转型","a":"数字化转型是指企业利用数字技术对业务流程、组织架构、商业模式等进行全面改造和升级，以提高运营效率、增强竞争能力、创造新价值的过程。对企业来说，数字化转型的基础是大数据的生成和工业互联网的广泛运用。","e":"基础：大数据＋工业互联网。（了解即可，非重点）","id":"mgmt-0488"},
{"ch":17,"t":"term","q":"名词解释：无边界组织","a":"无边界组织概念最早由杰克·韦尔奇提出。其基本内涵包括：在构建组织结构时，不是按照某种预先设定的结构来限定组织的横向、纵向和外部边界，而是力求打破和取消组织边界，以保持组织的灵活性和有效运营。无边界组织并不是一种真正意义上的组织结构，其实质是一种组织设计理念。","e":"三种边界：横向边界（专业分工和部门划分形成）、纵向边界（员工划归不同组织层次）、外部边界（与顾客供应商等的隔墙）。（了解即可，非重点）","id":"mgmt-0489"},
{"ch":17,"t":"short","q":"简答：简述互联网在商业领域的广泛应用","a":"互联网在商业领域的广泛应用主要体现在信息制造、信息传输和信息存储三个方面：\n（1）信息制造：信息制造的内容得到了丰富，主体范围得到了拓展，载体愈加丰富。\n（2）信息传输：得益于互联网的高速通信技术，信息传输可以做到光速传输，大幅度突破了空间限制，信息传输几近零成本。\n（3）信息存储：一方面，互联网信息存储具有时间上的广延性和空间上的广阔性；另一方面，互联网使得信息存储具有数据化和编码化的特征，可以通过电子计算机和网络方便地进行查阅和调用。\n互联网深刻地改变了信息制造、信息传输和信息存储的方式，进而对社会经济和生活产生了深远的影响。","e":"三方面口诀“制造、传输、存储”。（了解即可，非重点）","id":"mgmt-0490"},
{"ch":17,"t":"short","q":"简答：简述互联网广泛应用可能引发的管理革命","a":"互联网引领的信息革命在影响企业外部关系和内部组织活动的同时，对新时代的管理提出了新要求，企业在以下三个方面发生着适应性变革：\n（1）企业组织形式的适应性变革——无边界组织：包括超越规模边界、拓展地理边界、淡化水平边界、打通垂直边界，形成扁平化组织。\n（2）员工管理方式的适应性变革：①员工技能综合化；②员工自主行动空间扩大。\n（3）管理者决策方式的适应性变革：①信息爆炸使管理者面临更多的不确定性；②信息传播速度加快使决策节奏加快；③管理者更多地依赖直觉进行决策。","e":"三方面管理革命。（了解即可，非重点）","id":"mgmt-0491"},
{"ch":17,"t":"short","q":"简答：简述互联网对企业活动产生的影响","a":"互联网广泛应用对企业活动的影响主要体现在以下方面：\n（1）对企业与商业合作伙伴的关系：企业与供应商、客户、战略合作企业的关系更加紧密。\n（2）对企业与竞争厂家的关系：信息的高速流通使技术和制度的优势更容易被模仿和复制，企业必须发展不可复制的核心优势；高度公开的市场信息和透明的市场价格使市场更加接近完全竞争市场。\n（3）对企业内部活动组织：对企业组织而言，互联网的应用既是挑战，也是机会。企业需要提高自身管理创新能力，提高资源配置效率。","e":"三方面影响。（了解即可，非重点）","id":"mgmt-0492"},
{"ch":17,"t":"case","q":"某传统连锁超市面对电商平台的冲击，销售额连续三年下滑。公司决定推进数字化转型：引入大数据系统分析消费者购买行为，开展精准营销；利用工业互联网和智能供应链系统优化库存与物流配送；组织员工分批参加数字化技能培训，推行移动办公和线上订单处理。转型初期，部分老员工对新技术有畏难和抵触情绪，担心操作复杂学不会；中层管理者则担心数据透明化后自身权力被削弱，对新系统推广不够积极；个别门店甚至出现新旧系统并行、数据不一致的现象。\n问题：","sub":[{"q":"（1）依据所学知识，说明企业数字化转型的基础是什么？结合案例指出该公司的做法是否体现了这一基础。（4分）","a":"①数字化转型的基础是大数据的生成和工业互联网的广泛运用；②案例中该公司引入大数据系统分析消费者购买行为、利用工业互联网和智能供应链系统优化库存与物流配送，正是依托大数据与工业互联网开展数字化转型，符合数字化转型的基础要求。（采分点：基础2分、结合案例2分）"},{"q":"（2）从互联网引发管理革命的三方面（企业组织形式、员工管理方式、管理者决策方式），分析该公司需要推进哪些适应性变革。（5分）","a":"①企业组织形式：可借鉴无边界组织理念，打破部门与层级边界，形成以数据为核心、跨部门的扁平化协作结构，提高对市场的响应速度；②员工管理方式：推动员工技能综合化，通过分批培训使员工掌握数字化操作技能；扩大员工自主行动空间，实行数据驱动的弹性管理；③管理者决策方式：借助大数据辅助经营决策，减少经验主义；信息传播加快使决策节奏加快，管理者要善于在信息不完全条件下利用直觉果断决策。（采分点：三方面各1.5分，结合案例展开得5分）"},{"q":"（3）针对案例中的抵触与系统衔接问题，提出推进数字化转型的管理建议。（4分）","a":"①教育与沟通：宣传数字化转型的意义和前景，消除老员工的畏难情绪，及时公开转型进展；②参与与支持：让员工和中层管理者参与系统设计与流程优化，提供充分的培训和技术支持，帮助其尽快适应；③制度与文化：建立数字化导向的绩效评价与激励机制，对积极转型者予以奖励，培育拥抱变革的组织文化；④系统治理：统一数据标准，规范新旧系统的衔接与数据口径，解决“数据打架”问题。（每点1分，言之有理酌情给分）"}],"e":"【答题思路】本题考察互联网时代的管理变革。第一问直接答教材结论（大数据＋工业互联网）再回扣案例细节；第二问按“组织形式—员工管理方式—决策方式”三个层面逐一展开，每层都要落到案例中的具体做法（大数据分析、技能培训、移动办公等）；第三问结合案例中的“老员工畏难、中层担心权力、新旧系统数据不一致”分别给出对策。（了解即可，非重点）","id":"mgmt-0493"},
{"ch":0,"t":"term","q":"名词解释：逆全球化","a":"一些国家简单地将当前世界存在的问题以及本国出现的矛盾归咎于全球化，并在国际事务中推行单边主义、保护主义，试图以全球化所暴露出来的缺陷全盘否定全球化。近年来，个别国家泛化国家安全概念，限制对外投资，实施出口管制等\"逆全球化\"政策，严重冲击多边贸易体制。","e":"关键词：单边主义、保护主义、全盘否定全球化。（了解即可，非重点）","id":"mgmt-0494"},
{"ch":4,"t":"term","q":"名词解释：启发式决策","a":"启发式决策是指决策者在不确定情境下依据一些简单的策略或者经验法则做出决策。心理学家卡尼曼等人提炼出几种不同的启发式：熟悉性启发式、便利性启发式、锚定和调整启发式。启发式不是凭空的主观判断，人们往往是先认知环境并基于反馈信息开展学习，然后采用启发式方法来进行决策。","e":"三种启发式：熟悉性、便利性、锚定和调整。","id":"mgmt-0495"},
{"ch":4,"t":"term","q":"名词解释：前景理论","a":"前景理论由丹尼尔·卡内曼和阿莫斯·特沃斯基提出，从人的心理特质、行为特征揭示了影响选择行为的非理性心理因素。该理论揭示了人们喜欢获益，但他们更加厌恶损失。相同数额的获益或损失带来的感觉差异很大，损失造成的伤害比获益带来的快乐大得多。","e":"关键词：卡尼曼、特沃斯基、厌恶损失、参考点。","id":"mgmt-0496"},
{"ch":11,"t":"term","q":"名词解释：中国式沟通","a":"中国式沟通是在中华文化语境中形成的独特沟通模式，深受儒家文化及传统价值观的影响。其核心特征体现为\"以和为贵\"的价值取向、\"关系导向\"的交往原则和\"情境优先\"的表达方式，蕴含与西方直接式沟通形成鲜明对比的东方智慧。","e":"三特征：以和为贵、关系导向、情境优先。","id":"mgmt-0497"},
{"ch":13,"t":"term","q":"名词解释：平衡计分卡","a":"平衡计分卡（BSC）是卡普兰和诺顿于20世纪90年代提出的一个从财务、客户、内部管理、创新与学习四个维度来设计和选择企业业绩评价指标的体系。企业通过平衡计分卡衡量收入是否增长及效率是否提高两个财务指标来判断企业战略的成败，能够有效地兼顾短期绩效和长期绩效、短期发展与长期发展。","e":"四维度：财务、客户、内部管理、创新与学习。","id":"mgmt-0498"},
{"ch":15,"t":"term","q":"名词解释：管理范式","a":"管理范式就是在管理学研究和实践中能够被人们广泛接受、具有典型意义的理论架构或模式，是一种支配、引导人们如何思、如何行的世界观和信念。管理范式属于\"元管理学\"性质，是有关管理活动的一般法则和方法论。","e":"关键词：广泛接受、典型理论架构、元管理学。","id":"mgmt-0499"},
{"ch":1,"t":"term","q":"名词解释：数据治理","a":"数据治理包括元数据管理、数据标准管理、数据质量管理、生命周期管理、数据安全管理等。它是数据集成、存储和治理层的重要组成部分，确保数据的准确性、一致性和安全性。","e":"关键词：元数据、数据标准、数据质量、生命周期、数据安全。（了解即可，非重点）","id":"mgmt-0500"},
{"ch":1,"t":"term","q":"名词解释：数智化","a":"数字化和智能化的结合，就是数智化。如果说数字化主要是数据采集和分析，那么数智化更多是帮助决策，以大数据为基础，运用人工智能等相关技术，结合具体场景解决问题。数智化主要包括四层架构：基础数据、数据集成存储治理、智能技术、前端应用。","e":"关键词：数字化+智能化、四层架构。（了解即可，非重点）","id":"mgmt-0501"},
{"ch":13,"t":"term","q":"名词解释：循证决策","a":"循证决策是指有效决策建立在数据和信息分析基础上，必须广泛收集信息，用科学方法处理和分析数据与信息，做到以事实为依据、用数据说话。这是ISO9000:2015提出的质量管理七项原则之一。","e":"关键词：数据信息分析、以事实为依据、用数据说话。（了解即可，非重点）","id":"mgmt-0502"},
{"ch":14,"t":"term","q":"名词解释：风险地图绘制","a":"风险地图绘制是指将一个或多个风险的可能性及影响用图形来表示，从而为风险管理决策提供参考的一种方法。可以采用热图或流程图等形式定量或定性估计风险的可能性及影响。","e":"关键词：图形表示、可能性及影响、热图/流程图。","id":"mgmt-0503"},
{"ch":13,"t":"term","q":"名词解释：生态质量管理","a":"随着大数据、云计算、新一代互联网的快速发展，人工智能技术和数字工厂方兴未艾，质量管理越来越多地超越企业边界，扩展到整个生态系统。以苹果公司为核心的生态圈构建了包括富士康、歌尔在内的遍布全球的庞大经济体系，质量标准由核心企业主导、参与企业一体化协同控制，共生共荣。","e":"关键词：超越企业边界、生态系统、核心企业主导。（了解即可，非重点）","id":"mgmt-0504"},
{"ch":16,"t":"term","q":"名词解释：意义给赋","a":"意义给赋（sensegiving）关注\"特定的群体如何去影响其他人对于事件的理解\"。对变革的领导因此而成为构建意义和诠释意义的修辞过程，其工作重点在于何时或如何在各个层次上影响其他人对于特定组织现实的意义生成。","e":"关键词：影响他人理解、变革领导、意义生成。（了解即可，非重点）","id":"mgmt-0505"},
{"ch":15,"t":"term","q":"名词解释：创新思维","a":"创新思维就是产生新思想的思维活动。创新思维是以怀疑乃至否定为前提的；创新思维是收敛性思维与发散思维的有机统一。","e":"关键词：产生新思想、怀疑否定、收敛与发散统一。","id":"mgmt-0506"},
{"ch":16,"t":"term","q":"名词解释：组织学习","a":"阿吉里斯在《组织学习》中提出组织学习是\"组织成员发现并纠正组织应用理论中的错误，并将探索结果深深印入个人意象和组织的共享图式中\"。组织学习具有三个性质：组织学习过程就是组织创新过程；组织学习是组织成员共同知识建构过程；组织学习是一种实践活动。","e":"关键词：阿吉里斯、发现纠正错误、共享图式。","id":"mgmt-0507"},
{"ch":16,"t":"term","q":"名词解释：虚拟组织","a":"虚拟组织是指两个以上的独立实体，为迅速向市场提供产品和服务、在规定时间内结成的动态联盟。虚拟组织不具有法人资格，没有固定的组织层次和内部命令系统，是一种开放的组织结构。","e":"关键词：动态联盟、开放结构、无固定层级。","id":"mgmt-0508"},
{"ch":2,"t":"short","q":"简答：简述复合决策理论的主要内容","a":"西蒙认为，组织的决策是一个复合决策的过程，决策结果是由许多人参与的许多决策综合而成的。高层管理者的任务与其说是决策，不如说是组织决策、影响组织成员的决策，努力使每一个组织成员在做决策的时候不仅考虑个人的理性要求，还要考虑组织的理性要求。个人决策受到两个前提的影响：一是价值前提，什么该干，什么不该干，什么应该先干，什么可以稍后考虑；二是事实前提，决策可以利用的资源以及决策的环境呈现何种特点。要影响个人决策，就应该影响个人决策的价值前提和事实前提。","e":"核心：复合决策、价值前提、事实前提。","id":"mgmt-0509"},
{"ch":4,"t":"short","q":"简答：简述理性决策与决策科学化的关系","a":"绝对的理性决策做不到，但理性决策或者说强化决策工作的理性成分是决策科学化的重要路径和保障。西蒙有关决策理论的研究，包括程序化与非程序化决策、决策过程、有限理性等一系列成果有助于提升管理决策的科学性；数字技术的进步与广泛应用，如依据大数据进行决策等，有助于强化决策工作的理性成分。理性决策模式的要点包括：对重要性的关注程度大于紧迫性；决策者针对可供选择的每一方案及其可能出现的结果进行调查研究；比较备选方案的目的明确且客观；决策工作坚持基本的原则和程序。","e":"关键词：理性成分、决策科学化、大数据辅助。","id":"mgmt-0510"},
{"ch":4,"t":"short","q":"简答：简述启发式决策的三种类型","a":"启发式决策是指决策者在不确定情境下依据一些简单的策略或者经验法则做出决策。心理学家卡尼曼等人提炼出几种不同的启发式：（1）熟悉性启发式，在评价事物时，把要评价的事物和自己熟悉的事物进行比较，依据类似程度快速做出判断；（2）便利性启发式，通过可回忆的实例和联想的容易性来推测事件发生的可能性；（3）锚定和调整启发式，在没有把握的情况下，人们通常利用某个参照点和锚来降低模糊性，然后再通过一定的调整来做出决定。","e":"三种：熟悉性、便利性、锚定和调整。","id":"mgmt-0511"},
{"ch":11,"t":"short","q":"简答：简述中国式沟通的核心特征","a":"中国式沟通是在中华文化语境中形成的独特沟通模式，深受儒家文化及传统价值观的影响。其核心特征体现为：（1）\"以和为贵\"的价值取向，在表达意见时更倾向于委婉、含蓄，以避免直接冲突或破坏人际关系；（2）\"关系导向\"的交往原则，高度重视人际关系，认为信任的建立往往先于正式事务的处理，正式沟通前通常需要通过非正式沟通来建立情感联结；（3）\"情境优先\"的表达方式，大量信息传递依赖于上下文、语气、表情、关系背景等非语言线索，人们更倾向于\"意会而非言传\"。","e":"三特征：以和为贵、关系导向、情境优先。","id":"mgmt-0512"},
{"ch":13,"t":"short","q":"简答：简述全面均衡控制方法","a":"全面均衡控制方法以平衡计分卡为代表。平衡计分卡是卡普兰和诺顿于20世纪90年代提出的一个从财务、客户、内部管理、创新与学习四个维度来设计和选择企业业绩评价指标的体系。企业通过平衡计分卡衡量收入是否增长及效率是否提高两个财务指标来判断企业战略的成败，能够有效地兼顾短期绩效和长期绩效、短期发展与长期发展。平衡计分卡通过五个方面的平衡——财务与非财务、长期与短期、结果性与动因性、内部群体与外部群体、反馈与同期和前馈——避免了企业考核短期化、片面化、形式化。","e":"核心：平衡计分卡、五个平衡。","id":"mgmt-0513"},
{"ch":13,"t":"short","q":"简答：简述管理控制信息技术的发展趋势","a":"近年来，管理控制的信息技术加速迭代，发展日新月异，未来发展趋势主要有：（1）日益强大的自动化——机器人广泛应用，RPA在管控层嵌入规则；（2）日益全面的数字化——业务层应用数字孪生、虚拟现实技术，管理层进行流程标准化数字化建设；（3）日益高级的智能化——通过知识图谱、人工智能、机器学习构建管理决策模型，生成式AI展示革命性前景；（4）日益广泛的社交化——通过信息技术实现与客户的社交化连接，实现生产和消费的同步化；（5）日益和谐的生态化——超越组织边界，与供应商、客户和合作伙伴系统集成，应用区块链等前沿技术，构建跨边界管理控制模式。","e":"五趋势：自动化、数字化、智能化、社交化、生态化。","id":"mgmt-0514"},
{"ch":15,"t":"short","q":"简答：简述控制创新的主要内容","a":"控制创新是组织控制活动创新的总和，它包括控制技术和手段创新、控制目标和标准变革，也包括组织反馈机制与控制理念和思维的创新。控制创新表现最多的是控制技术和手段创新，特别是新的技术变革常常会给组织提供新的控制方法和技术。控制创新更需关注控制理念和思维的变革，这些变革会在根本上影响组织的控制目标和控制标准，创新组织的反馈机制。","e":"关键词：技术手段、目标标准、反馈机制、理念思维。","id":"mgmt-0515"},
{"ch":9,"t":"short","q":"简答：简述领导者标准的中国化时代化","a":"习近平新时代中国特色社会主义思想实现了马克思主义中国化时代化新的飞跃，也为领导者标准注入了新的内涵和要求。对于党政领导干部，习近平在2013年全国组织工作会议上提出了\"信念坚定、为民服务、勤政务实、敢于担当、清正廉洁\"的二十字好干部标准。对于国有企业领导人员，习近平在2016年全国国有企业党的建设工作会议上强调，国有企业领导人员必须做到对党忠诚、勇于创新、治企有方、兴企有为、清正廉洁。对于民营企业和民营企业家，习近平在2025年召开的民营企业座谈会上强调，广大民营企业和民营企业家要满怀创业和报国激情，不断提升理想境界，厚植家国情怀，富而思源、富而思进，弘扬企业家精神，专心致志做强做优做大企业，坚定做中国特色社会主义的建设者、中国式现代化的促进者。","e":"二十字好干部标准、国企领导人员标准、民营企业家标准。","id":"mgmt-0516"},
{"ch":9,"t":"short","q":"简答：简述变革型领导的四种方式","a":"巴斯指出变革型领导采用相互关联的四种方式：（1）理想化影响力：领导者被誉为榜样，受敬佩、尊重和信任；考虑追随者需要而非自身需要，分担风险，符合道德规范。（2）鼓舞性激励：清晰表达美好愿景，展示热情乐观，为工作提供意义和挑战，激发团队精神。（3）智力激发：质疑旧的假定、传统和信仰，激发创新创造，鼓励表达新想法和创造性解决方案。（4）个性化关怀：关注每个追随者的个人需求、能力和抱负，耐心倾听，通过建议、教育和指导促进其发展成长。变革型领导在有效性及追随者努力程度和满意度方面均优于交易型领导。","e":"四方式：理想化影响力、鼓舞性激励、智力激发、个性化关怀。","id":"mgmt-0517"},
{"ch":17,"t":"short","q":"简答：简述数字经济与数字化转型","a":"2016年G20杭州峰会《二十国集团数字经济发展与合作倡议》指出，数字经济是指以使用数字化的知识和信息作为关键生产要素、以现代信息网络作为重要载体、以信息通信技术的有效使用作为效率提升和经济结构优化的重要推动力的一系列经济活动。对企业来说，\"数字化转型\"的基础是\"大数据\"的生成和\"工业互联网\"的广泛运用。大数据不仅指企业外部反映经营环境特征和变化的巨量信息，也指企业内部对各种活动要素在空间分布和时间运动状况的巨量数字描述；工业互联网帮助实现不同终端间共时沟通，促成人与物及物与物的信息联结。","e":"数字经济三要素、数字化转型基础：大数据+工业互联网。（了解即可，非重点）","id":"mgmt-0518"},
{"ch":0,"t":"short","q":"论述：试述管理学的研究对象和研究体系，并说明在企业管理研究基础上抽象出的一般管理理论对其他组织管理是否具有指导意义。","a":"（1）研究对象：广义上包括个体活动与群体活动；一般组织与企业组织。历史演进选择工厂制度及企业组织作为管理学主要研究对象，因为企业管理实践丰富、案例众多。\n（2）研究体系：管理活动是由决策、组织、领导、控制所构成的循环往复、并通过不断创新而螺旋上升的过程。管理学理论主要表现为关于决策、组织、领导、控制、创新等管理活动一般规律的描述。\n（3）指导意义：在企业管理研究基础上抽象出的一般管理理论，对其他类型组织的管理具有普遍指导意义。因为对人的活动、对人的行为与关系的协调，是企业以及其他有组织群体活动管理的基本内容。","e":"来源：绪论一、二；课后思考题1。答题要点：研究对象（个体/群体、一般/企业）＋研究体系（决组领控创）＋理论的普遍指导意义。","id":"mgmt-0519"},
{"ch":1,"t":"short","q":"论述：如何理解管理的本质？它对我们管理实践活动有哪些启示？","a":"（1）管理定义：管理是为了有效地实现组织目标，由管理者利用专门知识、技术和方法对组织活动进行决策、组织、领导、控制并不断创新的过程。\n（2）管理本质：管理是对人或人的行为的管理，本质是对组织成员在活动中的行为进行协调。协调的前提是组织成员愿意接受协调，且行为具有可协调性；行为可预测性依赖规则。\n（3）科学性与艺术性：管理理论和管理工具可以是科学的，管理实践则明显表现出艺术性，需要根据环境、条件、对象艺术地运用科学理论和方法。\n（4）自然属性与社会属性：管理具有与资源、技术相关的自然属性，也有为管理主体利益服务的社会属性。\n（5）启示：既要学习一般管理规律，又要结合具体组织、环境、制度和文化灵活运用。","e":"来源：第一章第一节、第三节；课后思考题2。","id":"mgmt-0520"},
{"ch":1,"t":"short","q":"论述：试述管理的基本原理（人本原理、系统原理、效益原理、适度原理）的主要内容及其对管理实践的启示。","a":"（1）人本原理：人是组织的中心，也是管理的中心。要求既“为了人的管理”，也“依靠人的管理”；重视人的需要、民主决策、员工参与、人性化管理和人的全面发展。\n（2）系统原理：系统具有整体性、相关性、有序性、与外部环境互动性。管理要有整体观、层次观、开发观，统筹局部与整体、内部与外部、目前与未来。\n（3）效益原理：效益是组织目标实现与实现目标所付代价之间的比例关系。追求效益要“做正确的事”，并“用正确的方法做正确的事”。\n（4）适度原理：管理中存在专业化与多元化、管理幅度宽窄、集权与分权等矛盾，一方的优点常是另一方的局限，必须在两个极端之间寻求适度组合。","e":"来源：第一章第二节；课后思考题3。口诀“人系效适”。","id":"mgmt-0521"},
{"ch":1,"t":"short","q":"论述：试述管理的基本方法与基本工具，并说明它们的作用。","a":"（1）基本方法：①理性分析，以定量方法和严密逻辑思维为基础；②直觉判断，以经验、快速逻辑思维为基础，在时间敏感、环境复杂时作用重要。\n（2）基本工具：①权力，包括正式职位权力和非正式个人影响力，描述组织中的命令—服从或影响关系；②组织文化，核心是组织成员普遍认同、共同遵循的价值观及行为准则，是内化于成员的管理工具。\n（3）作用：管理本质是规范和协调人的行为，权力可直接规范、追踪和控制成员行为，组织文化可低成本、持续、普遍地引导成员在不同时空的行为选择。","e":"来源：第一章第二节；课后思考题4。","id":"mgmt-0522"},
{"ch":2,"t":"short","q":"论述：评述泰勒科学管理的基本思想，并分析其贡献与局限。","a":"（1）背景：适应生产力发展、企业规模扩大，以及资本对劳动实现完全控制的需要。\n（2）主要内容：①改进工作方法，进行动作与时间研究，制定标准作业方法和标准作业时间；②作业环境与条件标准化；③根据工作要求挑选和培训工人；④实行差别计件工资制；⑤计划职能与执行职能分开，设置计划部门；⑥实行职能工长制；⑦高层管理者实行例外管理。\n（3）贡献：将科学引入管理领域，创立一套具体管理方法，为管理理论系统形成奠定基础；促进管理职能独立化、专职化；推广后使生产效率提高2—3倍。\n（4）局限：把人视为经济人，忽视社会心理因素；研究范围主要限于生产现场和内部，对外部环境考虑较少；过度强调标准化和严格控制，可能抑制工人主动性。","e":"来源：第二章第一节；课后思考题1。","id":"mgmt-0523"},
{"ch":2,"t":"short","q":"论述：评述法约尔一般管理理论的主要思想。","a":"（1）经营与管理：经营包括技术、商业、财务、安全、会计、管理六种职能；管理只是经营的一部分，由计划、组织、指挥、协调、控制构成。\n（2）管理的14条原则：劳动分工、权力和责任、纪律、统一指挥、统一领导、个人利益服从整体利益、人员报酬、集中、等级制度、秩序、公平、人员稳定、首创精神、人员团结。\n（3）管理要素：计划、组织、指挥、协调、控制。\n（4）评价：法约尔系统总结了管理原则和管理要素，构建了管理研究基本框架，内容系统、逻辑严密，对管理普遍性有深刻认识；孔茨称其为现代管理理论的真正奠基人。其原则灵活，应用是“尺度问题”，要求智慧、经验、判断和掌握尺度的能力。","e":"来源：第二章第一节；课后思考题2。","id":"mgmt-0524"},
{"ch":2,"t":"short","q":"论述：试评价韦伯组织理论在今天管理实践中的意义。","a":"（1）理想科层组织：通过公职或职位而非世袭或个人魅力进行管理。规则包括：活动作为正式职责分配给不同职务；稳定赋予职务相应权力并严格限制；任职需具备条件并证明。\n（2）权力类型：传统型权力、个人魅力型权力、法理型权力。只有法理型权力能成为科层组织基础，其特征是：为管理连续性奠基、合理性、可借助法律手段、权力有明确规定。\n（3）现代意义：层级制、规章制度、非人格化、专业化、按能力选拔，仍是现代大型组织的重要基础，有利于稳定、可预测和效率。\n（4）局限：可能产生官僚主义、僵化、形式主义，难以快速适应动态环境；过度强调规则可能抑制创新和主动性。","e":"来源：第二章第一节；课后思考题3。","id":"mgmt-0525"},
{"ch":2,"t":"short","q":"论述：试述巴纳德协作系统理论的主要内容，并评价其贡献。","a":"（1）组织是协作系统：组织是两个或两个以上的人有意识协调活动和效力的系统；个人是否参加组织活动取决于动机，管理人员通过改变个人动机影响行为。\n（2）协作系统三个基本要素：①协作的意愿，个人交出部分行为控制权；②共同的目标，是协作意愿的必要前提；③信息的沟通，使目标与意愿形成动态过程。\n（3）经理人员职能：①建立和维持一个信息系统；②从不同组织成员那里获得必要服务；③规定组织的共同目标，并用各部门具体目标加以阐明。\n（4）评价：从系统视角研究管理，强调人的因素、协作意愿、诱因—牺牲比较和信息沟通，为现代组织理论、系统管理思想奠定重要基础。","e":"来源：第二章第二节；课后思考题4、5。","id":"mgmt-0526"},
{"ch":2,"t":"short","q":"论述：评述西蒙决策理论的主要思想，并说明其对管理实践的启示。","a":"（1）管理就是决策：决策贯穿于管理各个方面和全部过程；组织是作为决策者的个人所组成的系统。\n（2）决策过程四阶段：情报活动、设计活动、抉择活动、审查活动。\n（3）决策准则：以“令人满意的”准则代替“最优化”准则。因为决策者受认识能力、时间、经费、情报来源限制，不可能具备完全理性前提。\n（4）程序化决策与非程序化决策：例行问题采用程序化决策；例外问题采用非程序化决策。\n（5）复合决策：个人决策受价值前提和事实前提影响。组织应通过组织文化、共同目标影响价值前提，通过信息提供和培训影响事实前提。\n（6）启示：管理要重视决策程序、信息收集、方案设计、满意准则、组织文化和培训，高层管理者要善于组织决策、影响他人决策。","e":"来源：第二章第二节；课后思考题5。","id":"mgmt-0527"},
{"ch":2,"t":"short","q":"论述：在组织理论中，组织协调机制主要有哪些形式？明茨伯格关于组织基本构成部分和组织结构形态的理论有何意义？","a":"（1）六种基本协调机制：①相互调适；②直接监督；③工作程序标准化；④成果标准化或产出标准化；⑤技术（技能）以及知识标准化；⑥规范标准化。它们随时间相继出现，空间上可能并存。\n（2）组织六个基本构成部分：工作核心层、战略高层、直线中层、技术官僚、支援幕僚、意识形态或文化。\n（3）组织结构七种基本形态：创业型组织、机械型组织、多角化组织、专业型组织、创新型组织、使命型组织、政治型组织。\n（4）意义：组织管理基本问题是分工和协调；协调机制随组织规模、复杂性变化而演变；组织结构是分工与协调方式的总和，不同部分组合形成不同结构形态。","e":"来源：第二章第二节；课后思考题6。","id":"mgmt-0528"},
{"ch":3,"t":"short","q":"论述：如何理解决策？决策有哪些基本特征？请描述决策制定过程并分析主要影响因素。","a":"（1）决策概念：为实现一定目标，在多个备选方案中选择一个方案的分析判断过程。狭义决策是在几种行动方案中做出选择；广义决策包括决策前的一切活动和实施追踪。\n（2）决策要素：决策主体、决策目标、决策方案、决策准则、不确定性情境。\n（3）决策类型：按环境可控程度分为确定型、风险型、不确定型；按问题分为程序化决策和非程序化决策；按主体分为个体决策和群体决策。\n（4）决策特征：目标性、可行性、动态性、整体性、创造性。\n（5）决策过程：识别问题、诊断原因、确定目标、制定备选方案、评价和选择方案、实施和监督。\n（6）影响因素：环境、组织的历史、决策者的特点、组织文化、商业伦理与社会责任。","e":"来源：第三章；课后思考题1、2、4。","id":"mgmt-0529"},
{"ch":4,"t":"short","q":"论述：环境分析有哪些主要方法？如何应用？","a":"（1）环境分类：一般环境、具体环境、内部环境。一般环境包括经济、技术、社会、政治法律、自然资源等；具体环境包括顾客、供应商、竞争者、管制机构、战略同盟伙伴等；内部环境包括物质环境和文化环境。\n（2）PEST分析：从政治与法律、经济、社会与文化、技术四方面分析一般环境。\n（3）五种力量模型：分析行业竞争者、供应商、买方、潜在进入者、替代产品生产者，判断行业竞争压力。\n（4）SWOT分析：把环境分析结果归纳为优势、劣势、机会、威胁，形成矩阵，帮助把握内外部环境动态关系。\n（5）脚本法（情景分析法）：针对环境变化，编制定量或定性脚本，形成多种环境情景，提高战略灵活性。\n（6）应用：不同方法针对不同环境层次，可结合使用，化繁为简，识别机会与威胁，为决策提供依据。","e":"来源：第四章第一节；课后思考题2。","id":"mgmt-0530"},
{"ch":4,"t":"short","q":"论述：如何理解有限理性？请用实例说明理性决策、非理性决策和行为决策，并说明如何克服理性限制。","a":"（1）理性决策：假设目标明确、信息完全、方案结果可量化、评估标准明确、决策者理性，选择价值最大化方案。\n（2）有限理性：决策者受知识、经验、能力、信息等限制，不能通盘考虑所有复杂因素，只能选择“令人满意的”方案。\n（3）行为决策：直觉决策基于经验、感受和判断力；前景理论揭示人们厌恶损失，面对获益时厌恶风险，面对损失时追逐风险。\n（4）克服理性限制：①重视决策者和决策权有效匹配，如权力下放、隐性知识显性化、重视专家；②组织民主决策，让更多人参与；③大数据辅助决策，生成更多方案、支持远程诊断、提供决策辅助、人机共同决策。\n（5）实例：企业投资决策中，完全理性要求掌握全部信息并求最优；现实中往往只能根据有限信息选择满意方案，并借助专家、民主讨论和大数据提高科学性。","e":"来源：第四章第二节；课后思考题3、4。","id":"mgmt-0531"},
{"ch":5,"t":"short","q":"论述：如何理解计划与决策的关系？计划有哪些类型和作用？请解析目标管理、PDCA循环和预算管理的内容及优缺点。","a":"（1）计划与决策：决策是计划的前提，计划是决策的逻辑延续；计划为决策所选择的活动和方案落实提供实施保证。\n（2）计划类型：战略计划、战术计划、作业计划；长期、中期、短期计划；综合计划、专业计划、项目计划。作用：管理者指挥的抓手、实施控制的标准、降低未来不确定性的手段、提高效率与效益的工具、激励人员士气的依据。\n（3）目标管理：德鲁克提出，鼓励成员参与目标制定，实行自我控制。特点：参与管理、重视成果、自我控制、系统目标体系。过程：目标制定与展开、目标实施、成果评价。优点：改善沟通、明确目标、提高满意度；缺点：目标难确定、易短期导向、目标停滞危险。\n（4）PDCA循环：计划、实施、检查、改进；大环套小环、上升式循环、综合性循环，关键是改进阶段。\n（5）预算管理：是计划思想体现、预测方法运用、控制手段。类型包括经营预算、投资预算、财务预算；刚性预算和弹性预算。零基预算法优点是科学、利于资金分配和控制支出，缺点是工作量大、费用高。","e":"来源：第五章；课后思考题1—5。","id":"mgmt-0532"},
{"ch":6,"t":"short","q":"论述：试述组织设计的影响因素和组织设计原则，比较机械式组织与有机式组织，并评述直线制、职能制、直线职能制、事业部制、矩阵制等组织结构形式的优缺点及适用条件。","a":"（1）影响因素：环境、战略、技术、规模、发展阶段。\n（2）组织设计原则：目标一致原则、分工与协作原则、有效管理幅度原则、权责对等原则、柔性经济原则。\n（3）机械式组织：高度专门化、僵化职务与权限、信息集中于高层、垂直命令、强调忠诚服从、强调固有知识；适用于环境稳定、任务明确、技术稳定、规模较大、以效率为目标的情况。\n（4）有机式组织：基于知识与经验专门化、柔性职务与权限、信息分散共享、水平沟通、忠诚于工作和技术、吸收外部智慧；适用于环境不确定、任务多样、技术复杂、需要创新、规模较小的情况。\n（5）直线制：设置简单、权责明确、运行有序；但专业化低、缺乏横向沟通、对管理人员要求高。适用于规模小、技术简单的组织。\n（6）职能制：专业化程度高、减轻管理人员压力、降低管理成本；但缺乏协调、职责不清、不利通才培养。\n（7）直线职能制：统一指挥与专业化管理结合、减轻管理者负担；但协调难度大、损害下属自主性、适应环境能力差、决策效率低、管理成本增加。适用于规模不大、产品种类不多、环境较稳定的中小型企业。\n（8）事业部制：集中决策、分散经营；利于高层专注战略、培养通才、提高环境适应能力；但机构重复、管理成本上升、易滋生本位主义。\n（9）矩阵制：机动性强、目标明确、人员结构合理、利于创新、沟通顺畅；但稳定性差、多头领导、权责不对等。适用于临时性、需多部门配合的项目。\n（10）演变趋势：扁平化、柔性化、无边界化、虚拟化。","e":"来源：第六章；课后思考题1—6。","id":"mgmt-0533"},
{"ch":8,"t":"short","q":"论述：试述组织文化的概念、特征、构成与功能，并说明组织文化塑造的途径及组织文化可能产生的反功能。","a":"（1）概念：组织文化是一个组织在长期实践活动中形成的具有本组织特征的文化现象，是组织全体成员共同接受和共同遵循的价值观念和行为准则。\n（2）特征：精神性、系统性、相对稳定性、融合继承性。\n（3）构成：物质层文化（表层）、制度层文化（中层）、精神层文化（核心）。精神层文化是组织文化的灵魂。\n（4）正功能：导向功能、凝聚功能、激励和约束功能、辐射功能、调适功能。\n（5）反功能：可能成为组织变革的障碍；可能成为组织有效决策的障碍；可能成为组织并购的障碍。\n（6）塑造途径：选择价值观，要体现社会核心价值观；强化认同；提炼定格；巩固完善。\n（7）影响因素：外部因素包括民族文化、制度文化、外来文化；内部因素包括领导者素质、组织成员素质、组织发展的不同阶段。","e":"来源：第八章；课后思考题。","id":"mgmt-0534"},
{"ch":12,"t":"case","q":"某食品加工企业近期产品抽检合格率波动较大，客户投诉明显增多。公司过去只在成品出厂前进行抽检，不合格产品往往在流入市场后才被发现，造成退货和品牌损失。管理层决定重新设计质量控制体系，加强从原料到售后全过程的管理。\n问题：","sub":[{"q":"（1）结合控制类型，分析该公司原有做法属于哪种控制？有何弊端？（4分）","a":"①原有做法属于反馈控制（事后控制），即在工作结束或行为发生之后进行的控制，把注意力集中于工作或行为的结果上。②弊端：反馈控制的主要弊端是在矫正措施实施之前，偏差或损失已经产生，只能“亡羊补牢”，无法预防不合格产品的产生，容易造成退货和品牌损失。（采分点：判断2分、弊端2分）"},{"q":"（2）请为该公司设计包含前馈控制、现场控制、反馈控制的完整质量控制体系。（5分）","a":"①前馈控制（事前控制）：在原料采购环节严格检验供应商资质和原料质量，制定原料验收标准，从源头防止不合格原料进入生产环节。②现场控制（事中控制）：在生产过程中进行实时监控，对关键工序设置质量控制点，实行首件检验、巡检和操作规范监督，及时发现并纠正偏差。③反馈控制（事后控制）：成品出厂前进行严格检验，建立售后质量追溯体系，对已流入市场的问题产品及时召回和处理，并分析原因、修订标准、改进工艺。（采分点：前馈控制2分、现场控制2分、反馈控制1分）"},{"q":"（3）结合全面质量管理“三全一多”，提出改进建议。（4分）","a":"①全过程的质量管理：把影响质量的所有环节和因素都控制起来，从市场调研、产品设计、原料采购、生产制造到售后服务全过程实施质量管理。②全员的质量管理：质量控制要扩展到组织的所有人员，加强质量意识培训，建立质量责任制。③全组织的质量管理：从组织的纵、横两方面保证质量不断提升，各部门协同配合。④多方法的质量管理：应用一切可以运用的方法，如统计质量控制、PDCA循环、六西格玛等。（每点1分）"}],"e":"【答题思路】本题考察控制类型与全面质量管理。第一问先判断属于反馈控制，再指出其“偏差已产生”的弊端；第二问按“事前—事中—事后”分别设计具体措施，要结合食品加工企业特点（原料、生产、成品、售后）；第三问直接套用“三全一多”并展开。","id":"mgmt-0535"},
{"ch":11,"t":"case","q":"某公司研发部与市场部长期存在矛盾：市场部抱怨研发部闭门造车，开发的产品不接地气、卖不动；研发部则抱怨市场部频繁更改需求，不尊重技术规律，导致项目反复返工。两部门例会上经常互相指责，项目进度严重延期。公司总经理意识到必须解决这一冲突。\n问题：","sub":[{"q":"（1）从组织冲突来源角度，分析两部门冲突的原因。（4分）","a":"①目标不相容：市场部追求快速响应市场需求、提高销量，研发部追求技术领先和产品稳定性，双方目标存在差异。②资源相对稀缺：两部门在预算、人员、时间等资源分配上存在竞争。③层级结构关系差异：两部门职能分工不同，考核标准不同，导致立场和视角差异。④信息沟通失误：双方缺乏有效沟通，市场部需求传达不清晰，研发部进展反馈不及时，加剧了误解和矛盾。（每点1分）"},{"q":"（2）若你是公司副总，会采用托马斯冲突处理策略中的哪一种？为什么？（5分）","a":"①应采用合作策略。②理由：合作策略是指尽可能满足双方利益，代表了冲突解决中的双赢局面。③市场部和研发部都是公司的重要部门，简单的竞争、回避、迁就、妥协都无法从根本上解决问题；合作策略能够促使双方坦诚沟通、共同寻找既满足市场需求又尊重技术规律的解决方案，有利于组织整体目标的实现。（采分点：策略2分、理由3分）"},{"q":"（3）结合沟通障碍与克服方法，提出改善两部门沟通的具体措施。（4分）","a":"①学会倾听：双方定期召开联席会，互相倾听对方诉求，避免先入为主。②重视反馈：建立需求确认和进度反馈机制，市场部需求变更需书面确认，研发部定期反馈开发进度。③克服认知差异：组织跨部门培训和岗位轮换，增进对彼此工作特点和难点的理解。④抑制情绪化反应：冲突时对事不对人，由中立领导协调。⑤缩短信息传递链：设立跨部门项目小组，指定联络人，拓宽沟通渠道。（每点1分，答出4点即可）"}],"e":"【答题思路】本题考察冲突管理与沟通。第一问按冲突来源四方面（目标、资源、结构、沟通）对应案例展开；第二问先明确合作策略，再说明双赢逻辑；第三问结合沟通障碍的克服方法，提出具体可操作的措施，切忌只背理论不结合案例。","id":"mgmt-0536"},
{"ch":8,"t":"case","q":"某老牌国有企业被一家民营企业并购后，新管理层推行“绩效导向、能上能下”的管理理念，打破原有的论资排辈和平均主义。但老员工习惯了按部就班、讲究资历，对新制度消极抵制；部分核心人才因不适应新文化而选择离职。并购后的企业文化整合面临严峻挑战。\n问题：","sub":[{"q":"（1）运用组织文化层次理论，分析双方冲突的根源。（4分）","a":"①组织文化由物质层、制度层和精神层构成，其中精神层是核心。②双方冲突的根源在于精神层文化冲突：老国企员工长期形成的“论资排辈、按部就班、平均主义”价值观，与新管理层倡导的“绩效导向、能上能下、竞争择优”价值观存在根本差异。③制度层文化冲突：原有规章制度与新推行的绩效考核、晋升制度不兼容。④物质层文化冲突：工作方式、行为习惯等方面的差异。（采分点：精神层2分、制度层1分、物质层1分）"},{"q":"（2）结合组织文化功能，说明文化冲突可能带来的反功能。（5分）","a":"①可能成为组织变革的障碍：老员工固守原有文化，抵制新制度推行，阻碍并购后的整合。②可能成为组织有效决策的障碍：文化冲突导致管理层与员工之间缺乏信任，信息沟通不畅，影响决策质量。③可能成为组织并购的障碍：文化整合失败是并购失败的重要原因之一，核心人才流失会削弱企业竞争力。④此外，文化冲突还可能导致凝聚力下降、员工士气低落、工作效率降低。（采分点：反功能每点1.5分，答出三点并结合案例得5分）"},{"q":"（3）如果你负责文化整合，请设计组织文化塑造的步骤。（4分）","a":"①选择价值观：在尊重原有文化合理成分的基础上，提炼融合双方优势的新价值观，明确“绩效导向与人文关怀并重”的导向。②强化认同：通过广泛宣传、树立典型、加强培训教育，使新价值观被员工接受。③提炼定格：精心分析、全面归纳、精练定格，形成新的组织文化体系。④巩固完善：建立奖优罚劣的规章制度，领导者率先垂范，使新文化落地生根。（每点1分）"}],"e":"【答题思路】本题考察组织文化。第一问从文化三层次（精神层、制度层、物质层）分析冲突根源，重点在精神层价值观冲突；第二问结合组织文化反功能（变革障碍、决策障碍、并购障碍）展开；第三问按组织文化塑造四步骤（选择价值观、强化认同、提炼定格、巩固完善）作答，并适当结合并购案例。","id":"mgmt-0537"},
{"ch":0,"t":"short","q":"论述：试述管理的基本原理、基本方法与基本工具，并说明三者之间的关系及其对管理实践的启示。","a":"（1）管理的基本原理是管理者在组织管理活动的实践中必须依循的基本规律，主要包括人本原理、系统原理、效益原理和适度原理。\n（2）人本原理：人是组织的中心，也是管理的中心，人本原理是管理的首要原理，包括“为了人的管理”和“依靠人的管理”两个方面。\n（3）系统原理：系统是由若干相互依存、相互作用的要素或子系统组合而成、具有特定功能的有机整体，具有整体性、相关性、有序性以及与外部环境的互动性四个特征。\n（4）效益原理：效益是组织目标的实现与实现组织目标所付代价之间的一种比例关系，管理必须追求以尽可能小的代价实现尽可能多的目标。\n（5）适度原理：管理活动中存在专业化与多元化、管理幅度宽与窄、集权与分权等相互矛盾的选择，管理者必须在两个极端之间找到最恰当的点，进行适度管理、实现适度组合。\n（6）基本方法：管理实践中要借助大量具体方法，抽象地看，这些方法或者以理性分析为基础，或者以直觉判断为依据，二者相互补充、不可偏废。\n（7）基本工具：管理者影响人的行为的手段主要有两类，一类与权力有关，另一类与组织文化有关；前者依靠职位职权，带有强制性与直接性，后者依靠价值认同，具有持久性与内化性。\n（8）三者关系：原理是“为什么这样做”的基本规律，方法是“怎样做”的途径，工具是“依靠什么去做”的手段；原理通过方法得以贯彻，方法借助工具才能落地，三者构成“原理—方法—工具”逐层递进的管理体系。\n（9）实践启示：管理者应坚持以人为中心、用系统观点统筹全局、以效益为衡量尺度、在矛盾两端寻求适度；同时把理性分析与直觉判断结合起来，做到“软硬兼施”，综合运用权力与组织文化两类工具，提高管理的科学性与艺术性。","e":"来源：绪论第三节“管理的基本原理、基本方法与基本工具”（勾画笔记★★★★★红笔考点：等式“四原理（人本、系统、效益、适度）＋两方法（理性分析、直觉判断）＋两工具（权力、组织文化）”）。答题提示：先总述“原理—方法—工具”三层次总纲，再逐一展开四原理（人本为首要、系统四特征、效益是比例关系、适度是找最恰当的点）、两方法、两工具，最后合述三者关系与实践启示；注意第二版只有四个原理，不含“责任原理”“伦理原理”，不要照背旧版五原理。","id":"mgmt-0538"},
{"ch":3,"t":"short","id":"mgmt-0539","q":"论述：如何理解决策与计划的关系？决策过程包含哪几个阶段？影响组织决策的主要因素有哪些？请结合实际加以说明。","a":"（1）决策与计划的关系。决策是选择组织未来活动的方向与目标；计划则是将决策选择的内容在时间和空间上展开，即组织的不同部门在未来的不同时期需要完成哪些任务以保证组织目标的达成。二者的关系可概括为：决策是计划的前提，计划是决策的逻辑延续；决策为计划的任务安排提供依据，计划则为决策所选择的活动与方案的落实提供实施保证。第二版教材把决策提升为管理的首要职能，决策确定“做什么”，计划解决“谁做、何时做、做到什么水平”。\n（2）决策的过程（六个阶段）。①识别问题：找出现状与预期结果的偏离，是决策过程的开始；②诊断原因：根据各种现象诊断问题产生的原因，可借助鱼骨图等工具分清主次；③确定目标：分析问题的各个构成要素，明确相互关系并确定重点；④制定备选方案：在约束条件下找出多个可行方案，本阶段创新因素的运用最重要，要避免因主观偏好接受第一个可行方案而中止；⑤评价和选择方案：从行动方案的可行性、有效性和满意程度、方案在组织中产生的结果三个方面评价，并采用统一客观的量化标准；⑥实施和监督：宣布决策并制定计划预算、沟通分配任务、激励培训人员、监督实施情况，实施决策比评价和选择方案更重要。决策实际上是一个“决策—实施—再决策—再实施”的连续循环过程。\n（3）影响决策的主要因素。①环境：环境是组织生存与发展的土壤，环境变化往往是导致组织变革决策最直接的原因；②组织的历史：过去活动的特点、过去决策的依据及其在实施中遇到的问题都会影响今天的选择；③决策者的特点：决策者的职能背景、风险意识和过往成败会影响决策；④组织文化：人们对待变革的态度根本上取决于组织文化的特点；⑤商业伦理与社会责任：决策要兼顾经济效益与社会效益。\n（4）结合实际（举例，考生可自行替换）。例如某建筑企业拟进入城市更新业务：先识别“传统房建订单下滑”这一问题并诊断原因是政策与需求结构变化，再确定“三年内新业务占比达30%”的目标，进而拟出自建团队、联合开发、收购标的等多个备选方案，经可行性、有效性与结果评价后择优，最后通过试点项目实施与监督；在此过程中，宏观政策环境、企业以往项目经验、决策者风险偏好与企业的稳健文化都直接影响了最终选择。","e":"来源：第三章第一节（决策与计划的关系）、第三节（决策过程六阶段）、第一节及章末（决策的影响因素）。答题提示：三个问题必须分三大块作答，“决策是计划的前提，计划是决策的逻辑延续”是关系部分的得分核心句；过程部分六阶段顺序不能颠倒，并注意点出“制定备选方案阶段创新最重要”“实施决策比评价选择更重要”两个易混点；影响因素部分要写全五条，最后用一例贯穿，切忌只背条目不结合实例。"},
{"ch":4,"t":"case","id":"mgmt-0540","q":"某饮用水企业长期在本省经营瓶装水，近三年销量增长乏力。企业调研发现：国家出台新的饮用水水源地保护条例，对水源开采提出更严格要求，企业的两处取水点需要整改；居民健康意识增强，低糖、无糖饮用水需求快速上升，但消费者对价格依然敏感；行业中已有两家全国性品牌通过并购地方水厂迅速扩张，新进入的小微水企则依靠社区团购低价抢占市场；同时，净水器、桶装水配送服务等替代品在家庭场景中分流了部分需求。企业内部的情况是：拥有本省稀缺的天然矿泉水水源和成熟的县域经销商网络，但品牌影响力弱、研发能力不足、资金有限。企业召开战略研讨会，形成三个备选方案：甲方案是投资1.2亿元自建高端矿泉水生产线并全面铺开省内市场；乙方案是投资3000万元与一家全国性品牌合资，借用其渠道与品牌，由对方控股；丙方案是投入800万元先改造现有两条生产线，开发两款无糖饮用水，在三个地级市试点后再决定是否扩大。据测算，在市场需求旺盛、一般、低迷三种状态下，三个方案的收益分别为：甲方案6000万元、2000万元、－3000万元；乙方案3000万元、2500万元、1000万元；丙方案2000万元、1800万元、600万元。\n问题：","sub":[{"q":"（1）请运用环境分析的相关理论，指出案例中哪些属于一般环境因素、哪些属于具体环境因素，并说明企业面临的主要机会与威胁。（6分）","a":"①一般环境因素（宏观、间接影响）：国家饮用水水源地保护条例的出台（政治法律环境）、居民健康意识增强带来的低糖无糖饮用水需求上升与价格敏感性（社会文化环境与经济环境）、净水器等替代产品与相关技术的发展（技术环境）。②具体环境因素（行业与任务环境、直接影响）：两家全国性品牌通过并购地方水厂扩张、新进入的小微水企以社区团购低价抢占市场（行业竞争者与潜在进入者）、消费者的需求变化与议价能力（顾客）、水源开采与整改要求（管制机构、供应商）。③主要机会：健康化、无糖化需求上升带来产品结构升级空间；企业拥有稀缺天然水源与成熟县域渠道。④主要威胁：水源保护条例带来整改成本与合规风险；全国性品牌并购扩张压缩生存空间；小微水企低价竞争分流市场；净水器等替代品分流家庭场景需求。（采分点：一般环境与具体环境各举两类因素以上各1分，共2分；机会2分；威胁2分，未结合案例材料只写理论最多得半分）"},{"q":"（2）请用SWOT分析框架对企业的内外部条件进行归纳，并指出其应选择的总体战略方向。（7分）","a":"①优势（S）：拥有本省稀缺的天然矿泉水水源，掌握优质资源；具备成熟的县域经销商网络，渠道下沉能力强。②劣势（W）：品牌影响力弱，难以支撑高端定位；研发能力不足，新产品开发受限；资金有限，抗风险能力弱。③机会（O）：居民健康意识增强，低糖无糖饮用水需求快速上升；行业仍处整合期，存在与强势品牌合作的可能。④威胁（T）：水源地保护条例趋严，两处取水点需要整改；全国性品牌并购扩张、小微水企低价竞争；净水器等替代产品分流需求。⑤战略方向：宜采取“扭转型（WO）与防御型（WT）相结合、以差异化聚焦为落脚点”的战略——借助外部健康化需求机会弥补研发与品牌劣势，优先开发无糖饮用水等细分产品；同时以合资或合作方式借助外部品牌与渠道规避资金不足与品牌弱势的威胁，避免在高端市场与全国性品牌正面硬拼。（采分点：S、W、O、T各1分共4分，每项至少两个要点且须来自案例；战略方向判断1分、理由2分）"},{"q":"（3）若三种市场状态出现的概率无法预知，可依据哪些不确定性决策准则在甲、乙、丙三方案中选择？请分别计算并说明结论；若企业委托你进一步论证，你还会建议使用什么方法，为什么？（7分）","a":"①乐观准则（大中取大）：各方案最大收益为6000、3000、2000，取最大者→选甲方案。②悲观准则（小中取大）：各方案最小收益为－3000、1000、600，取最大者→选乙方案。③等概率准则（假定三种状态概率各为1/3，选期望值最大者）：甲＝(6000＋2000－3000)/3≈1667万元；乙＝(3000＋2500＋1000)/3≈2167万元；丙＝(2000＋1800＋600)/3≈1467万元→选乙方案。④最小后悔准则（大中取小）：各状态下最大收益为6000、2500、1000，据此计算后悔值——甲为0、500、4000（最大后悔4000）；乙为3000、0、0（最大后悔3000）；丙为4000、700、400（最大后悔4000）→选最大后悔值最小的乙方案。⑤结论：除按乐观准则外，悲观准则、等概率准则与最小后悔准则均指向乙方案，说明乙方案稳健性最好；甲方案高收益伴随高亏损，风险最大。⑥进一步论证建议：一是采用决策树方法，把各方案、状态节点与概率枝画出，自右向左计算期望收益并剪枝选优，但需先通过市场调研、德尔菲法取得概率估计；二是对“需求旺盛”这一关键变量做敏感性分析，考察其概率与收益变动时方案优劣是否反转；三是可先用脚本法（情景分析法）推演多种未来情景，并结合风险评估方法（损失概率与损失程度估测、风险地图）检验方案的抗风险能力；四是必要时按满意准则而非最优准则做出选择，先小规模试点再逐步扩大。（采分点：四个准则的计算与结论各1分共4分，第5点结论1分，第6点答出决策树、敏感性分析、脚本法、风险评估等方法并说明理由得2分）"}],"e":"【答题思路】本题以饮用水企业的市场进入决策为背景，综合考查第四章的环境分析、SWOT分析与不确定性决策准则，是本章的“压轴案例”。第一问必须先明确一般环境（PEST＋自然资源）与具体环境（顾客、供应商、竞争者、管制机构、战略同盟伙伴）的区分标准，再从案例中一一提取因素，不能只写理论不点材料；第二问要严格按S、W、O、T四格归纳，并用“发挥优势、克服劣势、利用机会、规避威胁”的逻辑推出战略方向，注意优势与机会不能混淆（内部为优势劣势，外部为机会威胁）；第三问是不确定性决策的经典考法，四个准则必须写出计算过程而不只写结论，特别要核对最小后悔准则的后悔值矩阵；最后追问方法时要点明“决策树适用于风险型决策（有概率）”，而不确定性情境下应先设法获得概率估计，再辅以敏感性分析、脚本法和风险评估，体现决策的动态性与科学化要求。","a":"（参考答案见各小问）"},
{"ch":5,"t":"short","id":"mgmt-0541","q":"论述：如何理解计划与决策的关系？请说明计划的类型与作用，并结合实例解析滚动计划法、目标管理、PDCA循环和预算管理等推进计划的方法。","a":"（1）计划与决策的关系。决策是选择组织未来活动的方向与目标；计划是对组织在未来一段时间内的目标和实现目标途径的策划与安排，是把决策选择的内容在时间和空间上展开。决策是计划的前提，计划是决策的逻辑延续；计划为决策所选择的活动和方案落实提供实施保证。计划工作具有普遍性：一切有组织的活动，不论涉及范围大小、层次高低都要有计划，各级管理人员都要担负计划工作。\n（2）计划的类型。①按层次（对组织整体的影响程度）分为战略计划、战术计划和作业计划；②按期限分为长期计划、中期计划和短期计划；③按内容分为综合计划、专业计划和项目计划。从抽象到具体，计划还构成使命、目标、战略、政策、程序、规则、方案、预算的层次体系，其中预算是数字化的计划。\n（3）计划的作用（口诀“指、控、降、效、激”）：①管理者进行指挥的抓手；②管理者实施控制的标准；③降低未来不确定性的手段；④提高效率与效益的工具；⑤激励人员士气的依据。\n（4）滚动计划法。基本思想是“近具体、远概略”，即近期计划编制得详细具体，远期计划编制得概略，并随计划期推进逐期向前滚动、不断修正，从而保证长、中、短期计划相互衔接，增强计划的弹性和适应性。例如某施工企业编制五年计划，第一年细化到季度、月度工程量与资源投入，第二、三年只列主要节点目标，每年末根据实际完成情况修订并向后滚动一年。\n（5）目标管理。由德鲁克1954年在《管理的实践》中提出，又称成果管理，是鼓励组织成员参加目标制定、在工作中实行自我控制、自觉完成任务的管理方法。四个特点：实行参与管理；重视工作成果而不是工作行为本身；强调组织成员的自我控制；建立系统的目标体系。过程分三阶段九项工作：目标制定与展开（调查研究、目标展开、定责授权）、目标实施（咨询指导、跟踪检查、协调平衡）、成果评价（评价工作、实施奖惩、总结经验教训），三阶段构成循环。按其目标是否最终分解到个人，还可分为全分解式和半分解式目标管理。\n（6）PDCA循环。又叫戴明环，即计划（Plan）—执行（Do）—检查（Check）—处理（Action）四个阶段，特点是“大环套小环、上升式循环、综合性循环”，推动循环的关键是改进（A）阶段，即把成功经验标准化、把未解决的问题转入下一个循环，实现阶梯式上升。例如质量管理部门按月开展“制定改进计划—组织实施—检查效果—标准化或转入下轮”的闭环管理。\n（7）预算管理。预算是数字化的计划，预算管理既是计划思想的体现，又是预测方法的运用和控制手段。按业务内容分为经营预算、投资预算和财务预算；按编制方法分为刚性（固定）预算与弹性预算，以及零基预算法。零基预算法在每个预算年度开始时把所有还在继续开展的活动都看作从零开始，重新安排各项活动及各部门的资源分配和收支，其本质是一种控制思想；优点是科学、利于资金分配和控制支出，缺点是工作量大、费用较高。\n（8）小结：计划要面向未来，需要长短期结合；推进计划必须形成闭环，目标管理、PDCA循环与预算管理都是被证明有效的方法，并且要把目标与任务层层分解、广泛调动实施人员的积极性、不断检查评估、严格执行预算并突出效果。","e":"来源：第五章第一节（计划与决策的关系、计划的本质与特征、计划的类型与作用、计划编制方法）、第二节（目标管理、PDCA循环、预算管理）、章末内容概要。答题提示：“决策定方向、计划在时空上展开，计划是决策的逻辑延续”是关系部分的核心句；类型与作用必须写全并点出预算是数字化的计划；四种推进方法的解析都要“先写内涵与要点、再举一个具体实例”，只写条目不结合实例会大量失分；最后用“形成闭环、突出效果”收束，呼应教材内容概要。"},
{"ch":7,"t":"short","q":"论述：试述人员配备的原则，并说明这些原则在人员选聘、培训与考评工作中的具体体现。","a":"（1）人员配备是指对企业员工进行恰当而有效的选拔、培训和考评，其目的是配备合适的人员去充实组织机构中所规定的各项职务，以保证组织活动的正常进行，进而实现组织的既定目标。\n（2）任人唯贤原则：大公无私、实事求是地发现人才、爱护人才，重视和使用确有真才实学的人；其对立面是任人唯亲，选聘中应以能力和业绩为标准，不拘泥于内部或外部。\n（3）程序化、规范化原则：科学合理地确定人员的选拔标准和聘任程序，严格按照规定的程序和标准办事，通过公开竞聘、系统考评保证选聘的公正公平。\n（4）因事择人、因材器使原则：因事择人以岗位空缺和实际工作需要为出发点、以岗位对人员的实际要求为标准；因材器使则根据人的能力和素质不同去安排不同要求的工作，避免学非所用、大材小用或小材大用。\n（5）量才使用、用人所长原则：根据每个人的能力大小安排合适的岗位，用人时不求全责备，注重发挥人的长处；现实中不存在完全意义上的“通才”“全才”，有效的人员配备就是要发挥人的长处并尽量避免其短处。\n（6）动态平衡原则：组织处于动态环境之中，人与事的配合需要不断动态平衡，使能力发展充分的人去从事更重要的工作，使能力平平、不符合岗位需要的人得到识别与合理调整，最终实现人与岗位、工作的动态平衡。\n（7）在人员选聘中的体现：岗位空缺首先考虑从现有成员中调剂或考评提拔（内部选聘），确认内部无人胜任时再从社会选聘（外部选聘），并做到人员技能与岗位职责、人员个性与岗位特点、人员价值观与组织价值观三个匹配。\n（8）在培训与考评中的体现：根据组织的成员、技术、活动、环境等特点，有计划、有组织、有重点地开展岗前培训、在职培训和专题培训；考评内容围绕职业品德、工作态度、工作能力、工作业绩四要素，防止晕轮效应、近因效应、刻板效应、宽厚误差等主观误差，为动态平衡提供依据。","e":"来源：第七章第一节“人员配备的原则”（教材p168—169），五原则口诀“贤、规、事、量、衡”。答题提示：先定义再逐条展开五原则，每条写出“内涵＋反面表现”；后半问须落到人员选聘、培训、考评三节的具体做法上；结尾用“有效的人员配备就是要发挥人的长处，并尽量避免其短处”收束。","id":"mgmt-0542"},
{"ch":7,"t":"short","q":"论述：试述内部选聘与外部选聘的优缺点，并说明组织应如何选择人员选聘的途径。","a":"（1）内部选聘是从组织现有成员中调剂解决或按有关标准考评提拔。其优点：①可以提供激励因素和培养组织成员的忠诚度；②组织比较容易对选聘人员进行全面了解，所需培训较少，省时、省力、省资金；③被提升的组织成员熟悉工作环境，可以迅速适应新的工作岗位，实现人与事的更好结合。\n（2）内部选聘的缺点：①不利于引入新思想，容易“近亲繁殖”；②大量从内部提升可能导致人际关系复杂、人际矛盾加剧、经营思想保守、墨守成规，并由此产生不公正现象和庇护关系。\n（3）外部选聘是管理者通过对组织人事资料的检索，查明和确认在职人员中确实无人能够胜任和填补岗位空缺时，从社会中选聘人员。其优点：①能给组织带来新观念、新思想、新技术和新方法；②外来者与组织成员之间无裙带关系，能较客观地评价组织工作、洞察存在的问题；③在组织没有合适人才时，能聘用到已经受过训练的人员，外聘费用通常比培训一个内部成员便宜；④外聘人员使用较灵活，可签订短期或临时工作合同。\n（4）外部选聘的缺点：①有可能挫伤内部成员的工作积极性；②外聘者需要较长的调整时间来适应组织环境和工作；③管理职务上的外聘者可能照搬老经验来管理新组织，忽视经验与组织发展的有机结合。\n（5）内部选聘的主要途径与方法：内部成员的提升与岗位调动，其中常用的是职务选聘海报（工作公告法），此外还有口头传播、从组织人员记录中选择、以业绩为基础的晋升表等。\n（6）外部选聘的主要途径：职业介绍机构与人才交流市场、猎头公司（面向高级或特殊人才）、校园选聘、公开选聘；方法主要有招聘广告（报纸广告最常用）和网上招聘。\n（7）选择依据：如果组织内部管理制度有效、成员工作作风良好、组织不想改变目前状况，可运用内部选聘；如果组织内部管理效率低、风气不好、想要改变不良状况，则应考虑外部选聘，即判断的关键是组织是否需要变革，而不是岗位高低。\n（8）无论采取哪种途径，都应坚持任人唯贤和程序化、规范化原则，做到人员技能与岗位职责相匹配、人员个性与岗位特点相匹配、人员价值观与组织价值观相匹配，并注意人才梯队建设与动态平衡。","e":"来源：第七章第二节“人员选聘”（教材p170—178），内部选聘“三优两缺”、外部选聘“四优三缺”。答题提示：两两对照分列优缺点，不要遗漏外部选聘的前置条件“先确认内部无人胜任”；途径要与“人员来源”区分开，并用“是否需要变革”作为选择依据，可结合案例分析题作答。","id":"mgmt-0543"},
{"ch":8,"t":"short","q":"论述：试述组织文化的形成与发展受到哪些因素的影响，并结合组织文化塑造的步骤说明如何建设优秀的组织文化。","a":"（1）组织文化是一个组织在长期实践活动中形成的具有本组织特征的文化现象，是组织全体成员共同接受和共同遵循的价值观念和行为准则。\n（2）外部因素之民族文化：任何组织都处于一定的社会文化环境中，其文化形成必然受所在国家民族文化传统和价值体系的深刻影响，如美国强调能力主义、个人奋斗、竞争和效率，日本强调集体主义、家族精神、稳定与和谐，中国强调团结合作、诚实守信、爱岗敬业、责任担当。\n（3）外部因素之制度文化：国家的经济、政治、法律等制度安排为组织文化提供外部约束和导向，影响组织的价值取向与行为规范。\n（4）外部因素之外来文化：现代组织都是开放系统，在全球化背景下要借鉴本国其他组织的优秀文化，并融合世界上最新的文明成果，形成历史性与时代性相统一的组织文化。\n（5）内部因素之领导者的素质：领导者的价值观念、经营哲学、行为方式及人格特征对组织文化的形成和发展具有显著影响，人们常说“组织文化就是老板文化”。\n（6）内部因素之组织成员的素质：成员的文化水平、价值取向和整体素质决定组织文化被接受和内化的程度，也决定组织文化的实际运行状态。\n（7）内部因素之组织发展的不同阶段：创业阶段往往依靠领导者个人魅力，成长与成熟阶段逐步形成制度化、系统化的文化，衰退与再生阶段则要求文化变革以支撑战略调整。\n（8）塑造步骤之选择价值观：组织价值观是整个组织文化的核心和灵魂，选择正确的价值观是塑造良好组织文化的首要任务，应体现社会核心价值观并植根于特定文化土壤。\n（9）塑造步骤之强化认同与提炼定格：强化认同要做到广泛宣传、培养和树立典型、加强培训和教育；提炼定格要做到精心分析、全面归纳、精练定格，形成系统的组织文化体系。\n（10）塑造步骤之巩固完善：建立奖优罚劣的规章制度，领导者率先垂范，使组织文化转化为全体成员的习惯。同时应正视组织文化的反功能——它可能成为组织变革、有效决策和并购的障碍，注意克服思维定式、保持文化的开放性与适应性。","e":"来源：第八章第一节“组织文化的形成与发展”与第二节“组织文化塑造”（教材p194—197）。答题提示：影响因素按“外三（民族文化、制度文化、外来文化）内三（领导者素质、成员素质、发展阶段）”分栏作答，可用中美日对比作例证；塑造部分按“选、认、炼、固”四步展开，写出每一步的具体做法，最后用反功能的“可能成为变革、决策、并购的障碍”作辩证收束。","id":"mgmt-0544"},
{"ch":15,"t":"short","q":"论述：试述管理创新的内涵与管理创新的类型。","a":"（1）管理创新的内涵：管理创新活动是相对于维持活动的另一类管理活动，它是在探究人类创新活动规律的基础上，改变管理活动的过程，是一种产生新的管理思想和新的管理行为的过程。\n（2）管理创新的两种表现：管理创新既表现为管理职能活动的创新，包括决策创新、组织创新、领导创新和控制创新；也包括影响管理职能活动的关键要素创新，特别是思维创新。管理思维创新往往是管理职能创新活动的基础，管理职能创新又反过来推动管理理念和思维的创新。\n（3）不同形式的管理创新：①按创新程度，包括渐进式创新与突破式创新；②按创新变革方式，包括局部创新、整体创新、要素创新和结构创新；③按创新的组织化程度，包括自发创新与有组织的创新。\n（4）不同职能领域的管理创新：决策创新、组织创新、领导创新和控制创新。其中决策创新是第二版对第一版“战略创新”提法的新表述，组织的重大决策创新往往就是战略创新；控制创新是第二版新增内容，包括控制技术和手段创新、控制目标和标准变革，也包括组织反馈机制与控制理念和思维的创新。控制创新表现最多的是控制技术和手段创新，更需关注的是控制理念和思维的变革。\n（5）不同要素水平的管理创新：管理思维创新、管理环境创新、管理技术与方法创新。\n（6）结论：管理创新是超越并赋予决策、组织、领导、控制四项职能以新方向的独立管理职能，应从形式、职能领域、要素水平等多角度认识管理创新，以指导创新实践。","e":"来源：第十五章第一节“管理创新的内涵”、第二节“管理创新的类型”（第一节第一目、第二节第二目）。红笔考点：职能领域四类中的“控制创新”（第二版新增）与“决策创新”（第二版新表述）漏写即失分；口诀“形式三类、职能四类、要素三类”。","id":"mgmt-0545"},
{"ch":15,"t":"short","q":"论述：试述创新管理工作的任务与过程，并说明如何科学地进行创新管理决策。","a":"（1）创新管理工作的任务：把组织所有的创新活动置于积极的管理之中，从创新规律出发，运用管理手段提升组织创新的能力与效果。\n（2）创新管理的过程：有效管理创新工作是在发掘组织创新动因的基础上，进行科学的创新决策，实施创新组织和领导，评价企业创新效果，从而针对经营中存在的问题，发现新的创新动力的循环过程（口诀“动力—决策—组织领导—评估—再动力”）。\n（3）发掘创新动因——德鲁克创新七来源：意外的成功或失败；企业内外的不协调；过程改进的需要；产业和市场的改变；人口结构的变化；人们观念的改变；新知识的产生。\n（4）科学地进行创新管理决策：创新管理决策包括选择创新基础、选择创新对象、选择创新水平、选择创新方式和创新实现时机（口诀“基、象、水、方、机”）。选择创新基础要回答在哪个层面开展创新、是基础性还是应用性、工艺性创新、涉及的组织范围与资金需求三个问题，其中基础性创新是组织立命之本；创新对象包括材料、产品、工艺和手段四类；创新水平有先发优势战略与后发优势战略，以及顺轨、选轨、转轨三种轨道；创新方式有独立开发与联合开发两种。\n（5）实施创新领导——科特创新领导八环节：树立紧迫感；建立强有力的领导联盟；构建愿景规划；沟通创新愿景；广泛的授权运动；夺取短期胜利；巩固已有成果、深化创新；将创新成果制度化。其中树立紧迫感是关键责任，领导联盟是组织保障，授权是实现创新愿景的基础。\n（6）评估创新活动：以创新测量为基准，运用多种评估方法，确定关键环节与关键问题，找出现状与期望的差距并提出改进方案。创新评估四类型为技术评估型、过程评估型、系统评估型和绩效评估型；创新绩效包括创新产出绩效与创新过程绩效两方面。\n（7）结论：上述环节首尾相接构成循环，使创新成为有组织的、可持续的过程；评价创新效果后还要发现新的创新动力，推动新一轮创新。","e":"来源：第十五章第三节“创新动因与创新管理”（第一目创新动因、第二目创新管理决策、第三目实施创新领导、第四目评估创新活动）。红笔核心句：有效管理创新工作＝发掘动因→科学决策→实施创新组织和领导→评价效果→发现新动力的循环；必背“德鲁克七来源”“基象水方机”“科特八环节”“评估四类型”。","id":"mgmt-0546"},
{"ch":16,"t":"short","q":"论述：试述组织变革的阻力（障碍）及其消除方法，并说明组织变革的阶段与方式。","a":"（1）变革与创新的关系：变革与创新是一对孪生兄弟、一个问题的两个方面。组织变革侧重破旧、探索新的发展方向与路径；组织创新侧重立新，是对制度、结构、文化的创造性重构，二者互为表里。组织变革的前提是发现变革障碍、明确变革路径、获取变革合法性。\n（2）组织变革的阻力（障碍）分为三大类：①认知与心理因素，包括缺乏了解（缺乏事前有效沟通、信息真空导致谣言四起）、评价差异（信息不对称、怀念“过去的好时光”）和认知惰性（习惯原有工作方式、不愿打破现状）；②资源路径依赖因素，包括核心能力刚性（核心能力越强，路径依赖越明显）、企业家行为选择的路径依赖性和组织文化的遗传性特征（遗传性强于变异性，会过滤掉可能的变革选项）；③社会综合影响因素，包括个人利益（怕丢工作、减薪、丧失权力地位）、道德的压力和团队心理压力（凝聚力越强，同事压力越大）。此外，变革时机与突然性把握不当也会造成抵触。\n（3）消除变革抵触的方法：教育和沟通、参与和投入、提供便利和支持、协商以期一致、引导和说服、硬性实施。选择时应视信息完备程度、反对力量强弱、时间紧迫程度和发起者权力大小匹配使用：信息缺乏时用教育和沟通，反对力量强大时用参与和投入，因调整问题而反对时用提供便利和支持，有人将遭受明显损失时用协商以期一致，其他技巧无效或太昂贵时用引导和说服，时间紧急且发起者有相当权力时用硬性实施。\n（4）组织变革的阶段：勒温提出解冻、转变、冻结三阶段。解冻的核心是减少阻力、获取合法性；转变是实施变革的过程，包括寻找机会、提出构想、迅速行动、坚持不懈；冻结的核心工作是评估成果与变革制度化。\n（5）组织变革的方式（路径）：按过程分为渐进式与突变式，按结果分为转型与调整，由此形成演化、适应、改造、革命四条基本路径：演化是分阶段逐步推进、有计划主动面向未来的转型式变革；适应是分阶段缓慢、在现有理念下调整业务的被动适应性变革；改造比适应更显著更快速、波及多项变革计划；革命是短时间内多领域齐头并进、与环境突然变化密切相关。\n（6）结论：管理者应明确并传递变革需求、激发变革意愿，确立共同愿景，并按消除障碍阻力、确定新愿景、设计转化过程、得到政治支持、获取持久变革保障的任务推进变革。","e":"来源：第十六章第一节“组织变革与创新”（变革障碍、变革的阶段、变革的方式、变革管理）。红笔考点：阻力三大类（认知与心理、资源路径依赖、社会综合影响因素——“社会与政治影响因素”为第一版旧提法）、消除抵触六法（“操纵和拉拢”为第一版旧提法）、勒温三阶段、四条基本路径。","id":"mgmt-0547"},
{"ch":16,"t":"short","q":"论述：试述组织创新的主要内容，并结合“组织动态能力”说明如何构建学习型组织。","a":"（1）组织创新的地位：组织创新是管理创新工作的关键性内容，是组织可持续发展的基础保障，主要包括消除障碍、变革创新、配置创新人才、构建学习型组织四个方面。\n（2）组织创新的三个维度：①制度创新——知识替代资本成为最重要的资源，制度结构从“资本的逻辑”转向“知识逻辑”，权力派生于知识供应、利益由知识拥有者控制；②结构创新——层级结构从直线指挥、分层授权、分工细致、标准统一的科层结构，转向网络化组织，其特点是平等联盟而非等级排列、角色动态变化、权力地位取决于知识而非职位；组织结构创新的主要趋势是扁平化、柔性化、无边界化和虚拟化；③文化创新——组织文化从企业经营的副产品、管理的辅助手段、反映组织记忆的记忆型文化和一元文化，转变为企业管理重要甚至主要的手段、人们自觉创造的结果、学习型文化和允许多元价值观并存的文化。\n（3）组织动态能力：组织的创新惯例就是组织有关创新规律的认知，它对组织创新活动有着启发和引导作用，是组织创新艺术；组织创新惯例是组织进行管理创新、应对环境变化的重要资源，这种资源常被学术界称为组织动态能力。组织惯例具有组织记忆的知识、组织成员一致的知识、组织延续的知识三个特性，而组织动态能力是其中专门针对创新、逐层收窄的部分。\n（4）组织学习是组织创新的基础：组织只有通过学习，才能获取变化的知识，形成创新思维，产生创新行为。阿吉里斯提出组织学习三种类型：单循环学习（又称适应性学习，在现有框架内纠错，寻求“症状解”）、双循环学习（检视并矫正组织规范、目标和错误假设，是创新学习）和再学习（质疑整个学习过程，又称“学习如何学习”，寻求“根本解”）。组织学习还会因行为受限、听众、迷信式经验、模棱两可等原因而中断，并存在局限思考、归罪于外、专注个别事件、煮青蛙的故事、管理团体的迷思等学习障碍。\n（5）构建学习型组织：学习型组织是指培养出持续学习、适应和改变能力的组织。彼得·圣吉在《第五项修炼》中提出五项修炼：系统思考（具有系统的观点和动态的观点，是五项修炼的核心）、自我超越、改善心智模式、建立共同的愿景、团体学习。通过五项修炼，管理者和员工不断培养出全新的思维方式，从而把组织转变为学习型组织，实现可持续创新。\n（6）结论：组织创新须遵循知识创新过程、克服学习中断与学习障碍，在制度、结构、文化三个维度上同步推进，并以组织动态能力的持续更新为支撑。","e":"来源：第十六章第二节“组织结构创新”、第三节“创新与学习型组织”（组织惯例与组织动态能力、知识创新四模式、组织学习、五项修炼）。红笔考点：【第二版新增】“组织动态能力”必须以“组织创新惯例＝关于创新规律的认知”定义；组织学习三类型（单循环/适应性、双循环、再学习）与五项修炼（系统思考为核心）为必背。","id":"mgmt-0548"},
{"ch":17,"t":"short","q":"论述：试述互联网广泛应用引发的管理革命。","a":"（1）总论：互联网的广泛应用和快速发展是目前时代的最基本特征。互联网引领的信息革命在影响企业外部关系和内部组织活动的同时，对新时代的管理提出了新要求，企业在组织结构、员工管理方式以及管理者决策方式等方面发生着适应性变革。\n（2）组织结构的适应性变革——无边界组织：组织结构从法理型设计转向无边界组织，无边界组织由通用电气公司CEO杰克·韦尔奇提出，是互联网时代企业组织变革的常态选择，其实质是一种组织设计理念。无边界组织力求打破和取消组织边界，第二版将其概括为四条边界：超越规模边界（信息经济与无形资产使边际收益增加、边际成本递减，企业进入无边界时代）、拓展地理边界、淡化水平边界（淡化部门职责边界、强调多部门协同办公）、打通垂直边界（减少纵向层级、形成扁平化组织）。\n（3）员工管理方式的适应性变革：泰勒的科学管理、法约尔的层级管理和韦伯的科层制管理都以有效分工和明确岗位职责为管理员工的重点，而互联网时代快速变化的市场环境使工作内容难以预知，企业更加需要员工的综合能力和主观能动性。变革体现在两方面：一是员工技能综合化；二是员工自主行动空间扩大。\n（4）管理者决策方式的适应性变革：传统管理决策分析从理性经济人假设出发，认为决策目标是企业利益最大化；西蒙提出有限理性决策假说，认为人不可能做到绝对理性，而是选择相对满意的决策。伴随互联网产生的信息爆炸给决策带来双重影响：大量生成、迅速传播、实时共享的信息为决策的科学性提供了重要保证，但基于海量信息做出快速的理性分析也变得非常困难——一是信息数量极其庞大，管理者没有能力完全消化和处理；二是信息传播和市场变化快速，不允许管理者充分理性分析后再迟缓决策。因此管理者必须在重视理性分析的同时，借助综合的知识、历史的经验和模糊的直觉进行快速决策。直觉以经验累积、思维沉淀为基础，以灵感闪现为形式，实际上是非常迅速的理性思维过程的结果，蕴含着丰富的科学成分。\n（5）结论：管理理论必须随互联网时代的管理实践不断更新，管理者应主动推进组织结构、员工管理方式和决策方式的适应性变革。","e":"来源：结语“互联网时代的管理变革”二、管理革命三方面（组织结构、员工管理方式、管理者决策方式）。红笔考点：【第二版变动】无边界组织四条边界“超越规模边界、拓展地理边界、淡化水平边界、打通垂直边界”（第一版为外部/地理/水平/垂直边界）；西蒙有限理性决策假说与直觉决策为第二版强化内容。口诀“构、人、策”。","id":"mgmt-0549"},
{"ch":17,"t":"short","q":"论述：试述互联网对企业活动的影响，并说明企业数字化转型的基础。","a":"（1）总论：信息是现代企业生产经营活动的组织手段和依据。互联网在商业领域的广泛应用主要体现在信息生成、信息传播和信息存储三个方面，从而深刻改变了企业的外部关系和内部组织活动。\n（2）对数字经济与数字化转型的界定：2016年9月二十国集团领导人杭州峰会通过的《二十国集团数字经济发展与合作倡议》指出，数字经济是指以使用数字化的知识和信息作为关键生产要素、以现代信息网络作为重要载体、以信息通信技术的有效使用作为效率提升和经济结构优化的重要推动力的一系列经济活动。对企业来说，数字化转型的基础是大数据的生成和工业互联网的广泛运用：大数据既指企业外部反映经营环境特征和变化的巨量信息，也指企业内部对各种活动要素在空间分布和时间运动状况的巨量数字描述；工业互联网帮助实现不同终端间的共时沟通，促成人与物及物与物的信息联结，使管理者可以直接组织调控整个生产过程。\n（3）对企业与商业合作伙伴关系的影响：互联网使企业与上游供应商、下游客户企业和战略合作企业的合作关系更加紧密。就供应商而言，信息数量增加、传播加快，企业更容易收集和对比供应商信息，减少了信息不对称，降低了交易成本；就客户而言，负面消息更易产生和传播，企业声誉和品牌形象成为企业立身的根本；就战略合作企业而言，沟通与信息交流使合作不再受时间和地点的制约，更容易达成共识。\n（4）对企业与竞争厂家关系的影响：信息的高速流通使技术和制度的优势更容易被模仿和复制，企业必须发展不可复制的核心优势；高度公开的市场信息和透明的市场价格使市场更加接近完全竞争市场。\n（5）对企业内部活动组织的影响：对企业组织而言，互联网的应用既是挑战，也是机会。企业需要提高自身管理创新能力，提高资源配置效率，并在组织结构、员工管理方式和管理者决策方式上作出适应性变革。\n（6）结论：没有互联网，数据只是分散的资源；借助互联网，数据才成为组织协调社会经济活动的要素，因此管理变革的根源在互联网，管理理论必须随之更新。","e":"来源：结语“互联网时代的管理变革”一、从后工业社会到数字化转型；二、互联网在商业领域的广泛应用；三、互联网对企业活动的影响。红笔考点：数字经济定义必须写明出处（2016年G20杭州峰会《二十国集团数字经济发展与合作倡议》）；数字化转型基础＝大数据的生成＋工业互联网的广泛运用；对外关系三条“供应商降成本、客户重声誉、战略伙伴破时空”。","id":"mgmt-0550"},
{"ch":15,"t":"case","q":"某省属建筑工程集团有限公司长期以传统现浇施工为主，近年面临建筑市场竞争加剧、劳动力成本上升、业主对绿色建造和工期要求提高等压力，企业自身也出现设备利用率下降、项目亏损增多的困境。为此，公司决定以智能建造为方向推进管理创新：引进BIM协同设计平台和装配式构件生产线，把项目管理流程由线下纸质审批改造为线上流程管控，设立企业技术中心并与高校联合开发新工艺，还在试点项目上推行数字化质量安全监控。但创新推进中也出现新问题：部分项目部担心原有熟练工艺被淘汰，对新技术学习不积极；新平台使成本数据实时透明，个别项目经理认为“管得太死”；同时新老两套管控标准并行，质量验收一度出现扯皮。\n问题：","a":"（参考答案见各小问）","sub":[{"q":"（1）结合材料，分析该企业推动管理创新的动因。（5分）","a":"①外部环境变化的拉动：建筑市场竞争加剧、劳动力成本上升、业主对绿色建造和工期要求提高，属于市场需求、技术进步和竞争压力等外部动因；②组织内部危机或瓶颈的推动：企业自身设备利用率下降、项目亏损增多，属于效率、成本方面的内部危机；③可预期的超额收益（利益拉动）：通过智能建造提高效率、降低成本、增强竞争力，企业可望获得超额收益；④组织成员的成就欲和责任感：设立企业技术中心并与高校联合开发新工艺，体现了管理者和技术骨干的创新追求与责任感。（采分点：外部动因2分、内部动因1分、利益拉动1分、成员因素1分，均须结合材料）"},{"q":"（2）运用维持与创新的关系原理，说明该企业应如何处理传统施工管理与智能建造创新的关系。（5分）","a":"①创新是维持基础上的发展，维持是创新的逻辑延续。企业推进智能建造必须以原有的施工管理经验和质量安全体系为基础，不能全盘否定传统；②维持是实现创新的成果，创新为更高层次的维持提供依托和框架。BIM平台和线上流程管控一旦成熟，就应通过制度和标准固化下来，形成新的“维持”；③二者在逻辑上表现为相互连接、互为延续的链条，有效管理是实现维持与创新最优组合的管理；④过度维持会导致组织僵化和保守（如坚持原有工艺、排斥新技术），过度创新会消耗大量物力、财力资源（如新老两套标准并行造成扯皮），因此应分步推进、先试点后推广，并及时统一管控标准，实现二者的最优组合。（采分点：关系原理2分、结合材料展开2分、最优组合与结论1分）"},{"q":"（3）针对案例中的项目部抵触和新老标准并行问题，提出推进管理创新的建议。（5分）","a":"①加强教育和沟通：讲清智能建造的必要性和转岗培训安排，消除“熟练工艺被淘汰”的顾虑；②让员工参与：吸收项目部骨干参与平台流程设计，把“管得太死”转变为“赋能提效”；③提供便利和支持：开展BIM与装配式施工技能培训，设置过渡期和激励措施，帮助员工适应新技术；④同步推进控制创新：统一新老两套管控标准和质量验收口径，明确责任界面，避免验收扯皮，同时以数字化监控创新控制技术和手段；⑤注重管理思维创新：引导管理者从“经验管控”转向“数据驱动”，因为管理思维创新往往是管理职能创新活动的基础。（每点1分，言之有理酌情给分）"}],"e":"【答题思路】本题以建筑工程企业推进智能建造为情境，考查第十五章“创新原理”。第一问按“外部拉动＋内部推动＋利益拉动＋成员成就欲与责任感”逐条对应材料细节；第二问必须写出维持与创新的关系原理（发展—延续、成果—依托、相互连接互为延续、最优组合），并回扣案例中“传承传统施工经验”与“新标准制度化”两个环节，再指出过度维持与过度创新的危害；第三问要分对象、分层面提措施，并点出第二版新增的“控制创新”与“管理思维创新”，体现对教材变动的掌握。","id":"mgmt-0551"},
{"ch":9,"t":"short","q":"论述：试述领导与管理的联系与区别，并结合领导权力的来源说明管理者如何才能成为一名有效的领导者。","a":"（1）领导的含义：领导是管理的一个职能，指在特定情境中通过影响个体或群体的行为来努力实现目标的过程；从名词意义上讲，领导者是承担领导职能的人。领导的本质是对被领导者的影响力，这种影响力来自下属自愿的服从与追随。\n（2）领导与管理的联系：领导是管理的一个部分，属于管理工作的范畴；管理活动中包含领导职能，二者相互依存、不可分割，有效的管理者必须善于领导。\n（3）区别之一——范围不同：领导是管理的一个部分，而管理除了领导职能，还包含决策、组织、控制和创新等其他职能。明茨伯格的经理角色理论把管理活动分为三类十种角色，“领导者”角色只是其中之一，管理者还需要承担“挂名首脑”“监听者”“企业家”等其他角色。\n（4）区别之二——权力来源不同：管理的权力来自组织结构，建立在合法的和强制性的权力基础之上；领导的权力既可以来源于其所在职位，即组织结构的权力，也可以来源于领导者个人，如专家的权威性或个人的魅力。\n（5）领导权力的五种来源：①奖赏权力，即能够对他人进行奖赏的权力，奖赏要与下属的需要相一致；②强制权力，即惩罚的权力，靠下属对惩罚的关切和恐惧产生影响，易带来不满与对抗，须谨慎使用；③法定权力，即特定职位和角色被法定的、公认的正式权力；④参照权力，源于领导者的个人特征（行为方式、魅力、经历、背景等），基础是下属的认同或认同渴望；⑤专家权力，产生于领导者的专业知识或技能。\n（6）职位权力与个人权力的划分：奖赏权力、强制权力和法定权力与职位相关，统称职位权力；参照权力和专家权力与职位无关，取决于领导者的个人魅力或专业知识，统称个人权力。\n（7）有效领导者的要求：有效的领导者不仅要依靠职位权力，而且要具有一定的个人权力。个人权力发挥作用时，下属不是因为希望获得奖赏、害怕惩罚或是屈从法定权威而不得不服从，而是出于发自内心的尊重与认同，产生归属感，自愿与领导者一起为组织工作，在面对风险和变革时更能团结一心。\n（8）管理者与领导者的分离：有人既是管理者也是领导者；有人是管理者但不是领导者，他们占据特定职位、可以命令和监督下属，却无法获得下属主动追随的意愿；还有人能在组织中扮演领导角色但不是管理者，他们没有正式职位和权力，却能以自身的特质影响他人、实现目标。\n（9）实践启示：组织一方面应把具有领导能力的人放到管理岗位上，另一方面要有意识地把管理者培养成合格的领导者；管理者应在运用职位权力的同时注重培育个人权力，用愿景、认同与信任赢得下属的自愿追随。","e":"来源：第九章第一节“领导与管理”“领导权力的来源”（教材p203—206，★★★★★红笔考点）。答题提示：先界定领导、点明“领导是管理的一部分”这一联系，再按“范围不同、权力来源不同”两条展开区别（第二版已删“主要功能不同”“通过不同途径发挥作用”，不要再答）；权力部分要写出五种权力并落到职位权力／个人权力的分类上，最后用“有效的领导者不仅要依靠职位权力，而且要具有一定的个人权力”收束，并补充管理者与领导者分离的情形与实践启示。","id":"mgmt-0552"},
{"ch":9,"t":"short","q":"论述：试述变革型领导理论，比较交易型领导与变革型领导，并说明变革型领导的四种方式及其对管理实践的启示。","a":"（1）理论提出：变革型领导理论通常与交易型领导理论同时出现，致力于比较两种领导者行为的差异以及对下属和组织工作的影响效果。詹姆斯·麦格雷戈·伯恩斯在1978年出版的《领袖》一书中指出，领导不是简单的权力行使，而是人们为了实现特定目的、调动各种资源，去激励、吸引和满足追随者动机的过程，并把领导分为交易型领导和变革型领导两种形式。\n（2）交易型领导的内涵：交易型领导指的是领导者和追随者之间的交换关系，以满足他们的个人利益；这种交换在本质上可能是经济的、政治的或心理的，例如以物易物、候选人与公民之间的选票交易等。巴斯指出交易型领导主要采用奖励和惩罚相结合的方式。\n（3）变革型领导的内涵：变革型领导指的是领导者和追随者相互将对方的动机和道德提升到更高水平的过程。这一过程将追随者的需要层次从对安全和保障的需要提升到对成就和自我实现的需要，激发他们思考什么是真正重要的，并推动他们为了所属群体的更大利益而超越眼前的个人私利。\n（4）伯恩斯与巴斯的分歧：伯恩斯把交易型领导与变革型领导视为同一连续体的两端；巴斯则认为它们是两个连续体，并提供了量化指标分别衡量这两种领导方式。\n（5）第一种方式——理想化影响力：领导者被誉为榜样，受到敬佩、尊重和信任；他们考虑追随者的需要而不是自己的需要，从而赢得追随者的信任，与追随者分担风险，并在行为上符合基本的道德规范、原则和价值观要求。\n（6）第二种方式——鼓舞性激励：领导者清晰地表达出对未来的美好愿景，展示出热情和乐观，通过为追随者的工作提供意义和挑战来激励周围的人，激发个体和团队精神。\n（7）第三种方式——智力激发：领导者质疑旧的假定、传统和信仰，激发追随者进行创新和创造，鼓励表达新的想法、征求新的视角和创造性的问题解决方案。\n（8）第四种方式——个性化关怀：领导者关注每一个追随者，考虑他们的个人需求、能力和抱负，认识到需求和欲望的个体差异，耐心倾听，通过建议、教育和指导促进追随者的发展与成长。（四方式口诀“影响、激励、智力、关怀”）\n（9）变革型领导相对于交易型领导的优势：在领导的有效性以及追随者的努力程度和满意度方面都要优于交易型领导，并能带来超出预期的表现；交易型领导迎合追随者的直接个人利益，变革型领导则提升了追随者的士气、动机和道德水平；交易型领导强调组织能为个人做什么，变革型领导则强调个人能为组织做什么。\n（10）管理启示：变革型领导可以通过技能培训在组织环境中培养出来。组织应注重愿景塑造、价值观引导和个性化关怀，通过培训与制度安排培育变革型领导者，使下属由被动服从转向自愿追随，从而推动组织变革与持续创新。","e":"来源：第九章第二节“变革型领导理论”（教材p214—217，第二版新增，★★★★★红笔考点）。答题提示：按“提出者与著作→交易型内涵→变革型内涵→伯恩斯与巴斯的分歧→四种方式逐一展开→优势比较→可培训性启示”的顺序作答；四种方式口诀“影响、激励、智力、关怀”，务必逐条带解释；注意区分提出者伯恩斯（区分交易型与变革型）与巴斯（提出四方式、视为两个连续体）。","id":"mgmt-0553"},
{"ch":10,"t":"short","q":"论述：试述激励的过程与机理，并说明管理者应如何据此设计有效的激励机制。","a":"（1）激励的内涵：激励是组织诱发个体产生满足某种需要的动机，进而促使个体行为与组织目标趋同的管理过程。激励应从调动人的积极性的角度出发，系统解决“激励什么”和“如何激励”两个关键问题。\n（2）为何激励——委托代理逻辑：受人类的自利性、有限理性和风险回避性等因素的影响，企业员工（代理人）并不总是以企业所有者（委托人）的利益最大化为目标而行动，因此组织管理者有必要设计一套激励机制，以引导员工产生组织期望的行为。\n（3）人的行为规律与三类变量：人的行为规律包含刺激变量、机体变量和反应变量三类基本变量。刺激变量是指对个体反应产生影响的外界刺激，也叫诱因，如自然环境刺激、社会环境刺激；机体变量是对个体反应产生影响的内部决定因素，如个体性格、动机；反应变量是刺激变量和机体变量在个体反应上引起的变化。\n（4）激励的过程（机理）：刺激诱发需要，需要引起动机，动机产生行为，是人的一般行为规律。激励过程本质上就是通过刺激变量引起机体变量（需要、动机）产生持续不断的个体兴奋，从而引起个体积极行为反应的过程，即“需要→动机→行为→目标→新的需要”循环往复的过程。\n（5）激励机理必须符合人性假设：科学的激励机理必须符合人的行为规律和人性假设。代表性的人性假设有经济人假设（X理论）、社会人假设（人际关系理论）、自我实现人假设（Y理论）和复杂人假设（超Y理论）。\n（6）针对性激励：人的需要具有差异性，管理者应根据不同人在不同情境下的不同需要采取针对性的激励方式；多种需要中在一定时期总有一种占支配地位的主导（优势）需要，抓住主导需要激励才最有效。\n（7）激励过程要处理好三方面关系：一是努力与绩效的关系，即人们主观上认为通过自身努力达成预期目标的概率；二是绩效与奖励的关系，即取得绩效后能否获得合理的奖励；三是奖励与满足需要的关系，即奖励能否满足员工某方面的需要。\n（8）激励理论与激励方法的配套：行为基础理论（需要层次理论、双因素理论、成就需要理论）研究员工的需要是什么；过程激励理论（公平理论、期望理论、目标设置理论）研究需要引发行为的机制；行为强化理论（强化理论）研究行为如何塑造与修正。与之对应，激励方法包括工作激励、成果激励和辅助（综合）激励三类。\n（9）实践启示：激励机制的设计要把物质激励与精神激励、外在激励与内在激励结合起来，明确并兑现“努力—绩效—奖酬—满足”的链条，对工作业绩予以及时反馈，并根据员工的主导需要和不同发展阶段动态调整激励措施，避免孤立地套用某一理论。","e":"来源：第十章第一节“人的行为过程及特点”“人性假设及其发展”“激励机理”与本章内容概要（教材p234—238、p250，★★★★★红笔考点）。答题提示：以“为何激励（委托—代理）→人的行为规律三变量→激励过程与机理→人性假设→针对性激励”为主线，理论部分注意三大类理论的归类（成就需要属行为基础理论、目标设置属过程激励理论），并把“努力—绩效—奖励—满足”三条关系作为激励过程的核心线索，最后落到机制设计的实践启示上。","id":"mgmt-0554"},
{"ch":10,"t":"short","q":"论述：试述强化理论的主要内容，说明正强化、负强化、惩罚和自然消退四种方式的区别，并阐述其在管理中的运用。","a":"（1）理论提出：强化理论由美国心理学家斯金纳提出，其理论基础是操作性条件反射学说（见《有机体的行为》《科学和人的行为》等著作），行为强化理论是操作性条件反射学说的核心。\n（2）基本观点：人们出于某种动机，会采取一定的行为作用于环境。当这种行为的结果对人们有利时，这种行为就会在以后重复出现；反之，当这种行为的结果对人们不利时，这种行为就会减少或消失。因此，行为的结果会对人的动机产生很大影响，从而使行为在后续得以增加、减少或消失。\n（3）正强化：是指通过出现积极的、令人愉快的结果而使某种行为得到加强。例如为提前完成工作任务的员工发放奖金，以激励员工继续提升工作效率。\n（4）负强化：是指通过消除或减少令人厌恶的结果来增加某种行为发生的可能性。例如告知员工完不成工作任务则需要加班，以使员工提升工作效率。\n（5）惩罚：是指对令人不快或不希望的行为给予处罚，以减少或削弱该行为。例如对生产产品质量不达标的员工进行罚款，以促使其提升产品质量。\n（6）自然消退：是指通过避免为某种行为提供任何积极反馈来减少该行为的发生。例如经理对来自员工的建议不置可否，从而降低员工提出建议的频率。\n（7）负强化与惩罚的本质区别：负强化是“消除或减少令人厌恶的结果”以“增加”行为发生的可能性；惩罚是“给予令人不快的结果”以“减少或削弱”行为。二者手段方向相近而目标相反（一增一减），是最易混淆之处。\n（8）应用原则：一是按照强化对象的不同需要采取不同的强化措施；二是对所期望取得的工作业绩予以明确的规定和表述；三是对工作业绩予以及时的反馈（口诀“按需要、明业绩、快反馈”）。\n（9）理论评价：强化理论揭示了行为塑造与修正的客观规律，当前被广泛应用于组织对员工工作行为的修正和改造；但该理论过于强调对人的行为的限制和控制，忽视了人的内在心理过程和状态，并且只讨论外部因素或环境刺激对行为的影响，忽略了人的因素和主观能动性对环境的反作用。\n（10）实践运用：管理者应以正强化为主、慎用惩罚，并把惩罚与正强化结合使用，做到“惩前毖后”；对期望的行为要及时、明确地予以反馈；注意不同员工强化物的差异，因人因事选择强化方式，并把强化与目标设置、需要激励等方法配合使用，形成完整的行为塑造机制。","e":"来源：第十章第三节“行为强化理论”（教材p244—247，★★★★★红笔考点；第二版已修改负强化、自然消退的定义）。答题提示：先写强化理论的含义与操作性条件反射基础，再按“正强化—负强化—惩罚—自然消退”四种类型逐条给出定义并各配一例（奖金／加班告知／罚款／不置可否），务必单独点出“负强化≠惩罚”；最后写应用三原则与理论评价，落到管理运用上。","id":"mgmt-0555"},
{"ch":11,"t":"short","q":"论述：试述沟通过程及其基本要素，并结合沟通障碍说明管理者如何实现有效沟通。","a":"（1）沟通的内涵：沟通是信息的传递与理解的过程，是在两人或更多人之间进行的在事实、思想、意见和情感等方面的交流；有效的沟通不仅包括信息的传递，还包括信息的被理解。\n（2）沟通过程的七要素：信息发送者、编码、信息、渠道（媒介）、解码、信息接收者、反馈；噪声是七要素之外附加的干扰因素，存在于沟通过程的各个环节。\n（3）发送者与编码：信息的发送者是沟通的发起者，他产生想法后进行编码，即把要表达的意思转换成语言、文字、符号等可以传递的形式。\n（4）信息与渠道：信息是沟通的内容，渠道是信息传递的媒介与通路；按信息传递的媒介不同可分为口头沟通、书面沟通、非言语沟通和电子沟通，按组织系统则可分为正式沟通与非正式沟通。\n（5）接收者与解码：接收者接收到信息后进行解码，即把接收到的符号还原为可以理解的意义；解码的结果受接收者的知识经验、需要动机、情绪和个性特征的影响。\n（6）反馈：反馈是指信息接收者给信息发送者一个信息，告知信息已收到以及理解信息的程度；反馈是沟通过程中的最后一个环节，往往是决定沟通目标可否实现的关键，也正是反馈构成了信息的双向沟通。\n（7）噪声：噪声是指沟通过程中对信息传递和理解产生干扰的因素，如难以辨认的字迹、沟通双方有较难听懂的语言、消极的成见、身体的不适、对对方的反感等；噪声存在于沟通过程的各个环节，而不只是在传递环节。\n（8）影响有效沟通的三大类障碍：①人际障碍，包括表达能力、知识和经验差异、个性和人际关系、情绪、选择性知觉、信息过滤、信息过载；②组织障碍，包括组织结构不合理、组织氛围不和谐；③文化障碍，即不同文化在自我意识、语言、价值观、信仰、思维方式等方面的差异。\n（9）克服沟通障碍、实现有效沟通的技巧：①学会倾听，做到用耳朵去听、用头脑去思考、用心灵去感受；②重视反馈，让接收者复述并建立信息反馈系统；③克服认知差异；④抑制情绪化反应；⑤缩短信息传递链、拓宽沟通渠道。\n（10）管理启示：管理者应理解并正确对待沟通，把沟通视为降低管理模糊性、凝聚组织、连接组织与外部环境的桥梁；在沟通过程中主动减少噪声、及时反馈、畅通正式与非正式渠道，并注意中国式沟通“以和为贵、关系导向、情境优先”的特点，从而提高沟通的有效性。","e":"来源：第十一章第一节“沟通过程”“沟通的功能”与第二节“沟通障碍及其克服”（教材p255—260、p266—267，★★★★★红笔考点）。答题提示：按“沟通含义→七要素（发送者、编码、信息、渠道、解码、接收者、反馈）＋噪声→逐要素说明→三类障碍→克服五技巧”的顺序作答；注意“噪声不在某一固定环节，而存在于沟通过程的各个环节”这一易错点；结尾可点出中国式沟通的特点作为学科特色。","id":"mgmt-0556"},
{"ch":11,"t":"short","q":"论述：试述冲突观念的变迁，并说明管理者应如何进行冲突管理。","a":"（1）冲突的内涵：冲突是相互作用的主体之间存在的不相容的行为或目标，发生于对稀缺资源分配方式的分歧以及不同的观点、信念、行为、个性的冲撞；冲突是客观存在的组织现象，既可能是显性的对抗，也可能是潜在的不一致。\n（2）冲突观念的变迁总述：人们对组织冲突的理解大致经历了三个阶段，按照出现的先后顺序依次为传统观念、人际关系观念和相互作用观念，态度演变的主线是“避免→接受→鼓励”。\n（3）第一阶段——传统观念（19世纪末至20世纪40年代）：认为所有冲突都是不好的、有害的，冲突是组织管理不善的信号，只能给组织带来消极影响，因而应当尽可能加以避免。\n（4）第二阶段——人际关系观念（20世纪40年代末至70年代）：认为冲突是组织中不可避免的客观现象，应当接受冲突并设法使之合理化，但尚未认为冲突具有积极意义。\n（5）第三阶段——相互作用观念（20世纪80年代以后，当代主流观点）：认为冲突不一定都是坏事，适度水平的冲突对组织是有益的，可以激发创新、增强组织活力，管理者应当鼓励冲突并把冲突维持在最佳水平。\n（6）冲突的二重性：冲突既可能具有建设性（激发变革、促进沟通、暴露问题），也可能具有破坏性（消耗资源、影响士气、阻碍目标实现）；冲突水平过低时组织会缺乏生机和活力、绩效低下，冲突水平过高时又会导致混乱和失控。\n（7）冲突管理的基本目标：把冲突水平控制在适量水平、“弃其弊而用其利”——既要抑制过高的破坏性冲突，把已出现的冲突引向建设性轨道，又要适度激发过低的冲突，避免组织僵化。\n（8）冲突的抑制——托马斯冲突处理二维模式与五种策略：托马斯以“合作性”（满足对方关心点的程度）为横坐标、以“坚持己见”（满足自己关心点的程度）为纵坐标，组合出竞争（坚持己见、不合作）、合作（坚持己见、合作）、回避（不坚持己见、不合作）、迁就（不坚持己见、合作）和妥协（中等程度的坚持己见、中等程度的合作）五种策略，口诀“竞合回迁妥”；其中合作策略尽可能满足双方利益，代表双赢局面。\n（9）冲突的激发（当组织冲突不足时）：一是将冲突合法化；二是适度引入外部的新鲜血液；三是通过组织结构的安排来激发冲突。\n（10）管理启示：冲突管理不等于压制冲突。管理者应正视冲突的客观性与二重性，善于诊断冲突的水平与类型，对过高的冲突选用适宜的处理策略加以抑制，对过低的冲突适度激发，使组织始终保持适度的冲突水平，从而增强组织的活力与创造力。","e":"来源：第十一章第三节“冲突的原因与类型”“冲突观念的变迁”“冲突管理”（教材p268—272，★★★★★红笔考点）。答题提示：三阶段的时间与主张必须一一对应（传统＝19世纪末—40年代／避免，人际关系＝40年代末—70年代／接受，相互作用＝80年代以后／鼓励），态度动词不能互换；冲突管理部分要写全“抑制（托马斯五策略）＋激发（三手段）”，并强调“冲突管理≠压制冲突”这一最易失分的判断点。","id":"mgmt-0557"},
{"ch":12,"t":"short","q":"论述：试论述控制的内涵、作用以及控制工作对组织运行的意义。","a":"（1）控制的内涵。控制是指对组织内部的管理活动及其效果进行衡量和矫正，以确保组织的目标以及为此而拟定的计划得以实现。其内涵包括：①控制具有目的性；②控制具有整体性；③控制是通过监督和纠偏来实现的；④控制是一个过程，不是一次性行为，它通过检查、监督并确定组织活动的进展情况，对实际工作与计划之间出现的偏差加以纠正。\n（2）控制的作用（第二版由第一版的“控制的必要性”改称“控制的作用”）。管理者只有通过控制才能了解组织目标及计划是否实现，然后分析没有实现的原因。具体包括：①适应组织环境的变化。组织面临的环境复杂多变和不确定，环境变化必然要求组织调整原先的计划，组织需要通过控制系统及时了解环境变化以及执行计划中的偏差，分析原因并调整经营内容。②应对管理权力的分散。随着组织规模扩大，管理者不可能直接指挥全体员工，必须向下属授权；有效的控制系统可以向管理者适时提供下属的工作信息，使被授权者处于可控范围内，防止下属滥用授权。企业分权程度越高，控制就越有必要。③应对员工工作能力的差异。不同组织成员的认识能力和工作能力存在差异，这种差异可能使原定计划发生偏离，因此控制是必要的。\n（3）控制的系统与意义。控制系统由控制主体、控制客体、控制目标以及控制的手段与工具体系四大部分构成；控制主体可划分为高、中、低三个层次。控制是管理的重要职能，与计划、组织、领导共同构成管理职能的闭环：计划确立目标与标准，控制则通过衡量与矫正保证目标与计划的实现，没有有效的控制，计划目标就会落空，组织也会陷入错乱。","e":"来源：第十二章第一节 控制的内涵与原则（教材p277—p278）。采分点：控制定义及四点内涵3分＋控制作用三项（环境／分权／能力）4分＋控制系统与意义2分。注意：第二版已把“控制的必要性”改称“控制的作用”，答题须按第二版写“作用”；“企业分权程度越高，控制就越有必要”为必背金句。","id":"mgmt-0558"},
{"ch":12,"t":"short","q":"论述：试论述有效控制应遵循的基本原则及其对控制实践的指导意义。","a":"有效控制应遵循五项原则，口诀“标—点—势—直—例”。\n（1）有效标准原则。控制的标准必须与组织的理念和目标一致，具有指引导向作用，便于检查评价。控制标准应满足简明、适用、一致、可行、可操作、相对稳定、前瞻七项基本要求；标准由计划产生并取关键点，是控制过程第一步“确定标准”的依据。\n（2）控制关键点原则。管理者不可能对所有活动进行全面控制，也没有必要“眉毛胡子一把抓”，应抓住主要影响因素、选择若干关键环节作为重点并制定明确标准，即“牵牛要牵牛鼻子”；“控制住了关键点，也就控制住了全局”。\n（3）控制趋势原则。管理控制存在时间滞后，重要的不是现状本身，而是现状所预示的趋势。趋势往往被现象所掩盖，管理者必须透过现象看趋势，在苗头出现时明察秋毫，才能面向未来实施有效控制。\n（4）直接控制原则。直接控制着眼于“人”，即培养更好的主管人员，使其能熟练应用管理概念、技术和原理，以系统的观点看待管理工作，从而能事先察觉偏差；主管人员素质越高，就越不需要间接控制，控制的费用也越低。间接控制则着眼于结果与追责，其缺点是偏差和损失已经发生后才能采取措施，代价较大。\n（5）例外原则。管理者应把主要精力集中于重要的例外偏差上，“管理者越是集中精力对例外情况进行控制，控制的效果就会越好”；但仅仅注意例外情况是不够的，还要区别对待，并且例外原则必须与控制关键点原则相结合。\n（6）指导意义：五项原则共同回答了控制依据什么标准、控制什么、控制到什么程度以及由谁控制等问题，是设计控制系统、确定控制标准、选择关键控制点、安排控制重点的基本依据。","e":"来源：第十二章第一节 控制的内涵与原则（教材p279—p281）。采分点：五项原则各1—1.5分，指导意义1分。口诀“标—点—势—直—例”；⚠易混：直接控制＝着眼于“人”（主管素质），间接控制＝着眼于“结果与追责”，两者不可倒置。","id":"mgmt-0559"},
{"ch":13,"t":"short","q":"论述：试论述层级控制、市场控制与团体控制的含义、主要手段与适用条件，并比较三者的差异。","a":"从战略层次的角度，组织的控制方法可以划分为层级控制、市场控制与团体控制三类，三者的具体做法、适用范围和发挥的作用各不相同。\n（1）层级控制（亦译为“官僚控制”或“科层控制”）。是指利用正式的章程、规则、政策、标准、科层权力、书面文件和其他科层机制来规范组织内部门和成员的行为并评估绩效。常见方法有预算控制、审计控制和财务控制。层级控制是多数中型和大型组织最基本的控制方法，在政府、军队、银行等讲求程序和正规化的组织中，正式规范是各部门和所有成员职务行为的主要依据。其局限是：层级控制程度高的组织员工自主权较少、容易形成纵向的业务流程、对客户需求重视不足；随着网络化组织、平台化组织、生态型组织的涌现，层级控制有所弱化。\n（2）市场控制。是指组织借助经济的力量，通过价格机制来规范组织内部门（单位）和员工的行为。其动因是企业内部组织管理成本过高；核心是通过构建组织内部的市场关系，激发员工在经济利益方面的追求，形成自发的动力；通常从企业、部门和个人三个层次展开。海尔集团实施的“以市场链为纽带的业务流程再造”和“人单合一双赢模式”是典型实践。\n（3）团体控制（clan control）。是指将个体融入团体之中，使个人的价值观与组织的价值观和目标相统一，通过团体的共同行为范式来实现组织成员的自我约束和自我控制。它主要依靠组织文化手段来控制员工行为，需要员工具有共同的价值观和相互信任；由于控制对象、控制环境和雇佣关系的变化，团体控制弥补了层级控制和市场控制留下的空白。\n（4）三者比较。①控制手段不同：层级控制靠规则，市场控制靠价格，团体控制靠价值观。②动力来源不同：层级控制靠正式权力与规章制度，市场控制靠经济利益，团体控制靠共同价值观与相互信任。③适用条件不同：层级控制适用于中大型、讲求程序正规化的组织；市场控制适用于规模大、内部管理成本高且职能可独立核算的组织；团体控制适用于知识工作、团队协作比重高、需要创新与自主控制的组织。④三者并非相互替代，而是相互补充、结合使用。","e":"来源：第十三章第一节 层级控制、市场控制与团体控制（教材p296—p303）。采分点：三种控制方法含义与手段各2分＋比较3分。⚠易混：战略三方法（层级／市场／团体控制）≠第十二章按控制方式分的集中／分散／分层控制，也≠按控制力来源分的组织／群体／自我控制。","id":"mgmt-0560"},
{"ch":13,"t":"short","q":"论述：试论述平衡计分卡的内涵、四个维度及其在组织控制中的作用。","a":"（1）内涵。平衡计分卡（balanced scorecard，BSC）是卡普兰和诺顿于20世纪90年代提出的一个从财务、客户、内部管理、创新与学习四个维度来设计和选择企业业绩评价指标的体系。平衡计分卡的提出和应用开创了全面均衡控制的新时代，为企业构建战略控制系统提供了一个实用的框架。\n（2）四个维度。①财务维度：财务指标能够综合反映企业的经营绩效，是平衡计分卡所有层面的目标和指标的核心；企业通过衡量收入是否增长及效率是否提高两个财务指标判断企业战略的成败，有效兼顾短期绩效与长期绩效、短期发展与长期发展。②客户维度：客户价值包括产品和服务、关系和形象，是企业战略的核心。③内部管理维度：内部管理流程是支撑企业运营和客户价值创造的保障。④创新与学习维度：是企业发展最根本的决定因素，是平衡计分卡的基点。注意：财务是“核心”、创新与学习是“基点”，两者不可互换。\n（3）作用。①战略落实：通过平衡计分卡把企业整体战略层层细化为可量化的指标，落实到每个部门和每个员工，使员工明晰责任和绩效考核指标，形成“阐述使命与战略—改善沟通与联系—制定计划并确定目标体系—加强战略反馈和学习”的战略实施框架。②全面均衡：通过财务与非财务、长期与短期、结果性与动因性、内部群体与外部群体、反馈与同期和前馈五个方面的平衡，避免企业考核短期化、片面化、形式化。③战略控制：把战略的实施与控制联结起来，一方面对战略执行情况进行监控，保证战略的连贯性；另一方面对内外部环境变化进行监测，及时调整战略内容，保证战略的灵活性。\n（4）局限。四个方面的指标基本上是组织内部运营质量的反映，虽然考虑了客户这一外部因素，但缺乏对环境（E）、社会责任（S）和公司治理（G）的全面考虑，目标基本上还是股东价值最大化；当前ESG评价体系正成为组织发展与控制的重要方法。","e":"来源：第十三章第三节（教材p300—p305）。采分点：定义（人物、时间、四维度）2分＋四个维度4分＋作用3分＋局限1分。⚠必记：财务是“核心”、创新与学习是“基点”。","id":"mgmt-0561"},
{"ch":14,"t":"short","q":"论述：试论述风险的内涵、基本分类以及风险管理的基本目标。","a":"（1）风险的内涵。风险是指发生对组织不利事件的不确定性，包括事件发生的可能性及后果的大小。风险与危机既相区别又相联系：风险是危机的诱因，危机是风险积聚后的显性表现；但并非所有风险都会导致危机，只有危害积累到一定规模且破坏后果较严重时才形成危机。\n（2）基本分类。①按性质分为静态风险与动态风险；②按有无获利可能分为纯粹风险与投机风险，纯粹风险只有损失机会，投机风险既可能损失也可能获利；③按作用范围分为基本风险与特定风险。\n（3）风险管理的基本目标。风险管理是一项目标导向性的组织工作，其根本目标是力求以最小的成本支出来保障组织目标的实现；这里的成本包括组织在风险管理过程中投入的人力、物力、财力等资源以及机会成本。具体目标分为两个方面：\n①损失前目标（风险事故尚未出现时，尽可能防范风险事故发生，确保组织正常运营）：第一，经济目标，以经济合理的方式预防潜在损失，既不能为规避风险而不计代价，也不能吝啬必要的预防费用；第二，合法性目标，认真审视与自身经营活动相关的法律法规并严格遵循；第三，社会责任目标，关注利益相关者利益，认真履行社会责任。\n②损失后目标（风险事故发生后，努力降低影响，尽快恢复正常运营）：第一，生存目标，充分考虑损失事件对运营和生存的影响程度，确保在合理时间内部分或全部恢复经营运作；第二，持续经营目标，不因损失事件使经营运作中断，公用事业单位尤其要保证服务不间断；第三，收益稳定目标，消除风险事故的不利影响，实现收益的连续和稳定；第四，社会责任目标，尽量减轻损失事件对利益相关者的不利影响，树立良好的社会形象。\n（4）风险管理讲究成本—收益权衡，追求风险管理成本小于风险事故带来的潜在损失，即收益大于成本。","e":"来源：第十四章第一节 风险识别与分析、第二节 风险评估与控制（教材p316—p326）。采分点：定义2分＋三类分类2分＋根本目标1分＋损失前目标3分＋损失后目标4分。口诀：损失前“经合社”、损失后“生持收社”；注意“社会责任目标”损失前后都有。","id":"mgmt-0562"},
{"ch":14,"t":"short","q":"论述：试论述危机管理的基本过程及各阶段的主要内容。","a":"（1）危机的含义与特征。危机是指突发的、严重影响组织的生存与发展的一种状态，具有突发性、危害性、紧迫性和决策信息不充分四个特征（第二版将第一版的“信息资源不充分”改为“决策信息不充分”）。危机与风险相区别：风险是损失的不确定性，危机是可能带来严重破坏后果的突发事件；风险是危机的诱因，危机是风险积聚后的显性表现，但并非所有风险都会导致危机。危机虽然较为突然和出人意料，但并非毫无征兆，有从量变到质变的累积过程，因此是可以预警的。\n（2）危机管理的基本过程可以概括为危机预警、危机反应、恢复管理和危机评估四个阶段，口诀“警应恢评”。\n①危机预警。危机预警就是组织在持续的资料收集基础上，根据相关资料和数据预测危机可能发生的情况并进行危机等级判定，在危机发生前发出相应警报，使相关部门及人员提前采取预防与应对措施。危机预警系统一般由信息收集子系统、信息加工子系统、信息决策子系统和警报子系统构成（口诀“收加决警”）。同时要做好危机应对的准备工作：危机管理小组的设立、危机预案的制定、危机预案的演练、危机管理意识的培训、各种物资的储备（口诀“组案练训物”）。\n②危机反应。要求及时反应、立刻启动应急预案、在短时间内遏制危机蔓延、防止损失扩大或事态升级。有效的危机反应包括四项内容：建立危机处理小组（危机管理的最高权力机构和协调机构、统一指挥中心）、启动应急预案或制定新的方案、隔离危机（危害隔离与人员隔离）、及时发布真实信息。\n③恢复管理。危机得到有效控制或平息后，迅速挽回损失、完善组织管理，修复物质生产、组织形象和员工心理三方面的损害。包括四项内容：建立危机恢复小组、获取危机处理信息、制定并实施危机恢复计划、危机评估与组织发展。\n④危机评估与组织发展。对危机的成因、危害、预防与预警情况、处理措施与执行情况、危机后的反馈与重建工作展开调查与分析，总结经验教训、为今后危机管理提供借鉴，并尽量发掘危机中的机会，化危为机，提升管理能力和发展水平。\n（3）意义。危机管理构成“预警—反应—恢复—评估”的完整闭环，是组织可持续发展的重要保障。","e":"来源：第十四章第三节 危机管理（教材p326—p334）。采分点：危机定义与四特征2分＋预警（四子系统＋准备工作）3分＋反应（四项内容）2分＋恢复（四项内容）2分＋评估与意义1分。⚠三个小组务必区分：危机管理小组（危机前设立）／危机处理小组（危机发生后成立）／危机恢复小组（危机平息后成立）。","id":"mgmt-0563"},
{"ch":13,"t":"case","q":"某省土地整治工程集团承担全省高标准农田建设与土地复垦项目，下设8个区域分公司和20余个项目部，员工3000余人。近年来公司规模快速扩张，但出现工程质量抽检合格率波动、个别项目偷工减料、区域公司之间推诿扯皮、员工对客户（地方政府与农民）诉求响应迟缓等问题。集团决定重构管理体系：在集团层面建立统一的预算制度和审计制度，对区域公司实行内部结算与利润中心考核，同时提炼“耕地守护者”的企业价值观并开展团队建设；集团还引入平衡计分卡，把战略目标分解到各区域公司和项目部，并将质量管理贯穿从项目立项、勘察设计、材料采购、施工验收到后期管护的全过程，要求全员参与、各部门协同。\n问题：","a":"答案要点见各小问参考答案。","sub":[{"q":"（1）该集团重构管理体系中分别运用了哪三种控制方法？请结合案例说明。（6分）","a":"①层级控制：集团层面建立统一的预算制度和审计制度，利用正式的章程、规则、政策、标准、科层权力、书面文件等科层机制规范各区域公司和项目部的行为并评估绩效，常见的层级控制方法即预算控制、审计控制和财务控制。②市场控制：对区域公司实行内部结算、按利润中心考核，借助经济的力量通过价格机制激发各部门的积极性，核心是构建组织内部的市场关系，激发员工在经济利益方面的追求。③团体控制：提炼“耕地守护者”的企业价值观并开展团队建设，把个体融入团体，使个人价值观与组织价值观和目标相统一，通过共同行为范式实现员工的自我约束和自我控制。（每点2分：方法判断1分＋案例对应1分）"},{"q":"（2）请运用平衡计分卡的四个维度，为该集团设计业绩评价指标。（6分）","a":"①财务维度（所有层面目标和指标的核心）：营业收入增长率、项目毛利率、成本费用降低率、资本报酬率、现金流等，用以判断收入是否增长、效率是否提高及战略成败。②客户维度（企业战略的核心）：政府主管部门满意度、农民与村集体满意度、工程验收一次合格率、客户投诉处理及时率、按期交付率。③内部管理维度（运营与客户价值创造的保障）：土地整治工程质量抽检合格率、施工安全事故事件数、材料采购合规率、标准化作业程序执行率、项目进度偏差率。④创新与学习维度（平衡计分卡的基点）：员工培训计划完成率、技术人员持证率、新技术新工艺应用项数、关键员工流失率、学习型组织建设情况。（每个维度指标合理各1.5分；答出“财务是核心、创新与学习是基点”可加1分）"},{"q":"（3）结合全面质量管理“三全一多”，提出提升工程质量的具体建议。（4分）","a":"①全过程的质量管理：把影响质量的所有环节和因素都控制起来，从项目立项、勘察设计、材料采购、施工建设到竣工验收和后期管护实施全过程质量控制。②全员的质量管理：质量控制要扩展到组织的所有人员，加强质量意识培训，建立质量责任制，把质量指标纳入绩效考核。③全组织的质量管理：从组织的纵、横两方面保证质量不断提升，集团、区域公司、项目部上下联动，工程、技术、财务、采购等部门协同配合。④多方法的质量管理：应用一切可以运用的方法，如统计质量控制、PDCA循环、六西格玛、质量标杆对比等。（每点1分）"}],"e":"【答题思路】本题以土地整治工程集团为背景，综合考查控制的方法（层级／市场／团体控制）、平衡计分卡四维度与全面质量管理“三全一多”。第一问必须先准确写出三种控制方法的名称，再点出案例中的对应做法，不能只抄案例；第二问按四个维度分述指标，注意财务是“核心”、创新与学习是“基点”；第三问直接套用“三全一多”并结合工程质量展开，落点要具体。","id":"mgmt-0564"},
{"ch":14,"t":"case","q":"某县在山区实施土地整治与高标准农田建设项目，项目区位于暴雨多发地带，部分施工标段紧邻滑坡隐患点。项目开工前，县自然资源局与施工单位仅凭经验简单估算风险，未编制完整的风险清单，也未建立与气象、应急管理部门的联动机制。2024年汛期，连续强降雨引发一处边坡滑坡，冲毁在建田间道路和灌溉渠道，2名施工人员受伤，项目被迫停工，部分村民对赔偿方案不满并在网络上发布负面信息，形成舆情危机。事后调查发现，隐患点此前已有裂缝征兆，但未被识别和上报。\n问题：","a":"答案要点见各小问参考答案。","sub":[{"q":"（1）结合案例，说明该项目在风险识别与风险评估方面存在哪些问题，并列举可用的风险识别方法。（6分）","a":"①存在的问题：风险识别不全面，未编制风险清单，滑坡隐患点已有的裂缝征兆未被识别和上报，说明缺少持续的风险识别；风险识别与评估方法单一，仅凭经验简单估算，未采用定性分析与定量分析相结合的评估方法；未建立与气象、应急管理部门的联动机制，信息收集不及时，预警缺失，也没有开展情景分析等评估工作。②可用的风险识别方法：现场调查法、审核表调查法、组织结构图示法、流程图法、财务报表分析法（口诀“现审组流财”）；补充方法有事故树分析法、情景分析法、危险与可操作性研究等。（问题诊断3分，方法3分）"},{"q":"（2）请针对滑坡风险，说明可采用的四种风险控制策略。（4分）","a":"①风险避免：对损失频率和损失程度都较大、且损失后果无法得到补偿的标段，通过调整选址、变更设计避开滑坡隐患点，必要时中止或放弃该标段的施工。②风险分担：通过工程保险（建筑工程一切险、施工人员意外伤害险等）把风险部分或全部转移给保险公司，也可借助专业分包和合同条款将部分风险转移给有相应能力的单位。③损失减低管理：有意识地接受风险，通过分散作业面、设置边坡位移监测点、雨季前加固护坡与开挖截水沟、雨天限制施工等措施，化大风险为小风险。④风险保留：对影响较小的风险由项目单位自行承担，并做好资源安排，如预留应急资金和抢险物资。（每点1分）"},{"q":"（3）请运用危机管理的基本过程，为该县提出应对此次滑坡事件的措施。（5分）","a":"①危机预警：建立健全危机预警系统，由信息收集、信息加工、信息决策和警报四个子系统构成，与气象、应急管理部门建立信息联动并运用大数据分析，对隐患点裂缝等征兆及时识别、上报并发出警报；同时做好危机管理小组的设立、危机预案的制定、预案演练、危机意识培训和物资储备等准备工作。②危机反应：按预案迅速成立危机处理小组作为最高权力机构和协调机构统一指挥，启动应急预案或制定新的方案，及时抢救受伤人员、疏散人员并隔离危险区域（危害隔离与人员隔离），及时发布真实信息，避免谣言和负面舆情扩大。③恢复管理：成立危机恢复小组，客观公正地评价道路、渠道、人员及利益相关者的受损情况，制定并实施危机恢复计划，尽快恢复施工和群众生产生活秩序，修复组织形象和员工心理。④危机评估与组织发展：对危机的成因、危害、预防与预警情况、处理措施与执行情况、危机后的反馈与重建工作进行调查、评价和总结，完善风险清单与应急机制，化危为机。（每点1分，措施结合案例具体可行另加1分）"}],"e":"【答题思路】本题以山区土地整治工程为背景，综合考查风险识别与评估的方法、四种风险控制策略以及危机管理四阶段（预警—反应—恢复—评估）。第一问先诊断问题（识别不全、方法单一、预警缺失），再列举识别方法；第二问要把“避免、分担、损失减低、保留”四种策略落到滑坡治理的具体措施上，切忌只写名称；第三问按危机管理四个阶段展开，注意区分危机管理小组（危机前）、危机处理小组（危机中）、危机恢复小组（危机后）。","id":"mgmt-0565"},
{"ch":6,"t":"short","q":"论述：试述组织设计的基本原则，并说明管理幅度与管理层次的关系及其对组织设计的影响。","a":"（1）组织设计的基本原则（五项）：\n①目标一致原则——组织结构的设计必须有利于组织目标的实现，做到以事定岗、以岗定人，避免因人设事、因事设人；\n②分工与协作原则——既要通过分工提高专业化水平和效率，又要通过协作把分工后的各岗位、各单位联结为有机整体；\n③有效管理幅度原则——管理者能够有效监督、指挥的下属人数是有限的，管理幅度必须适度；\n④权责对等原则——管理者拥有的权力应与其承担的责任相适应，有权无责会导致滥用权力，有责无权则无法开展工作；\n⑤柔性经济原则——组织结构既要保持一定稳定性，又要能随环境变化灵活调整，并以尽可能低的成本实现组织目标。\n（2）管理幅度与管理层次的关系：\n①在组织规模既定的条件下，管理幅度与管理层次成反比：管理幅度越大，管理层次越少；管理幅度越小，管理层次越多。\n②管理幅度过宽，管理者受时间与精力限制，易出现指挥监督不到位、信息沟通失真；管理幅度过窄，则层次增多，导致管理费用上升、信息传递变慢且失真加剧。\n（3）对组织设计的影响：\n①形成两种结构形态：幅度宽、层次少为扁平结构，信息链短、反应快、利于发挥下属主动性；幅度窄、层次多为高耸结构，控制严密但成本高、反应慢。\n②组织设计应在幅度与层次之间寻求适度平衡，并结合环境、战略、技术、规模与生命周期等因素综合确定。\n③现代组织结构演变趋势为扁平化、柔性化、无边界化和虚拟化，正是在信息化条件下适度扩大管理幅度、减少管理层次以提高效率与适应性的体现。","e":"来源：第六章第一节（组织设计的原则）、第三节（管理幅度设计）。答题提示：先分条列出五项原则各作一句解释，再点明\"规模既定下幅度与层次成反比\"，最后落到扁平化/高耸化的利弊与现代演变趋势；结合案例更佳。","id":"mgmt-0566"}

var DATA_VERSION_KEY = 'mgmt_data_version';
var DATA_VERSION = '5';
var WRONG_KEY = 'mgmt_wrong_v7';
var PROG_KEY  = 'mgmt_prog_v7';
var MARK_KEY  = 'mgmt_mark_v7';
var CASE_POOL_KEY  = 'mgmt_case_pool_v1';
var ESSAY_POOL_KEY = 'mgmt_essay_pool_v1';
var EXAM_COUNT_KEY = 'mgmt_exam_count_v1';
var SESSION_KEY = 'mgmt_session_v1';
var REVIEW_KEY = 'mgmt_review_v1';
var DAY = 24 * 60 * 60 * 1000;

function saveSession() {
  try {
    if (!state.queue || !state.queue.length || state.mode === 'exam') return;
    var payload = {
      queue: state.queue, idx: state.idx, answers: state.answers, answered: state.answered,
      title: state.title, view: 'question', ts: Date.now()
    };
    localStorage.setItem(SESSION_KEY, JSON.stringify(payload));
    paintSessionCard();
  } catch (e) {}
}
function readSession() {
  try {
    var s = localStorage.getItem(SESSION_KEY);
    if (!s) return null;
    var o = JSON.parse(s);
    if (!o || !Array.isArray(o.queue) || !o.queue.length) return null;
    return o;
  } catch (e) { return null; }
}
function clearSession() { try { localStorage.removeItem(SESSION_KEY); } catch (e) {} paintSessionCard(); }
function sessionAlive() {
  var o = readSession();
  if (!o) return false;
  for (var i = 0; i < o.queue.length; i++) { if (getQ(o.queue[i])) return true; }
  return false;
}
function paintSessionCard() {
  var el = document.getElementById('sessionCard');
  if (!el) return;
  var o = readSession();
  if (!o || !sessionAlive()) { el.innerHTML = ''; return; }
  var done = 0;
  for (var k in o.answered) { if (o.answered[k]) done++; }
  var d = new Date(o.ts || Date.now());
  var hh = d.getHours(), mm = d.getMinutes();
  el.innerHTML = '<div class="card" onclick="App.resumeSession()">' +
    '<div class="icon ic5">续</div><div class="txt"><h3>继续上次练习</h3>' +
    '<p>' + esc(o.title || '练习') + ' · 第 ' + ((o.idx || 0) + 1) + '/' + o.queue.length + ' 题 · 已答 ' + done + ' 题 · ' +
    (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm + '</p></div>' +
    '<div class="arrow">›</div></div>';
}

// 题库升级只清理已经不存在的题号，保留用户历史进度
(function(){
  try {
    var old = localStorage.getItem(DATA_VERSION_KEY);
    if (old !== DATA_VERSION) {
      [WRONG_KEY, CASE_POOL_KEY, ESSAY_POOL_KEY].forEach(function(k){
        var a = JSON.parse(localStorage.getItem(k) || '[]');
        if (Array.isArray(a)) localStorage.setItem(k, JSON.stringify(a.filter(function(id){ return !!getQ(String(id)); })));
      });
      var marks = JSON.parse(localStorage.getItem(MARK_KEY) || '{}');
      for (var id in marks) { if (!getQ(String(id))) delete marks[id]; }
      localStorage.setItem(MARK_KEY, JSON.stringify(marks));
      localStorage.setItem(DATA_VERSION_KEY, DATA_VERSION);
    }
  } catch(e) {}
})();

function getWrong() { try { var s = localStorage.getItem(WRONG_KEY); if (!s) return []; var a = JSON.parse(s); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
function setWrong(arr) { try { localStorage.setItem(WRONG_KEY, JSON.stringify(arr)); } catch (e) { storageWarn(); } }
var __storageWarned = false;
function storageWarn() {
  if (__storageWarned) return; __storageWarned = true;
  try { console.warn('localStorage 写入失败，进度/错题可能无法保存（可能处于无痕模式或空间不足）'); } catch (_) {}
}
function addWrong(id) { var w = getWrong(); if (w.indexOf(id) < 0) { w.push(id); setWrong(w); } }
function removeWrong(id) { var w = getWrong(); var n = []; for (var i = 0; i < w.length; i++) { if (w[i] !== id) n.push(w[i]); } setWrong(n); }
function getProg() { try { return parseInt(localStorage.getItem(PROG_KEY) || '0', 10) || 0; } catch (e) { return 0; } }
function setProg(n) { try { localStorage.setItem(PROG_KEY, String(n)); } catch (e) {} }
function getMarked() { try { var s = localStorage.getItem(MARK_KEY); if (!s) return {}; var a = JSON.parse(s); return a || {}; } catch (e) { return {}; } }
function setMarked(obj) { try { localStorage.setItem(MARK_KEY, JSON.stringify(obj)); } catch (e) {} }

function getReview() { try { var s = localStorage.getItem(REVIEW_KEY); return s ? (JSON.parse(s) || {}) : {}; } catch (e) { return {}; } }
function setReview(obj) { try { localStorage.setItem(REVIEW_KEY, JSON.stringify(obj)); } catch (e) { storageWarn(); } }
function getReviewItem(id) { var all = getReview(); return all[id] || null; }
function nextStudyDay(days) {
  var d = new Date(); d.setHours(5, 0, 0, 0); d.setDate(d.getDate() + days); return d.getTime();
}
function recordAttempt(id, quality) {
  id = String(id); quality = Number(quality);
  var all = getReview();
  var r = all[id] || {attempts:0, correct:0, streak:0, lapses:0, interval:0, due:0, last:0};
  r.attempts++; r.last = Date.now();
  if (quality >= 2) {
    r.correct++; r.streak++;
    var steps = [1, 3, 7, 14, 30, 60];
    r.interval = steps[Math.min(r.streak - 1, steps.length - 1)];
    r.due = nextStudyDay(r.interval);
    if (r.streak >= 2) removeWrong(id);
  } else if (quality === 1) {
    r.streak = 0; r.interval = 1; r.due = nextStudyDay(1); addWrong(id);
  } else {
    r.streak = 0; r.lapses++; r.interval = 0; r.due = Date.now() + 10 * 60 * 1000; addWrong(id);
  }
  all[id] = r; setReview(all); return r;
}
function reviewSummary() {
  var all = getReview(), now = Date.now(), out = {attempts:0,correct:0,due:0,mastered:0,seen:0};
  for (var id in all) {
    if (!getQ(id)) continue;
    var r = all[id] || {}; out.seen++; out.attempts += r.attempts || 0; out.correct += r.correct || 0;
    if (r.due && r.due <= now) out.due++;
    if ((r.streak || 0) >= 3 && (r.interval || 0) >= 7) out.mastered++;

  out.accuracy = out.attempts ? Math.round(out.correct / out.attempts * 100) : 0;

}
function interleaveIds(ids) {
  var groups = {}, result = [], seen = {};
  for (var i = 0; i < ids.length; i++) {
    var id = String(ids[i]), q = getQ(id); if (!q || seen[id]) continue; seen[id] = 1;
    var key = q.ch + '-' + effTypeOf(q); if (!groups[key]) groups[key] = []; groups[key].push(id);
  }
  var keys = Object.keys(groups); shuffle(keys); for (var k = 0; k < keys.length; k++) shuffle(groups[keys[k]]);
  while (keys.length) {
    for (var x = keys.length - 1; x >= 0; x--) {

}
function buildTodayQueue(limit) {
  limit = limit || 30; var now = Date.now(), all = getReview(), score = {}, ids = [];
  function push(id, s) { id = String(id); var q = getQ(id); if (!q || q.ch < 1 || q.ch > 16) return; if (score[id] === undefined || s > score[id]) score[id] = s; }
  var wrong = getWrong(); for (var i = 0; i < wrong.length; i++) push(wrong[i], 400);
  for (var id in all) { var r = all[id] || {}; if (r.due && r.due <= now) push(id, 500 + (r.lapses || 0)); }
  var marks = getMarked(); for (var mid in marks) { if (marks[mid]) push(mid, 300); }

    var q = BANK[b]; if (q.ch < 1 || q.ch > 16) continue;
    var rr = all[q.id]; if (!rr) push(q.id, 100 + Math.random());

  }
  ids = Object.keys(score).sort(function(a,b){ return score[b] - score[a]; }).slice(0, limit);
  return interleaveIds(ids);
}

function chapterName(ch) { for (var i = 0; i < CHAPTERS.length; i++) { if (CHAPTERS[i].id === ch) return CHAPTERS[i].name; } return ''; }
function typeName(t) {

function typeClass(t) {

  if (t === 'term') return 't-term'; if (t === 'short') return 't-short'; if (t === 'essay') return 't-essay';
  if (t === 'case') return 't-case';

function isEssayQuestion(q) {

          html += '<div style="font-weight:700;color:#9d174d;font-size:14.5px;margin-bottom:6px">' + esc(q.sub[k].q) + '</div>';

        }

      }
    }

    html += '</div>';

function isCorrect(q, ans) {
  if (q.t === 'single') return ans === q.a;
  if (q.t === 'multi') {
    if (!Array.isArray(ans)) return false;
    var a = ans.slice().sort(function(x, y) { return x - y; });
    var b = (Array.isArray(q.a) ? q.a.slice() : []).sort(function(x, y) { return x - y; });
    if (a.length !== b.length) return false;
    for (var i = 0; i < a.length; i++) { if (a[i] !== b[i]) return false; }
    return true;
  }
  if (q.t === 'judge') return ans === q.a;
  return null;
}

function buildWeakChapters(title) {
  var html = '';
  var chapterStats = {};
  for (var i = 0; i < state.queue.length; i++) {
    var q = getQ(state.queue[i]);
    if (!q || q.t === 'term' || q.t === 'short' || q.t === 'case') continue;
    if (!chapterStats[q.ch]) chapterStats[q.ch] = {total: 0, correct: 0};
    chapterStats[q.ch].total++;
    if (isCorrect(q, state.answers[q.id])) chapterStats[q.ch].correct++;
  }
  var weak = [];
  for (var ch in chapterStats) {
    var st = chapterStats[ch];
    weak.push({ch: parseInt(ch, 10), rate: st.correct / st.total});
  }
  weak.sort(function(a, b) { return a.rate - b.rate; });
  if (weak.length > 0) {
    html += '<div class="weak-chapters"><h4>' + title + '</h4>';
    for (var w = 0; w < Math.min(weak.length, 6); w++) {
      var item = weak[w];
      var p = Math.round(item.rate * 100);
      html += '<div class="weak-bar"><div class="name">' + esc(chapterName(item.ch)) + '</div>';
      html += '<div class="bar-bg"><div class="bar-fill" style="width:' + p + '%"></div></div>';
      html += '<div class="pct">' + p + '%</div></div>';
    }
    html += '</div>';
  }
  return html;
}

function answerBlock(q){
  var h='';
  var letters=[];
  if(q.t==='single') letters.push(String.fromCharCode(65+q.a));
  else if(q.t==='multi'){for(var m=0;m<q.a.length;m++) letters.push(String.fromCharCode(65+q.a[m]));}
  else if(q.t==='judge') letters.push(q.a?'正确':'错误');
  if(letters.length) h+='<div class="meta" style="margin-top:8px"><span class="tag ok">正确答案：'+letters.join('、')+'</span></div>';
  if(q.t==='term'||q.t==='short'){h+='<div class="ansline" style="margin-top:10px">参考答案</div><div class="ansbox">'+esc(q.a)+'</div>';}
  if(q.t==='case'&&q.sub&&q.sub.length){for(var z=0;z<q.sub.length;z++){h+='<div style="margin-top:10px;font-weight:700;color:#9d174d;font-size:13.5px">'+esc(q.sub[z].q)+'</div><div class="ansbox" style="border-color:#fbcfe8">'+esc(q.sub[z].a)+'</div>';}}
  if(q.e) h+='<div style="margin-top:8px;font-size:14px;color:#4b5563;line-height:1.7">'+esc(q.e)+'</div>';
  return h;
}

function buildWrongList(list, allCorrectText) {
  var html = '';
  if (list && list.length) {
    html += '<h3 style="font-size:16px;margin:22px 0 12px;color:#111827">错题回顾（' + list.length + '）</h3>';
    for (var j = 0; j < list.length; j++) {
      var q2 = getQ(list[j]);
      if (!q2) continue;
      html += '<div class="wrongitem"><div class="qt">' + (j + 1) + '. ' + esc(q2.q) + '</div>';
      var letters = [];
      if (q2.t === 'single') letters.push(String.fromCharCode(65 + q2.a));
      else if (q2.t === 'multi') for (var mm = 0; mm < q2.a.length; mm++) letters.push(String.fromCharCode(65 + q2.a[mm]));
      else if (q2.t === 'judge') letters.push(q2.a ? '正确' : '错误');
      if (letters.length) html += '<div class="meta"><span class="tag ok">正确答案：' + letters.join('、') + '</span><span class="tag">' + typeName(q2.t) + '</span></div>';
      if (q2.e) html += '<div style="margin-top:8px;font-size:14px;color:#4b5563;line-height:1.7">' + esc(q2.e) + '</div>';
      html += '</div>';
    }
  } else {
    html += '<div class="empty" style="padding:40px 20px"><div class="big">🏆</div>' + allCorrectText + '</div>';
  }
  return html;
}

    if (state.view === 'question') {

          state.mode = 'practice'; state.exam = null; state.view = 'home'; render();
        }
        return;
      }
      if (state.title && state.title.indexOf('章节') >= 0) state.view = 'chapterList';
      else if (state.title && state.title.indexOf('错题') >= 0) state.view = 'wrong';
      else if (state.title && state.title.indexOf('标记') >= 0) state.view = 'marked';
      else if (state.title && state.title.indexOf('专项') >= 0) state.view = 'typeSelect';
      else state.view = 'home';
      render(); return;
    }
    if (state.view === 'notes') { state.view = 'landing'; render(); return; }
    if (state.view === 'landing') { render(); return; }
    if (state.view === 'chapterList' || state.view === 'typeSelect' || state.view === 'wrong' || state.view === 'marked' || state.view === 'examStart' || state.view === 'examResult') {
      state.view = 'home'; state.mode = 'practice'; state.exam = null; render(); return;
    }
    state.view = 'home'; render();
  },
  clearTimer: function() { if (state.timerId) { clearTimeout(state.timerId); state.timerId = null; } },

  toggleTheme: function() {
    var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    var next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('mgmt_theme', next); } catch (e) {}
  },
  toggleKbd: function(force) {
    var el = document.getElementById('kbdPanel');
    if (!el) return;
    var show = (force === undefined) ? !el.classList.contains('show') : force;
    if (show) el.classList.add('show'); else el.classList.remove('show');
  },
  resumeSession: function() {
    var o = readSession();
    if (!o) { alert('没有可继续的练习'); return; }
    var ids = [];
    for (var i = 0; i < o.queue.length; i++) { if (getQ(o.queue[i])) ids.push(o.queue[i]); }
    if (!ids.length) { clearSession(); alert('上次练习的题目已失效，请重新开始'); return; }
    state.queue = ids;
    state.idx = Math.min(Math.max(0, o.idx || 0), ids.length - 1);
    state.answers = o.answers || {}; state.answered = o.answered || {};
    state.marked = getMarked();
    state.mode = 'practice'; state.title = o.title || '练习'; state.view = 'question';
    render();
  },
  startToday: function() {

  beginExam: function() {
    var cfg = EXAM_MODES[state.examMode] || EXAM_MODES.A;
    var singles = [], multis = [], judges = [], terms = [], shorts = [], essays = [], cases = [];
    for (var i = 0; i < BANK.length; i++) {
      if (BANK[i].ch < 1 || BANK[i].ch > 16) continue;
      var t = BANK[i].t;
      if (t === 'single') singles.push(BANK[i].id);
      else if (t === 'multi') multis.push(BANK[i].id);
      else if (t === 'judge') judges.push(BANK[i].id);
      else if (t === 'term') terms.push(BANK[i].id);
      else if (t === 'short') {
        if (isEssayQuestion(BANK[i])) essays.push(BANK[i].id);
        else shorts.push(BANK[i].id);
      }
      else if (t === 'case') cases.push(BANK[i].id);
    }
    function takeBalanced(arr, wanted) {
      var groups = {};
      for (var i = 0; i < arr.length; i++) {
        var q = getQ(arr[i]);
        if (!q) continue;
        if (!groups[q.ch]) groups[q.ch] = [];
        groups[q.ch].push(arr[i]);
      }
      var result = [];
      var keys = Object.keys(groups); shuffle(keys);
      for (var kk = 0; kk < keys.length; kk++) shuffle(groups[keys[kk]]);
      while (result.length < wanted && keys.length) {
        for (var k = keys.length - 1; k >= 0 && result.length < wanted; k--) {
          var key = keys[k];
          if (groups[key].length) result.push(groups[key].shift());
          if (!groups[key].length) keys.splice(k, 1);
        }
      }
      return result;
    }
    var pick = [];
    if (cfg.counts.single) pick = pick.concat(takeBalanced(singles, cfg.counts.single));
    if (cfg.counts.multi) pick = pick.concat(takeBalanced(multis, cfg.counts.multi));
    if (cfg.counts.judge) pick = pick.concat(takeBalanced(judges, cfg.counts.judge));
    if (cfg.counts.term) pick = pick.concat(takeBalanced(terms, cfg.counts.term));
    if (cfg.counts.short) pick = pick.concat(takeBalanced(shorts, cfg.counts.short));
    if (cfg.counts.essay) {
      var alreadyPicked = {};
      for (var ap = 0; ap < pick.length; ap++) alreadyPicked[pick[ap]] = true;
      var essayId = pickFromPool(essays, ESSAY_POOL_KEY, alreadyPicked);
      if (essayId !== null && essayId !== undefined && getQ(essayId)) pick = pick.concat([essayId]);
    }
    if (cfg.counts.case) {
      var alreadyPickedCase = {};
      for (var ac = 0; ac < pick.length; ac++) alreadyPickedCase[pick[ac]] = true;
      var caseId = pickFromPool(cases, CASE_POOL_KEY, alreadyPickedCase);
      if (caseId !== null && caseId !== undefined && getQ(caseId)) pick = pick.concat([caseId]);
    }
    App.clearTimer();
    state.queue = pick; state.idx = 0; state.answers = {}; state.answered = {}; state.marked = getMarked();
    state.mode = 'exam'; state.title = '模拟自测 · ' + cfg.name; state.view = 'question'; clearSession();
    state.exam = { mode: state.examMode, cfg: cfg, endTime: Date.now() + cfg.minutes * 60 * 1000 };
    render(); App.tick();
  },
  tick: function() {
    App.clearTimer();

    var left = state.exam.endTime - Date.now();
    if (left <= 0) { alert('考试时间到，系统将自动交卷。'); App.submitExam(); return; }
    var m = Math.floor(left / 60000);
    var s = Math.floor((left % 60000) / 1000);
    tbExtra.textContent = m + ':' + (s < 10 ? '0' : '') + s;
    state.timerId = setTimeout(App.tick, 500);
  },
  submitExam: function() {
    if (!state.exam) return;
    var unanswered = 0;
    for (var i = 0; i < state.queue.length; i++) { if (!state.answered[state.queue[i]]) unanswered++; }
    if (unanswered > 0) { if (!confirm('还有 ' + unanswered + ' 题未作答，确定要交卷吗？')) return; }
    else { if (!confirm('确定要交卷吗？')) return; }
    App.clearTimer();
    var cfg = state.exam.cfg || EXAM_MODES.A;
    var objCorrect = 0, objCount = 0, objScore = 0;
    var wrongList = [], subjList = [];
    for (var j = 0; j < state.queue.length; j++) {
      var q = getQ(state.queue[j]); if (!q) continue;
      var et = effTypeOf(q);
      if (et === 'term' || et === 'short' || et === 'essay' || et === 'case') {
        var maxPt = cfg.points[et] || 0;
        subjList.push({id: q.id, t: et, q: q.q, a: q.a, e: q.e || '', sub: q.sub || null, ch: q.ch, max: maxPt});
        continue;
      }
      objCount++;
      var ok = isCorrect(q, state.answers[q.id]);
      recordAttempt(q.id, ok ? 2 : 0);
      if (ok) {
        objCorrect++;
        if (cfg.pct) objScore += 1; else objScore += (cfg.points[q.t] || 0);
      } else {
        wrongList.push(q.id); addWrong(q.id);
      }
    }
    if (cfg.pct) objScore = objCount ? Math.round(objCorrect / objCount * 100) : 0;
    state.subjScores = {};
    state.result = { total: state.queue.length, correct: objCorrect, objCount: objCount, wrongList: wrongList,
                     objectiveScore: objScore, subj: subjList, cfg: cfg, mode: state.examMode };
    state.mode = 'practice'; state.exam = null; tbExtra.textContent = '';
    state.view = 'examResult'; render();
  }
};

function getExamCount() {
  try { return parseInt(localStorage.getItem(EXAM_COUNT_KEY) || '0', 10) || 0; }
  catch (e) { return 0; }
}
function setExamCount(n) {
  try { localStorage.setItem(EXAM_COUNT_KEY, String(n)); } catch (e) {}
}
function getPool(key) {
  try {
    var ps = localStorage.getItem(key); if (!ps) return [];
    var pa = JSON.parse(ps); return Array.isArray(pa) ? pa : [];
  } catch (e) { return []; }
}
function setPool(key, arr) {
  try { localStorage.setItem(key, JSON.stringify(arr)); } catch (e) {}
}
function pickFromPool(sourceIds, poolKey, alreadyPicked) {
  var freshSrc = [];
  for (var i = 0; i < sourceIds.length; i++) {
    if (!alreadyPicked || !alreadyPicked[sourceIds[i]]) freshSrc.push(sourceIds[i]);
  }
  if (!freshSrc.length) freshSrc = sourceIds.slice();
  if (!freshSrc.length) return null;
  var used = getPool(poolKey);
  var avail = [];
  for (var j = 0; j < freshSrc.length; j++) {
    if (used.indexOf(freshSrc[j]) < 0) avail.push(freshSrc[j]);
  }
  if (!avail.length) {
    used = [];
    avail = freshSrc.slice();
  }
  shuffle(avail);
  var picked = avail[0];
  used.push(picked);
  setPool(poolKey, used);
  return picked;
}
function pickLastBigQuestion(cases, shorts, alreadyPicked) {
  var examIdx = getExamCount() + 1;
  setExamCount(examIdx);
  var isOdd = (examIdx % 2 === 1);
  var poolKey = isOdd ? CASE_POOL_KEY : ESSAY_POOL_KEY;
  var sourceIds;
  if (isOdd) {
    sourceIds = cases.slice();
  } else {
    sourceIds = [];
    for (var i = 0; i < shorts.length; i++) {
      var q = getQ(shorts[i]);
      if (isEssayQuestion(q)) sourceIds.push(shorts[i]);
    }
    if (!sourceIds.length) {
      sourceIds = shorts.slice();
    }
  }
  var freshSrc = [];
  for (var j = 0; j < sourceIds.length; j++) {
    if (!alreadyPicked[sourceIds[j]]) freshSrc.push(sourceIds[j]);
  }
  if (!freshSrc.length) freshSrc = sourceIds.slice();
  var used = getPool(poolKey);
  var avail = [];
  for (var k = 0; k < freshSrc.length; k++) {
    if (used.indexOf(freshSrc[k]) < 0) avail.push(freshSrc[k]);
  }
  if (!avail.length) {
    used = [];
    avail = freshSrc.slice();
  }
  if (!avail.length) {
    if (!sourceIds.length) return null;
    return sourceIds[Math.floor(Math.random() * sourceIds.length)];
  }
  shuffle(avail);
  var picked = avail[0];
  used.push(picked);
  setPool(poolKey, used);
  return picked;
}
function shuffle(a) {
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function auditBank() {
  var problems = [];
  var seen = {};
  for (var i = 0; i < BANK.length; i++) {
    var q = BANK[i];
    if (seen[q.id]) problems.push('重复题号: ' + q.id);
    seen[q.id] = 1;
    if (q.t === 'single' && (typeof q.a !== 'number' || q.a < 0 || q.a >= (q.o || []).length)) problems.push(q.id + ' 单选答案越界');
    if (q.t === 'multi') {
      if (!Array.isArray(q.a) || !q.a.length) problems.push(q.id + ' 多选答案非法');
      else if (q.a.length === (q.o || []).length) problems.push(q.id + ' 多选答案=全部选项');
    }
    if (q.t === 'case' && (!q.sub || !q.sub.length)) problems.push(q.id + ' 案例题缺少小问');
    if (q.t === 'term' && !q.a) problems.push(q.id + ' 名词解释缺答案');
  }
  return problems;
}
window.__auditBank = auditBank;

    box.textContent = '⚠️ 程序出现异常：' + (e.message || '未知错误') + '（已尽力保护已保存的数据；可刷新页面继续）';
    document.body.appendChild(box);
    setTimeout(function(){ if (box.parentNode) box.parentNode.removeChild(box); }, 8000);
  } catch (_) {}
});

window.addEventListener('beforeunload', function(e) {
  if (state.view === 'question' && state.mode === 'practice') { saveSession(); }
});

document.addEventListener('keydown', function(e) {
  if (state.view !== 'question') return;
  var tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  var q = curQ(); if (!q) return;
  var k = e.key;
  if (k >= '1' && k <= '9') {
    var i = parseInt(k, 10) - 1;
    if (q.o && i < q.o.length && !state.answered[q.id]) { App.choose(i); e.preventDefault(); }
    return;
  }
  if (q.t === 'judge' && (k === 'a' || k === 'A' || k === '1')) { if (!state.answered[q.id]) { App.chooseJudge(true); e.preventDefault(); } return; }
  if (q.t === 'judge' && (k === 'b' || k === 'B' || k === '2')) { if (!state.answered[q.id]) { App.chooseJudge(false); e.preventDefault(); } return; }
  if (q.t === 'judge' && (k === '对' || k === '错')) { if (!state.answered[q.id]) { App.chooseJudge(k === '对'); e.preventDefault(); } return; }
  if (k === 'ArrowRight' || k === ' ') { App.next(); e.preventDefault(); }
  else if (k === 'ArrowLeft') { App.prev(); e.preventDefault(); }
  else if (k === 'Enter') {
    if (q.t === 'multi' && !state.answered[q.id]) { App.confirmMulti(); e.preventDefault(); }
    else { App.next(); e.preventDefault(); }
  }
  else if (k === 'm' || k === 'M') { App.toggleMark(); e.preventDefault(); }
});

window.addEventListener('DOMContentLoaded', function() {
  viewEl = document.getElementById('view');
  tbTitle = document.getElementById('tbTitle');
  tbExtra = document.getElementById('tbExtra');
  btnBack = document.getElementById('btnBack');
  btnImmersive = document.getElementById('btnImmersive');
  state.marked = getMarked();
  try { var _th = localStorage.getItem('mgmt_theme'); if (_th === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
  state.view = 'landing';
  render();
});

window.addEventListener('beforeunload', function() {
  if (state.mode === 'exam') App.clearTimer();
});
</script>
