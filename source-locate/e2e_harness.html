<!doctype html>
<meta charset="utf-8">
<title>study-quiz e2e harness</title>
<pre id="result">RUNNING</pre>
<iframe id="app" src="../index.html" style="width:900px;height:1000px"></iframe>
<script>
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
const result = document.getElementById('result');
document.getElementById('app').addEventListener('load', async function run() {
  try {
    const w = this.contentWindow;
    await wait(150);
    w.App.startChapter(10);
    const targetIndex = w.state.queue.indexOf('mgmt-0334');
    if (targetIndex < 0) throw new Error('章节队列未包含 mgmt-0334');
    w.state.idx = targetIndex;
    w.state.answers['mgmt-0334'] = 'draft';
    w.state.answered['mgmt-0334'] = true;
    w.renderQuestion();
    w.scrollTo(0, Math.min(300, Math.max(0, w.document.documentElement.scrollHeight - w.innerHeight)));
    await wait(80);
    const sourceText = w.document.getElementById('srcDetail').textContent;
    if (!sourceText.includes('教材第238页') || !sourceText.includes('马斯洛需要层次理论及其局限')) throw new Error('教材出处面板内容错误');

    const snapshot = {
      qid: w.curQ().id, idx: w.state.idx, mode: w.state.mode, title: w.state.title,
      queue: JSON.stringify(w.state.queue), answers: JSON.stringify(w.state.answers), answered: JSON.stringify(w.state.answered),
      scrollY: w.pageYOffset || w.document.documentElement.scrollTop || 0
    };
    w.App.doViewNote();
    await wait(600);
    if (w.state.view !== 'notes' || !w.document.querySelector('.note-back-bar')) throw new Error('未进入对应笔记');
    if (!w.document.querySelector('.note-hl')) throw new Error('对应笔记段落未高亮');
    w.App.restoreFromNote();
    await wait(160);
    if (w.state.view !== 'question' || w.curQ().id !== snapshot.qid || w.state.idx !== snapshot.idx || w.state.mode !== snapshot.mode || w.state.title !== snapshot.title) throw new Error('返回后题目/模式/章节状态未恢复');
    if (JSON.stringify(w.state.queue) !== snapshot.queue || JSON.stringify(w.state.answers) !== snapshot.answers || JSON.stringify(w.state.answered) !== snapshot.answered) throw new Error('返回后答题进度未恢复');
    if (Math.abs((w.pageYOffset || w.document.documentElement.scrollTop || 0) - snapshot.scrollY) > 2) throw new Error('返回后滚动位置未恢复');

    const idx = w.buildSearchIndex(true);
    const pageTerms = w.searchTerms('p238');
    const pageQuestions = idx.qs.filter(x => w.matchAllTerms(x.hay, pageTerms)).length;
    const pageNotes = idx.ns.filter(x => w.matchAllTerms(x.hay, pageTerms)).length;
    const motivationTerms = w.searchTerms('激励理论');
    const motivationQuestions = idx.qs.filter(x => w.matchAllTerms(x.hay, motivationTerms)).length;
    const motivationNotes = idx.ns.filter(x => w.matchAllTerms(x.hay, motivationTerms)).length;
    if (!pageQuestions || !pageNotes || !motivationQuestions || !motivationNotes) throw new Error('页码或知识点搜索未同时命中题目和笔记');

    w.App.startChapter(1);
    if (w.state.queue.some(id => w.isExtension(w.getQ(id)))) throw new Error('章节核心练习混入拓展题');
    result.textContent = JSON.stringify({
      status: 'PASS', restoredQuestion: snapshot.qid, restoredScrollY: snapshot.scrollY,
      search: { p238: { questions: pageQuestions, notes: pageNotes }, motivation: { questions: motivationQuestions, notes: motivationNotes } },
      chapterCoreCount: w.state.queue.length
    });
  } catch (error) {
    result.textContent = JSON.stringify({ status: 'FAIL', error: error.message, stack: error.stack });
  }
});
</script>
